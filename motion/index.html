<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Show It — motion study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=block">
<style>
  :root { color-scheme: dark; --bg: #0d0d0d; --fg: #d8d4d0; --muted: #77716d; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 Outfit, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; box-sizing: border-box; }
  #stage { display: block; width: min(100%, calc((100vh - 90px) * 4 / 3)); aspect-ratio: 4 / 3; height: auto; background: #222; }
  .bar { display: flex; align-items: center; gap: 12px; width: min(100%, calc((100vh - 90px) * 4 / 3)); }
  button { background: #222; color: var(--fg); border: 1px solid #3a3634; border-radius: 6px; padding: 6px 14px; font: inherit; cursor: pointer; min-width: 70px; }
  button:hover { background: #2c2a29; }
  input[type=range] { flex: 1; accent-color: #e3262c; }
  #time { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 120px; text-align: right; }
</style>
</head>
<body>
<canvas id="stage" width="1156" height="867" aria-label="Motion graphics animation"></canvas>
<div class="bar">
  <button id="play" aria-pressed="true">Pause</button>
  <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Timeline">
  <span id="time">0.00s</span>
</div>
<script src="js/core.js"></script>
<script src="js/outlines.js"></script>
<script src="js/sprites.js"></script>
<script src="js/thermal.js"></script>
<script src="js/scenes-a.js"></script>
<script src="js/scenes-b.js"></script>
<script src="js/scenes-c.js"></script>
<script src="js/main.js"></script>
</body>
</html>
