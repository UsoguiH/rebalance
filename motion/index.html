<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Connector — reel</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 14px system-ui, sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
    #out { height: calc(100vh - 70px); aspect-ratio: 9 / 16; background: #fff; }
    body.render #out { height: auto; width: 1080px; }
    #ui { display: flex; gap: 10px; align-items: center; width: min(560px, 92vw); }
    #ui[hidden] { display: none; }
    #scrub { flex: 1; }
    button { padding: 6px 14px; }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "./node_modules/three/build/three.module.js",
      "three/addons/": "./node_modules/three/examples/jsm/"
    } }
  </script>
</head>
<body>
  <canvas id="out"></canvas>
  <div id="ui" hidden>
    <button id="play">Play</button>
    <input id="scrub" type="range" min="0" step="0.001" value="0">
    <span id="time">0.00s</span>
  </div>
  <!-- drop the ElevenLabs file at audio/voice.mp3 to preview in sync -->
  <audio id="vo" src="audio/voice.mp3" preload="auto"></audio>
  <script>if (location.search.includes('render')) document.body.classList.add('render');</script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
