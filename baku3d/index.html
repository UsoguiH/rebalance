<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Baku Madarame 3D — "The Kings are the top authority"</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#120708;overflow:hidden;font:13px system-ui,sans-serif;color:#f3e6c4}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #ui{position:fixed;left:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;background:#0008;padding:10px 12px;border-radius:10px;backdrop-filter:blur(4px);max-width:calc(100vw - 48px)}
  #ui label{display:flex;align-items:center;gap:8px;white-space:nowrap}
  #ui input[type=range]{width:120px}
  #ui button{background:#7d1224;color:#fff;border:0;border-radius:6px;padding:5px 10px;cursor:pointer}
  #ui a{color:#f0c75e}
  #msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);opacity:.8}
</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js",
               "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="msg">loading…</div>
<div id="ui">
  <label>Depth <input id="depth" type="range" min="0" max="1" step="0.01" value="0.55"></label>
  <label>3D lighting <input id="light" type="range" min="0" max="1.5" step="0.01" value="0.6"></label>
  <label><input id="sway" type="checkbox" checked> auto-rotate sway</label>
  <button id="reset">Reference view</button>
  <span>drag to orbit · scroll to zoom · <a href="model.html">procedural model</a></span>
</div>
<script type="module" src="./relief.js"></script>
</body>
</html>
