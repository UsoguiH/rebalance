<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monika Loading Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }

  /* Slate's preloader layout (their c-preloader CSS), on black */
  .c-preloader { z-index: 300; position: fixed; inset: 0; overflow: hidden; }
  .c-preloader.is-revealing { pointer-events: none; }
  .c-preloader_placeholder { position: fixed; inset: 0; z-index: 300; background-color: #000; }
  .c-preloader.is-playing .c-preloader_placeholder { display: none; }
  .c-preloader_stage { z-index: 0; width: 100%; position: absolute; top: 50%; left: 0; transform: translateY(-50%); }
  .c-preloader_rive { width: 100%; height: auto; display: block; }
  .c-preloader[data-orientation="portrait"] .c-preloader_stage { width: auto; height: 100%; top: 0; left: 50%; transform: translate(-50%); }
  .c-preloader[data-orientation="portrait"] .c-preloader_rive { width: auto; height: 100%; }
</style>
</head>
<body>
<div class="c-preloader" role="progressbar" aria-label="Loading"><div class="c-preloader_placeholder" aria-hidden="true"></div><div class="c-preloader_stage"><canvas class="c-preloader_rive" data-monika-scale="1.9"></canvas></div></div>

<script src="monika.js"></script>
<script src="vendor/rive-canvas/rive.js"></script>
<script src="vendor/rive-canvas/rive-wasm.js"></script>
<script src="slate-assets/rivs.js" onerror="void 0"></script>
<script>
  rive.RuntimeLoader.setWasmUrl(window.RIVE_CANVAS_WASM_URL);
</script>
<script src="slate-loader.js"></script>
</body>
</html>
