<!doctype html>
<html lang="ar" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="gsap.min.js"></script>
<style>
@font-face{font-family:"CairoA";font-weight:600;src:url(fonts/cairo-arabic-600-normal.woff2) format("woff2");}
@font-face{font-family:"CairoA";font-weight:700;src:url(fonts/cairo-arabic-700-normal.woff2) format("woff2");}
@font-face{font-family:"CairoA";font-weight:800;src:url(fonts/cairo-arabic-800-normal.woff2) format("woff2");}
@font-face{font-family:"CairoA";font-weight:900;src:url(fonts/cairo-arabic-900-normal.woff2) format("woff2");}
@font-face{font-family:"CairoL";font-weight:600;src:url(fonts/cairo-latin-600-normal.woff2) format("woff2");}
@font-face{font-family:"CairoL";font-weight:700;src:url(fonts/cairo-latin-700-normal.woff2) format("woff2");}
@font-face{font-family:"CairoL";font-weight:800;src:url(fonts/cairo-latin-800-normal.woff2) format("woff2");}
@font-face{font-family:"CairoL";font-weight:900;src:url(fonts/cairo-latin-900-normal.woff2) format("woff2");}
:root{
  --bg:#0A0F24; --bg2:#141A45; --card:#161D42; --card2:#1D2555; --line:rgba(255,255,255,.09);
  --indigo:#6366F1; --violet:#8B5CF6; --amber:#FFD24A; --mint:#34D399; --text:#F8FAFC; --mute:#A5B0D6; --red:#FB7185;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:"CairoL","CairoA",sans-serif;color:var(--text)}
#root{position:relative;width:1080px;height:1920px;overflow:hidden}
.scene,#title,#outro,.cap{direction:rtl}
.abs{position:absolute}
#base{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover}
/* ---------- cover title ---------- */
#title{position:absolute;left:0;top:0;width:1080px;height:1000px;pointer-events:none}
#title .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,28,.92) 0%,rgba(6,9,28,.78) 42%,rgba(6,9,28,0) 100%)}
#title .pill{position:absolute;top:96px;left:50%;transform:translateX(-50%);padding:12px 34px;border-radius:99px;background:rgba(99,102,241,.95);font-weight:800;font-size:40px;letter-spacing:.5px;white-space:nowrap;box-shadow:0 8px 30px rgba(99,102,241,.5)}
#title h1{position:absolute;top:200px;left:60px;width:960px;text-align:center;font-weight:900;font-size:132px;line-height:1.12;text-shadow:0 8px 40px rgba(0,0,0,.55)}
#title h1 .n{color:var(--amber)}
#title h2{position:absolute;top:500px;left:60px;width:960px;text-align:center;font-weight:800;font-size:66px;color:#E6EAFF;text-shadow:0 4px 24px rgba(0,0,0,.6)}
/* ---------- captions ---------- */
#caps{position:absolute;left:0;top:1545px;width:1080px;height:210px;pointer-events:none}
.cap{position:absolute;left:60px;top:0;width:960px;height:210px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:0 22px;
  font-weight:900;font-size:88px;line-height:1.18;text-align:center;visibility:hidden;opacity:0}
.cap .w{display:inline-block;color:#fff;-webkit-text-stroke:14px rgba(6,8,22,.92);paint-order:stroke fill;text-shadow:0 8px 24px rgba(0,0,0,.45)}
/* ---------- scenes ---------- */
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;
  background:radial-gradient(900px 700px at 15% 8%,rgba(99,102,241,.45),transparent 60%),radial-gradient(800px 700px at 95% 92%,rgba(139,92,246,.38),transparent 60%),linear-gradient(180deg,#0B1030,#0A0F24 60%,#070A1A)}
.tag{position:absolute;top:80px;left:0;width:1080px;text-align:center}
.tag span{display:inline-block;padding:14px 44px;border-radius:99px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.16);font-weight:800;font-size:46px;color:#fff;backdrop-filter:none}
.phone{position:absolute;left:182px;top:176px;width:716px;height:1419px;border-radius:88px;background:#05081c;padding:16px;box-shadow:0 60px 120px rgba(0,0,0,.55),0 0 0 3px rgba(255,255,255,.14),0 0 120px rgba(99,102,241,.35)}
.screen{position:relative;width:100%;height:100%;border-radius:72px;overflow:hidden;background:linear-gradient(180deg,#131a45,#0d1233);padding:30px 34px}
.notch{position:absolute;left:50%;top:14px;width:170px;height:38px;margin-left:-85px;border-radius:24px;background:#05081c;z-index:3}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-top:46px;height:76px}
.brand{display:flex;align-items:center;gap:14px;font-weight:900;font-size:44px}
.brand i{display:block;width:56px;height:56px;border-radius:17px;background:linear-gradient(135deg,var(--indigo),var(--violet));text-align:center;line-height:60px;font-style:normal;font-size:38px;font-weight:900}
.chip{padding:8px 22px;border-radius:99px;background:rgba(255,255,255,.08);font-weight:700;font-size:28px;color:var(--mute)}
.chip.a{background:rgba(255,210,74,.16);color:var(--amber)}
.prog{margin-top:26px;height:14px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.prog b{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--indigo),var(--violet))}
.qcard{margin-top:34px;padding:34px 32px;border-radius:38px;background:var(--card2);border:2px solid var(--line)}
.qcard .lb{font-weight:700;font-size:28px;color:var(--amber)}
.qcard .q{margin-top:14px;font-weight:800;font-size:50px;line-height:1.4}
.opts{margin-top:30px;display:flex;flex-direction:column;gap:20px}
.opt{position:relative;display:flex;align-items:center;gap:22px;height:104px;padding:0 26px;border-radius:30px;background:var(--card);border:3px solid var(--line);font-weight:800;font-size:46px}
.opt .k{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.1);text-align:center;line-height:58px;font-size:30px;font-weight:800;color:var(--mute)}
.opt .ck{margin-right:auto;width:52px;height:52px;border-radius:50%;background:var(--mint);opacity:0;text-align:center;line-height:52px;font-size:32px;color:#062b1f}
.opt.sel{border-color:var(--indigo);background:rgba(99,102,241,.22)}
.opt.ok{border-color:var(--mint);background:rgba(52,211,153,.2)}
.toast{position:absolute;left:34px;right:34px;bottom:44px;height:96px;border-radius:30px;background:linear-gradient(90deg,#10b981,#34d399);color:#04231a;display:flex;align-items:center;justify-content:center;gap:16px;font-weight:900;font-size:40px;opacity:0}
.shot{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.screen{padding:0!important;background:#fff!important}
/* leaderboard */
.podium{margin-top:34px;height:470px;display:flex;align-items:flex-end;justify-content:center;gap:18px}
.pod{width:170px;display:flex;flex-direction:column;align-items:center}
.pod .av{width:96px;height:96px;border-radius:50%;border:5px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:40px;margin-bottom:12px}
.pod .bar{width:100%;border-radius:26px 26px 0 0;display:flex;flex-direction:column;align-items:center;padding-top:14px;font-weight:900;font-size:60px;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.05))}
.pod .pt{font-size:26px;font-weight:700;color:var(--mute);margin-top:4px}
.pod.p1 .bar{height:290px;background:linear-gradient(180deg,rgba(255,210,74,.55),rgba(255,210,74,.08));color:var(--amber)}
.pod.p2 .bar{height:225px}.pod.p3 .bar{height:180px}
.rows{margin-top:26px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:20px;height:92px;padding:0 22px;border-radius:26px;background:var(--card);border:2px solid var(--line);font-weight:800;font-size:36px}
.row .rk{width:52px;text-align:center;font-weight:900;font-size:36px;color:var(--mute)}
.row .dot{width:58px;height:58px;border-radius:50%}
.row .nm{flex:1;font-family:"CairoL","CairoA";font-weight:700;font-size:32px;color:#DCE3FF}
.row .xp{font-weight:800;font-size:32px;color:var(--amber)}
.row.me{background:linear-gradient(90deg,rgba(99,102,241,.55),rgba(139,92,246,.4));border-color:rgba(255,255,255,.35)}
.row.me .nm{font-family:"CairoA","CairoL";font-size:38px;color:#fff;font-weight:900}
/* exam */
.timer{display:flex;align-items:center;gap:12px;padding:10px 26px;border-radius:99px;background:rgba(251,113,133,.16);color:var(--red);font-weight:900;font-size:40px;font-family:"CairoL"}
.tmw{display:grid}.tmw .tv{grid-area:1/1;opacity:0}.tmw .tv:first-child{opacity:1}
.segs{margin-top:26px;display:flex;gap:5px;flex-direction:row}
.segs i{flex:1;height:14px;border-radius:5px;background:rgba(255,255,255,.12)}
.segs i.d{background:var(--indigo)}
.btn{position:absolute;left:34px;right:34px;bottom:44px;height:112px;border-radius:34px;background:linear-gradient(90deg,var(--indigo),var(--violet));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:46px;box-shadow:0 20px 50px rgba(99,102,241,.45)}
.lvl .lv{padding:22px 28px 24px;margin-top:22px}.lvl .lv .v{font-size:48px}.lvl .track{margin-top:18px}.lvl .qcard{margin-top:24px;padding:24px 28px}.lvl .qcard .q{font-size:42px}.lvl .opts{margin-top:22px;gap:14px}.lvl .opt{height:88px;font-size:42px}.lvl .tip{margin-top:20px;padding:18px 24px;font-size:32px}.lvl .hdr{margin-top:34px}
/* levels */
.lv{margin-top:34px;padding:30px 30px 34px;border-radius:38px;background:var(--card2);border:2px solid var(--line)}
.lv .t{font-weight:700;font-size:28px;color:var(--mute)}
.lv .v{font-weight:900;font-size:56px;margin-top:2px}
.track{position:relative;margin-top:28px;height:16px;border-radius:9px;background:rgba(255,255,255,.12)}
.track .f{position:absolute;right:0;top:0;height:100%;border-radius:9px;background:linear-gradient(270deg,var(--mint),var(--indigo),var(--violet))}
.steps{margin-top:16px;display:flex;justify-content:space-between;font-weight:800;font-size:28px;color:var(--mute)}
.steps .on{color:#fff}
.tip{margin-top:26px;display:flex;align-items:center;gap:18px;padding:22px 26px;border-radius:30px;background:rgba(255,210,74,.12);border:2px solid rgba(255,210,74,.35);font-weight:800;font-size:34px;color:var(--amber)}
/* score */
.ring{position:absolute;left:190px;top:420px;width:700px;height:700px}
.ring svg{width:700px;height:700px;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:330px;line-height:1;font-family:"CairoL";letter-spacing:-6px}
.ring .num small{font-family:"CairoA";font-size:44px;letter-spacing:0;font-weight:800;color:var(--mute);margin-top:6px}
.sc-l1{position:absolute;top:1170px;left:0;width:1080px;text-align:center;font-weight:900;font-size:78px}
.sc-l2{position:absolute;top:1280px;left:0;width:1080px;text-align:center;font-weight:700;font-size:44px;color:var(--mute)}
/* outro */
#outro{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#070A1A}
#outro .bg{position:absolute;left:-60px;top:-60px;width:1200px;height:2040px;background:url(assets/last.png) center/cover;filter:blur(38px) saturate(1.1);transform:scale(1.05)}
#outro .dim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,10,26,.86),rgba(20,26,80,.82))}
#outro .logo{position:absolute;left:390px;top:600px;width:300px;height:300px;border-radius:70px;box-shadow:0 40px 100px rgba(88,204,2,.35),0 30px 80px rgba(0,0,0,.5)}
#outro .nm{position:absolute;top:950px;left:0;width:1080px;text-align:center;font-weight:900;font-size:170px;line-height:1.5}
#outro .sub{position:absolute;top:1250px;left:0;width:1080px;text-align:center;font-weight:800;font-size:64px;color:#DCE3FF}
#outro .url{position:absolute;top:1400px;left:50%;transform:translateX(-50%);padding:22px 64px;border-radius:99px;background:#fff;color:#0A0F24;font-family:"CairoL";font-weight:900;font-size:76px;letter-spacing:.5px;white-space:nowrap;direction:ltr;box-shadow:0 20px 60px rgba(0,0,0,.45)}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="__DUR__" data-width="1080" data-height="1920">

  <video id="base" class="clip" src="assets/base_video.mp4" muted playsinline data-start="0" data-duration="__VEND__" data-track-index="0"></video>

  <div id="s_score" class="scene clip" data-start="__score_s__" data-duration="__score_d__" data-track-index="2">
    <div class="tag"><span>ما هو قدراتي؟</span></div>
    <div class="phone" id="ph_score"><div class="screen"><img class="shot" id="score_i0" src="assets/app/intro.png" alt="" /></div></div>
  </div>

  <div id="s_quiz" class="scene clip" data-start="__quiz_s__" data-duration="__quiz_d__" data-track-index="2">
    <div class="tag"><span>أسئلة تفاعلية</span></div>
    <div class="phone" id="ph_quiz"><div class="screen"><img class="shot" id="quiz_i0" src="assets/app/lesson.png" alt="" /><img class="shot" id="quiz_i1" src="assets/app/fbgood.png" alt="" /></div></div>
  </div>

  <div id="s_board" class="scene clip" data-start="__board_s__" data-duration="__board_d__" data-track-index="2">
    <div class="tag"><span>المجلس · لوحة المتصدرين</span></div>
    <div class="phone" id="ph_board"><div class="screen"><img class="shot" id="board_i0" src="assets/app/league.png" alt="" /></div></div>
  </div>

  <div id="s_exam" class="scene clip" data-start="__exam_s__" data-duration="__exam_d__" data-track-index="2">
    <div class="tag"><span>محاكاة الاختبار</span></div>
    <div class="phone" id="ph_exam"><div class="screen"><img class="shot" id="exam_i0" src="assets/app/mock.png" alt="" /><img class="shot" id="exam_i1" src="assets/app/mocktest.png" alt="" /></div></div>
  </div>

  <div id="s_easy" class="scene clip" data-start="__easy_s__" data-duration="__easy_d__" data-track-index="2">
    <div class="tag"><span>ابدأ من الصفر</span></div>
    <div class="phone" id="ph_easy"><div class="screen"><img class="shot" id="easy_i0" src="assets/app/pop.png" alt="" /></div></div>
  </div>

  <div id="s_hard" class="scene clip" data-start="__hard_s__" data-duration="__hard_d__" data-track-index="2">
    <div class="tag"><span>تابع تقدّمك</span></div>
    <div class="phone" id="ph_hard"><div class="screen"><img class="shot" id="hard_i0" src="assets/app/stats.png" alt="" /></div></div>
  </div>

  <!-- ===== outro ===== -->
  <div id="outro" class="clip" data-start="__outro_s__" data-duration="__outro_d__" data-track-index="4">
    <div class="bg"></div><div class="dim"></div>
    <img class="logo" id="o_logo" src="assets/app/icon-512.png" alt="" />
    <div class="nm" id="o_nm">قدراتي</div>
    <div class="sub" id="o_sub">العب مجانًا من المتصفح</div>
    <div class="url" id="o_url">qudrati.xyz</div>
  </div>

  <!-- ===== cover title (frame 0) ===== -->
  <div id="title" class="clip" data-start="0" data-duration="__title_d__" data-track-index="5">
    <div id="titlein" class="abs" style="left:0;top:0;width:1080px;height:1000px"><div class="scrim"></div>
    <div class="pill">qudrati.xyz</div>
    <h1>كيف تجيب <span class="n">99</span></h1>
    <h2>في القدرات الكمي؟</h2></div>
  </div>

  <!-- ===== captions ===== -->
  <div id="caps"></div>
</div>

<script>
const TL = __TL__;
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const $ = (s) => document.querySelector(s);

/* ---------- captions: word-by-word highlight ---------- */
const caps = $("#caps");
TL.captions.forEach((c, i) => {
  const [s, e, text] = c;
  const el = document.createElement("div");
  el.className = "cap"; el.id = "cap" + i;
  const words = text.split(" ");
  const wts = words.map((w) => Math.max(2, w.length));
  const tot = wts.reduce((a, b) => a + b, 0);
  let acc = 0; const spans = [];
  words.forEach((w, k) => {
    const sp = document.createElement("span"); sp.className = "w"; sp.textContent = w; el.appendChild(sp);
    const ws = s + (e - s) * (acc / tot); acc += wts[k]; const we = s + (e - s) * (acc / tot);
    spans.push([sp, ws, we]);
  });
  caps.appendChild(el);
  tl.set(el, { autoAlpha: 1 }, s);
  tl.fromTo(el, { scale: 0.88, y: 16 }, { scale: 1, y: 0, duration: 0.16, ease: "back.out(2.2)" }, s);
  spans.forEach(([sp, ws, we]) => {
    tl.set(sp, { color: "#FFD24A", scale: 1.08 }, ws);
    tl.set(sp, { color: "#FFFFFF", scale: 1 }, we - 0.001);
  });
  tl.set(el, { autoAlpha: 0 }, e);
});

/* ---------- cover title ---------- */
const T0 = TL.title.out;
tl.to("#titlein", { y: -60, opacity: 0, duration: 0.22, ease: "power2.in" }, T0 - 0.1);

/* ---------- scene helpers ---------- */
const I = {}; TL.inserts.forEach((x) => (I[x.id] = x));
function enter(id, phone, dir) {
  const st = I[id].start;
  tl.fromTo("#s_" + id, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power1.out" }, st);
  if (phone) tl.fromTo(phone, { y: 140, x: dir || 0, scale: 0.94 }, { y: 0, x: 0, scale: 1, duration: 0.42, ease: "power3.out" }, st);
  tl.fromTo("#s_" + id + " .tag", { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, st + 0.05);
}
function leave(id, phone, x) {
  const en = I[id].end;
  tl.to("#s_" + id, { opacity: 0, duration: 0.16, ease: "power1.in" }, en - 0.16);
  if (phone) tl.to(phone, { y: x ? 0 : -70, x: x || 0, scale: x ? 1 : 0.96, duration: 0.26, ease: "power2.in" }, en - 0.26);
}
function pick(sel, st, okAt, ck) {
  tl.set(sel, { className: "opt sel" }, st);
  tl.set(sel, { className: "opt ok" }, okAt);
  if (ck) tl.fromTo(sel + " .ck", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(3)" }, okAt);
}

/* real-screen cutaways */
function fadeTo(id, b, st) {
  tl.fromTo("#" + id + "_i" + b, { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power1.out" }, st);
}
function tapPulse(sel, st) {
  tl.fromTo(sel, { scale: 1 }, { scale: 0.975, duration: 0.09, yoyo: true, repeat: 1, ease: "power1.inOut" }, st);
}
enter("score", "#ph_score");
leave("score", "#ph_score");

enter("quiz", "#ph_quiz");
tapPulse("#ph_quiz", I.quiz.start + 0.95);
fadeTo("quiz", 1, I.quiz.start + 1.05);
leave("quiz", "#ph_quiz");

enter("board", "#ph_board");
tl.to("#ph_board", { x: -1300, duration: 0.4, ease: "power3.in" }, I.board.end - 0.4);
tl.to("#s_board", { opacity: 0, duration: 0.12 }, I.board.end - 0.12);

/* exam slides in over the leaderboard */
tl.fromTo("#s_exam", { opacity: 0 }, { opacity: 1, duration: 0.1 }, I.exam.start);
tl.fromTo("#ph_exam", { x: 1300 }, { x: 0, duration: 0.42, ease: "power3.out" }, I.exam.start);
tl.fromTo("#s_exam .tag", { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, I.exam.start + 0.15);
tapPulse("#ph_exam", I.exam.start + 1.35);
fadeTo("exam", 1, I.exam.start + 1.45);
leave("exam", "#ph_exam");

enter("easy", "#ph_easy");
leave("easy", "#ph_easy");

enter("hard", "#ph_hard");
leave("hard", "#ph_hard");

/* outro */
const O = TL.outro.start;
tl.fromTo("#outro", { opacity: 0 }, { opacity: 1, duration: 0.2 }, O);
tl.fromTo("#o_logo", { scale: 0.4, opacity: 0, rotation: -12 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: "back.out(2)" }, O + 0.05);
tl.fromTo(["#o_nm", "#o_sub"], { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, stagger: 0.08, ease: "power3.out" }, O + 0.2);
tl.fromTo("#o_url", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" }, O + 0.4);

window.__timelines["main"] = tl;
tl.seek(0);
</script>
</body>
</html>
