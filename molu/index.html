<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0D0E">
<title>مولو — حواء وآدم: احجز صالونك بدقيقة</title>
<meta name="description" content="احجز في أقرب صالون نسائي أو حلاق رجالي بدقيقة واحدة. حجز فوري، تذكير قبل الموعد، وتقييمات حقيقية.">
<link rel="preload" href="fonts/ArefRuqaa-700-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/IBMPlexSansArabic-700-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="img/eve-560.webp" as="image">
<link rel="preload" href="img/adam-560.webp" as="image">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/springs.css">
<link rel="stylesheet" href="css/m3.css">
<link rel="stylesheet" href="css/molu.css">
</head>
<body>
<header class="hero">
  <div class="scene" aria-hidden="true">
    <div class="sc-window"><i></i><i></i></div>
    <div class="sc-light"></div>
    <div class="sc-mirror"></div>
    <div class="sc-lamp"></div><div class="sc-glow"></div>
    <div class="sc-pole"></div>
    <div class="sc-stones"><i></i><i></i></div>
    <div class="sc-stage">
      <i style="--i:0;--w:34px;--h:70px;--c1:#3a2a22;--c2:#7a5a44;--cap:#c9a46a"></i>
      <i style="--i:1;--w:46px;--h:96px;--c1:#d58f9e;--c2:#f4c9cf;--cap:#e9d9c8"></i>
      <i style="--i:2;--w:58px;--h:118px;--c1:#141414;--c2:#3c3c3c;--cap:#b08d57"></i>
      <i style="--i:3;--w:44px;--h:86px;--c1:#6d7f88;--c2:#bccbd2;--cap:#222"></i>
      <i style="--i:4;--w:32px;--h:62px;--c1:#9c3f2b;--c2:#e07a52;--cap:#1b1b1b"></i>
    </div>
    <div class="sc-vignette"></div>
  </div>
  <div class="wrap hero-top">
    <button class="glass-pill pressable enter" id="loc" type="button" aria-haspopup="menu"><i data-i="location_on_f" data-s="20"></i><span id="loc-l">الرياض - الروابي</span><i data-i="expand_more" data-s="18"></i></button>
    <a class="avatar-btn pressable enter" style="--d:1" href="account.html" aria-label="حسابي" id="me">م<span class="badge" id="me-badge"></span></a>
  </div>
  <form class="wrap hero-search enter" style="--d:2" action="explore.html" role="search">
    <label class="gsearch"><i data-i="search"></i><input name="q" placeholder="ابحث عن صالون أو خدمة" aria-label="ابحث عن صالون أو خدمة" enterkeyhint="search"></label>
  </form>
  <div class="hero-title" aria-live="polite">
    <h1 class="calli on"><span>موعدك</span><b>بدقيقة</b></h1>
    <p class="calli" aria-hidden="true"><span>جمالك</span><b>يستاهل</b></p>
    <p class="calli" aria-hidden="true"><span>أناقتك</span><b>بلمسة</b></p>
  </div>
  <div class="dots" role="tablist" aria-label="الشرائح"><button role="tab" aria-selected="true" data-go="0" aria-label="1"></button><button role="tab" data-go="1" aria-label="2"></button><button role="tab" data-go="2" aria-label="3"></button></div>
  <nav class="brand-strip" id="strip" aria-label="صالونات مميزة"></nav>
</header>

<div class="doors" id="doors">
  <a class="door eve pressable" href="explore.html?s=eve" data-door="eve">
    <span class="d-name">حواء</span><span class="d-for">صالونات ومراكز التجميل</span>
    <img src="img/eve-560.webp" alt="صالون نسائي" width="560" height="788">
    <span class="d-go">ادخلي<i data-i="arrow_back" data-s="18"></i></span>
  </a>
  <a class="door adam pressable" href="explore.html?s=adam" data-door="adam">
    <span class="d-name">آدم</span><span class="d-for">حلاقون ومراكز العناية</span>
    <img src="img/adam-560.webp" alt="حلاق رجالي" width="560" height="800">
    <span class="d-go">ادخل<i data-i="arrow_back" data-s="18"></i></span>
  </a>
  <a class="door promo pressable" href="explore.html?home=1">
    <span class="art"><i data-i="home_work" data-s="42"></i></span>
    <b>يجونك لين البيت</b><span>خدمات منزلية بنفس الأسعار</span>
    <span class="d-go">اكتشف<i data-i="arrow_back" data-s="18"></i></span>
  </a>
</div>

<main class="wrap" id="main"></main>
<script type="module" src="js/home.js"></script>
</body>
</html>
