<script>
// tiny on purpose: no framework, no app modules — the first screen paints immediately
(function () {
  var gate = document.getElementById('gate'), since = 0, calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('[data-k]').forEach(function (a) {
    var k = a.dataset.k;
    var press = function () { if (gate.dataset.go) return; if (gate.dataset.hot !== k) since = Date.now(); gate.dataset.hot = k; };
    a.addEventListener('pointerdown', press);
    a.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') press(); });
    a.addEventListener('pointerleave', function () { if (!gate.dataset.go) delete gate.dataset.hot; });
    a.addEventListener('pointercancel', function () { if (!gate.dataset.go) delete gate.dataset.hot; });
    // the chosen side gets its little scene (air and hearts for حواء; the pole spins and hair falls for آدم), then we go in
    a.addEventListener('click', function (e) {
      try { localStorage.setItem('molu_section', JSON.stringify(k)); sessionStorage.setItem('molu_gate', '1'); } catch (_) {}
      if (calm) return;
      e.preventDefault();
      if (gate.dataset.go) return;
      if (gate.dataset.hot !== k) since = Date.now();
      gate.dataset.hot = k; gate.dataset.go = k;
      setTimeout(function () { location.href = a.href; }, Math.max(120, 340 - (Date.now() - since)));
    });
  });
  addEventListener('pageshow', function (e) { if (e.persisted) { delete gate.dataset.go; delete gate.dataset.hot; } });
  var WARM = ['js/dist/explore.js', 'js/dist/shared-A4QC53EP.js', 'js/dist/shared-E32GMHFB.js', 'css/app.min.css']; // build:warm
  var warm = function () { WARM.forEach(function (h) {
    var l = document.createElement('link'); l.rel = /\.js$/.test(h) ? 'modulepreload' : 'preload'; if (!/\.js$/.test(h)) l.as = 'style'; l.href = h; document.head.appendChild(l); }); };
  'requestIdleCallback' in window ? requestIdleCallback(warm, { timeout: 800 }) : setTimeout(warm, 300);
  gate.addEventListener('pointerdown', warm, { once: true });
})();
</script>
