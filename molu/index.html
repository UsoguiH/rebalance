<script>
// Expanding panels: the open one shows its whole illustration at full width; tap/swipe the slim one to swap.
// Tiny on purpose: no framework, no app modules.
(function () {
  var box = document.getElementById('panels'), panels = box.querySelectorAll('.panel'), touched = false;
  var get = function () { try { return JSON.parse(localStorage.getItem('molu_section')); } catch (e) { return null; } };
  var set = function (k) { box.dataset.active = k; panels.forEach(function (p) { p.classList.toggle('on', p.dataset.k === k); p.setAttribute('aria-expanded', p.dataset.k === k); }); };
  set(get() === 'adam' ? 'adam' : 'eve');
  panels.forEach(function (p) {
    p.addEventListener('click', function (e) {
      touched = true;
      if (!p.classList.contains('on') && !e.target.closest('.pill')) { e.preventDefault(); set(p.dataset.k); return; }  // open it first
      try { localStorage.setItem('molu_section', JSON.stringify(p.dataset.k)); } catch (err) {}                    // …then enter
    });
  });
  // swipe up/down to swap
  var y0 = null;
  box.addEventListener('touchstart', function (e) { y0 = e.touches[0].clientY; }, { passive: true });
  box.addEventListener('touchend', function (e) {
    if (y0 === null) return; var dy = e.changedTouches[0].clientY - y0; y0 = null;
    if (Math.abs(dy) > 40) { touched = true; set(dy < 0 ? 'adam' : 'eve'); }
  });
  // if nobody has touched it after a moment, nudge the slim panel once to invite a tap
  setTimeout(function () { if (!touched) box.classList.add('nudge'); }, 2600);
  var warm = function () { ['js/explore.js', 'js/shell.js', 'js/data.js', 'js/icons.js', 'js/art.js', 'js/m3.js', 'js/motion.js', 'js/shapes.js', 'css/molu.css', 'css/m3.css', 'css/springs.css'].forEach(function (h) {
    var l = document.createElement('link'); l.rel = /\.js$/.test(h) ? 'modulepreload' : 'prefetch'; l.href = h; document.head.appendChild(l); }); };
  'requestIdleCallback' in window ? requestIdleCallback(warm, { timeout: 1500 }) : setTimeout(warm, 400);
})();
</script>
