<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d70466">
<title>Molu Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..1000&family=Readex+Pro:wght@300..700&display=swap">
<style>
  :root {
    /* Molu brand: accent #ff385c and its rose gradient, ink #222, white surfaces */
    --accent: #ff385c;
    --accent-ink: #da1249;
    --ink: #222;
    --white: #fff;
    --white-dim: rgba(255, 255, 255, 0.86);
    --stage: #120c10;
    --screen-gradient: linear-gradient(180deg,
      #b3023f 0%, #c8034f 14%, #d70466 26%, #e31c5f 38%, #ff385c 50%,
      #ff5b74 60%, #ff8292 70%, #ffadb8 80%, #ffd5db 90%, #fff0f3 100%);
    --font-latin: "DM Sans", -apple-system, "Helvetica Neue", Arial, sans-serif;
    --font-ar: "Readex Pro", "DM Sans", -apple-system, Tahoma, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--stage);
    font-family: var(--font-ar);
    color: var(--white);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  html[lang="en"] body { font-family: var(--font-latin); }

  /* Device: full-bleed on phones, a phone mock on wider screens. */
  .device { position: relative; width: 100vw; height: 100dvh; }
  .screen {
    position: absolute; inset: 0; overflow: hidden;
    background: var(--screen-gradient);
    touch-action: pan-y; user-select: none; -webkit-user-select: none;
  }
  .island, .home-bar { display: none; }
  @media (min-width: 560px) and (min-height: 700px) {
    body { background: radial-gradient(120% 90% at 50% 10%, #2a1420 0%, var(--stage) 60%); }
    .device {
      --w: min(390px, calc((100dvh - 48px) * 390 / 844));
      width: var(--w); height: calc(var(--w) * 844 / 390);
      border-radius: calc(var(--w) * 0.142);
      padding: calc(var(--w) * 0.031);
      background: linear-gradient(145deg, #3a3a44, #121216 40%, #2a2a31);
      box-shadow: 0 0 0 2px #4a4a55, 0 40px 90px rgba(0, 0, 0, 0.55), inset 0 0 0 2px #000;
    }
    .screen { inset: calc(var(--w) * 0.031); border-radius: calc(var(--w) * 0.115); }
    .island, .home-bar { display: block; }
    .island {
      position: absolute; z-index: 6; top: 11px; left: 50%; transform: translateX(-50%);
      width: 31%; height: 33px; border-radius: 20px; background: #000;
    }
    .home-bar {
      position: absolute; z-index: 6; bottom: 8px; left: 50%; transform: translateX(-50%);
      width: 36%; height: 5px; border-radius: 3px; background: var(--ink); opacity: 0.85;
    }
    .top { padding-top: 54px !important; }
  }

  canvas#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }

  /* Top row: logo, language, skip */
  .top {
    position: absolute; z-index: 4; inset: 0 0 auto;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 20px 0;
    display: flex; align-items: center; gap: 14px;
  }
  .brand {
    width: 36px; height: 36px; border-radius: 11px; background: var(--white);
    display: grid; place-items: center; box-shadow: 0 4px 14px rgba(120, 0, 40, 0.25);
  }
  .brand svg { width: 28px; height: 28px; }
  .top .grow { flex: 1; }
  .link {
    background: none; border: 0; padding: 8px 2px; margin: 0; cursor: pointer;
    font: 500 14px/1 var(--font-latin); color: var(--white-dim); transition: opacity 0.35s ease;
  }
  .link.lang { font-family: var(--font-ar); font-weight: 600; color: var(--white); }
  html[lang="ar"] .link.lang { font-family: var(--font-latin); }
  html[lang="ar"] .link.skip { font-family: var(--font-ar); }
  .link[hidden] { display: inline-block; opacity: 0; pointer-events: none; }
  .link:focus-visible, .cta:focus-visible { outline: 2px solid var(--white); outline-offset: 3px; border-radius: 8px; }

  /* Copy */
  .copy { position: absolute; z-index: 3; inset: 0 0 auto; top: calc(env(safe-area-inset-top, 0px) + 74px); pointer-events: none; text-align: center; }
  @media (min-width: 560px) and (min-height: 700px) { .copy { top: 108px; } }
  .slide-copy { position: absolute; inset: 0 0 auto; padding: 0 26px; }
  .screen:not(.gsap-copy) .slide-copy:not(.is-active) { visibility: hidden; }
  .slide-copy h1 {
    margin: 0; font: 700 34px/1.12 var(--font-ar); letter-spacing: 0; color: var(--white); text-wrap: balance;
    text-shadow: 0 2px 18px rgba(120, 0, 40, 0.18);
  }
  html[lang="en"] .slide-copy h1 { font: 700 36px/1.02 var(--font-latin); letter-spacing: -0.03em; }
  .slide-copy .ln { display: block; }
  .slide-copy p {
    margin: 12px auto 0; max-width: 290px;
    font: 400 14px/1.6 var(--font-ar); color: var(--white-dim);
  }
  html[lang="en"] .slide-copy p { font: 400 14px/1.45 var(--font-latin); max-width: 280px; }

  /* Slide 3 reminder card */
  .push {
    position: absolute; z-index: 3; left: 22px; right: 22px; top: 33%;
    display: flex; align-items: center; gap: 11px; padding: 11px 13px;
    border-radius: 20px; background: rgba(255, 255, 255, 0.94); color: var(--ink);
    box-shadow: 0 14px 40px rgba(120, 0, 40, 0.28);
    visibility: hidden;
  }
  .push .ic { width: 38px; height: 38px; flex: none; border-radius: 10px; background: #fff0f3; display: grid; place-items: center; }
  .push .ic svg { width: 30px; height: 30px; }
  .push .meta { display: flex; justify-content: space-between; font-size: 12px; color: #6a6a6a; }
  .push .body { min-width: 0; flex: 1; }
  .push .msg { margin-top: 3px; font-size: 13.5px; line-height: 1.35; font-weight: 500; }
  .stamp {
    position: absolute; z-index: 3; top: 78%; left: 50%;
    padding: 9px 15px; border-radius: 999px; background: var(--ink); color: var(--white);
    font-size: 14px; font-weight: 600; white-space: nowrap; display: inline-flex; gap: 7px; align-items: center;
    box-shadow: 0 10px 28px rgba(60, 0, 20, 0.3); visibility: hidden;
  }
  .stamp svg { width: 16px; height: 16px; }

  /* Bottom: progress and button */
  .footer {
    position: absolute; z-index: 4; inset: auto 0 0;
    padding: 0 20px calc(env(safe-area-inset-bottom, 0px) + 40px);
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  @media (min-width: 560px) and (min-height: 700px) { .footer { padding-bottom: 46px; } }
  .bars { display: flex; gap: 5px; align-items: center; }
  .bar { width: 10px; height: 5px; border-radius: 3px; background: rgba(34, 34, 34, 0.18); overflow: hidden; position: relative; }
  .bar i { position: absolute; inset: 0; background: var(--ink); transform: scaleX(0); transform-origin: var(--origin, right); }
  html[lang="en"] .bar i { --origin: left; }
  .cta {
    height: 52px; min-width: 52px; padding: 0 18px; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--ink); color: var(--white);
    display: inline-flex; align-items: center; justify-content: center; gap: 0;
    font: 600 16px/1 var(--font-ar); white-space: nowrap; overflow: hidden;
    box-shadow: 0 10px 26px rgba(60, 0, 20, 0.22);
  }
  html[lang="en"] .cta { font-family: var(--font-latin); }
  /* On the last slide the button warms into Molu's accent gradient (GSAP tweens --g) */
  .cta { position: relative; isolation: isolate; --g: 0; }
  .cta::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1; opacity: var(--g);
    background: linear-gradient(to right, #e61e4d 0%, #e31c5f 50%, #d70466 100%);
  }
  .cta .label { width: 0; opacity: 0; }
  .cta .label { display: inline-block; overflow: hidden; white-space: nowrap; }
  .cta svg { width: 20px; height: 20px; flex: none; }
  html[lang="ar"] .cta svg { transform: scaleX(-1); }

  .fallback { display: none; position: absolute; inset: 0; z-index: 1; place-items: center; }
  .no-webgl .fallback { display: grid; }
  .fallback svg { width: 40%; opacity: 0.9; }
  @media (prefers-reduced-motion: reduce) { .slide-copy .ch, .slide-copy .wd { filter: none !important; } }
</style>
</head>
<body>
<div class="device">
  <div class="island" aria-hidden="true"></div>
  <main class="screen" id="screen" aria-roledescription="carousel" aria-label="Molu">
    <canvas id="scene" aria-hidden="true"></canvas>
    <div class="fallback" aria-hidden="true">
      <svg viewBox="0 0 100 100"><use href="#fox"/></svg>
    </div>

    <div class="top">
      <span class="brand" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#fox"/></svg></span>
      <span class="grow"></span>
      <button class="link lang" id="lang" type="button" data-i18n="lang"></button>
      <button class="link skip" id="skip" type="button" data-i18n="skip"></button>
    </div>

    <div class="copy" aria-live="polite">
      <section class="slide-copy is-active" data-slide="0"><h1></h1><p></p></section>
      <section class="slide-copy" data-slide="1"><h1></h1><p></p></section>
      <section class="slide-copy" data-slide="2"><h1></h1><p></p></section>
    </div>

    <div class="push" id="push" aria-hidden="true">
      <span class="ic"><svg viewBox="0 0 100 100"><use href="#fox"/></svg></span>
      <span class="body">
        <span class="meta"><b data-i18n="brand"></b><span data-i18n="now"></span></span>
        <span class="msg" data-i18n="push"></span>
      </span>
    </div>
    <div class="stamp" id="stamp" aria-hidden="true">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 6.5 12 13 4.5"/></svg>
      <span data-i18n="booked"></span>
    </div>

    <div class="footer">
      <div class="bars" role="tablist" aria-label="Onboarding progress">
        <span class="bar" role="tab"><i></i></span>
        <span class="bar" role="tab"><i></i></span>
        <span class="bar" role="tab"><i></i></span>
      </div>
      <button class="cta" id="next" type="button">
        <span class="label" data-i18n="start"></span>
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h12M11 5l5 5-5 5"/></svg>
      </button>
    </div>
    <div class="home-bar" aria-hidden="true"></div>
  </main>
</div>

<!-- Molu's fox mark, from the site's favicon -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="fox" viewBox="0 0 100 100">
    <path d="M50 30 L37 29 L24 11 L19 36 L11 50 L14 64 L30 78 L44 91 L50 94 Z" fill="#352f2c"/>
    <path d="M26 17 L22 34 L33 30 Z" fill="#5e534c"/>
    <path d="M50 30 L63 28 L80 4 L85 38 L95 50 L90 62 L72 76 L56 90 L50 94 Z" fill="#bd4b61"/>
    <path d="M79 11 L82 34 L68 29 Z" fill="#7a2a3a"/>
    <path d="M14 64 L30 78 L44 91 L50 94 L50 70 L40 64 L28 58 Z" fill="#8c7d67"/>
    <path d="M95 50 L90 62 L72 76 L56 90 L50 94 L50 70 L60 64 L74 60 Z" fill="#f6ece4"/>
    <path d="M30 44 Q37 44.5 44 49 Q36.5 51.5 30 44 Z" fill="#0d0c0b"/>
    <path d="M68 49 Q62 44 56 48 Q62 52 68 49 Z" fill="#0d0c0b"/>
    <path d="M44 84 Q50 81 56 84 L50 93 Z" fill="#0d0c0b"/>
  </symbol>
</svg>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="app.js"></script>
</body>
</html>
