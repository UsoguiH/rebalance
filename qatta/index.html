<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--HEAD-START-->
<title>حاسبة القطّة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#131117">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: one screen. The bill ring sits on top (price in the middle, one colored piece per family),
   the families sit under it and open in place to tick who came. Dark on purpose, big type for older eyes. */
:root {
  --bg: #131117;
  --surface: #201d25;
  --surface-hi: #2a272f;
  --surface-top: #35323a;
  --line: #47434d;
  --fg: #ebe6ee;
  --muted: #cbc4cf;
  --faint: #8f8996;
  --primary: #f3eef8;
  --on-primary: #1b1620;
  --lilac: #cbb4f1;
  --lilac-bg: #3d2f5c;
  --yes: #7ee0a5;
  --yes-ink: #06301a;
  --wa: #25d366;
  --wa-ink: #05341a;
  --font: "Readex Pro", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; }
html { font-size: 18px; background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: 1rem; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
body.locked { overflow: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 3px solid var(--lilac); outline-offset: 3px; }
[hidden] { display: none !important; }
.ic { width: 1.4rem; height: 1.4rem; flex: none; display: block; }
.num { font-variant-numeric: tabular-nums; }

.glow {
  position: absolute; inset: 0 0 auto; height: 34rem; z-index: 0; pointer-events: none;
  background:
    radial-gradient(60% 55% at 50% 30%, rgba(124, 92, 190, .30), transparent 70%),
    radial-gradient(40% 40% at 85% 10%, rgba(92, 207, 196, .10), transparent 70%);
}
.app {
  position: relative; z-index: 1; max-width: 32rem; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 1.2rem 3rem;
  display: flex; flex-direction: column; gap: 1.6rem;
}

/* ——— the bill ring ——— */
.hero { display: flex; flex-direction: column; align-items: center; gap: .9rem; }
.ring-wrap { position: relative; width: min(84vw, 20rem); aspect-ratio: 1; max-width: 100%; }
.ring { width: 100%; height: 100%; display: block; overflow: visible; }
.ring-track { fill: none; stroke: rgba(255, 255, 255, .06); stroke-width: 24; }
.seg { fill: none; stroke-width: 24; stroke-linecap: round; cursor: pointer; transition: stroke-width .35s, opacity .35s; }
.ring.focus .seg { opacity: .22; }
.ring.focus .seg.on { opacity: 1; stroke-width: 30; }
.ring-center {
  position: absolute; inset: 17%; border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .15rem; text-align: center;
  background: radial-gradient(circle at 50% 35%, #2a2631, #1b1920 70%);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06), 0 20px 50px -20px rgba(0, 0, 0, .8);
}
.rc-full { display: flex; flex-direction: column; align-items: center; gap: .15rem; }
.rc-lbl { font-size: .9rem; color: var(--muted); }
.rc-num { display: flex; align-items: baseline; gap: .35rem; }
.rc-num b { font-size: clamp(2.3rem, 12vw, 2.9rem); font-weight: 700; line-height: 1.1; letter-spacing: -.5px; }
.rc-num small { font-size: 1rem; color: var(--muted); }
.rc-edit { display: inline-flex; align-items: center; gap: .3rem; margin-top: .35rem; padding: .3rem .8rem; border-radius: 999px; background: var(--lilac-bg); color: var(--lilac); font-size: .82rem; }
.rc-edit .ic { width: 1rem; height: 1rem; }
.rc-empty { display: flex; flex-direction: column; align-items: center; gap: .5rem; font-size: 1.15rem; font-weight: 600; line-height: 1.4; }
.rc-plus { width: 3.4rem; height: 3.4rem; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; }
.rc-plus .ic { width: 1.8rem; height: 1.8rem; stroke-width: 2.4; }
.per {
  display: flex; align-items: baseline; gap: .5rem; padding: .7rem 1.4rem; border-radius: 999px;
  background: var(--surface-hi); border: 1px solid rgba(255, 255, 255, .06);
}
.per span { color: var(--muted); font-size: 1rem; }
.per b { font-size: 1.6rem; font-weight: 700; }
.per small { color: var(--muted); font-size: .9rem; }
.heads { margin: 0; color: var(--muted); font-size: 1rem; }
.heads b { color: var(--fg); font-weight: 600; }

/* ——— families ——— */
.sec-h { display: flex; flex-direction: column; gap: .1rem; }
.sec-h h2 { margin: 0; font-size: 1.5rem; font-weight: 700; }
.sec-h p { margin: 0; color: var(--muted); font-size: 1rem; }
.list { list-style: none; margin: .9rem 0 0; padding: 0; display: flex; flex-direction: column; gap: .75rem; }
.fam { border-radius: 1.6rem; background: var(--surface); border: 1px solid rgba(255, 255, 255, .05); overflow: hidden; transition: background-color .3s, border-color .3s; }
.fam.open { background: var(--surface-hi); border-color: color-mix(in srgb, var(--c) 45%, transparent); }
.fam-head { width: 100%; display: grid; grid-template-columns: auto 1fr auto; align-items: center; column-gap: .9rem; row-gap: .35rem; padding: 1rem; text-align: start; }
.fam-head .av { grid-row: 1 / 3; }
.fam-meta { grid-column: 2 / 4; display: flex; align-items: center; justify-content: space-between; gap: .6rem; min-width: 0; }
.av {
  flex: none; width: 3.3rem; height: 3.3rem; border-radius: 50%;
  background: var(--c); color: #16131b; display: grid; place-items: center; font-size: 1.4rem; font-weight: 700;
  transition: filter .3s;
}
.fam.none .av { filter: grayscale(1) brightness(.6); }
.fam-name { min-width: 0; font-size: 1.3rem; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.fam-sub { font-size: 1rem; color: var(--muted); min-width: 0; }
.fam-amt { flex: none; display: inline-flex; align-items: baseline; gap: .25rem; padding: .45rem 1rem; border-radius: 999px; background: var(--surface-top); }
.fam-amt b { font-size: 1.25rem; font-weight: 700; }
.fam-amt small { font-size: .78rem; color: var(--muted); }
.chev { flex: none; width: 2.2rem; height: 2.2rem; border-radius: 50%; background: var(--surface-top); display: grid; place-items: center; color: var(--muted); }
.fam-body { height: 0; overflow: hidden; }
.fam-in { padding: 0 .8rem .9rem; display: flex; flex-direction: column; gap: .7rem; }
.mems { list-style: none; margin: 0; padding: .7rem 0 0; border-top: 1px solid rgba(255, 255, 255, .07); display: flex; flex-direction: column; gap: .5rem; }
.mem {
  width: 100%; min-height: 4rem; display: flex; align-items: center; gap: .8rem; padding: .5rem .55rem .5rem 1rem;
  border-radius: 1.2rem; background: rgba(255, 255, 255, .04); text-align: start;
  transition: background-color .3s;
}
.mem.on { background: rgba(126, 224, 165, .10); }
.mem-name { flex: 1; min-width: 0; font-size: 1.2rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .3s; }
.mem:not(.on) .mem-name { color: var(--faint); }
.tag {
  flex: none; display: inline-flex; align-items: center; justify-content: center; gap: .35rem;
  min-width: 6.6rem; height: 3rem; padding: 0 1rem; border-radius: 999px;
  font-size: 1.05rem; font-weight: 600; border: 2px solid var(--line); color: var(--muted);
  transition: background-color .3s, border-color .3s, color .3s;
}
.tag .ic { width: 1.2rem; height: 1.2rem; stroke-width: 2.8; }
.mem.on .tag { background: var(--yes); border-color: var(--yes); color: var(--yes-ink); }
.fam-actions { display: flex; gap: .6rem; }
.fam-actions button { height: 3.4rem; border-radius: 999px; font-size: 1.05rem; font-weight: 600; padding: 0 1.2rem; }
.btn-all { background: var(--surface-top); }
.btn-done { flex: 1; background: var(--primary); color: var(--on-primary); }

/* ——— send & small actions ——— */
.end { display: flex; flex-direction: column; gap: .7rem; }
.btn { height: 3.8rem; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: .6rem; font-size: 1.15rem; font-weight: 600; }
.btn .ic { width: 1.5rem; height: 1.5rem; }
.btn-wa { background: var(--wa); color: var(--wa-ink); }
.btn-soft { background: var(--surface-hi); }
.quiet { display: flex; justify-content: center; gap: .4rem; flex-wrap: wrap; margin-top: .4rem; }
.quiet button { height: 2.8rem; padding: 0 1rem; border-radius: 999px; color: var(--muted); font-size: .95rem; display: inline-flex; align-items: center; gap: .4rem; }
.quiet .ic { width: 1.1rem; height: 1.1rem; }

/* ——— sheets ——— */
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .62); }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-width: 32rem; margin: 0 auto;
  border-radius: 1.9rem 1.9rem 0 0; background: #1b191f; border-top: 1px solid rgba(255, 255, 255, .07);
}
.sheet-in {
  max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain;
  padding: 0 max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: .9rem;
}
.sheet-in > * { flex-shrink: 0; }
.sheet-top { display: flex; align-items: center; justify-content: space-between; gap: .6rem; padding-top: 1.1rem; touch-action: none; }
.sheet-top h2 { margin: 0; font-size: 1.3rem; font-weight: 700; }
.x-btn { height: 2.8rem; padding: 0 1rem; border-radius: 999px; background: var(--surface-hi); display: inline-flex; align-items: center; gap: .35rem; font-size: .95rem; color: var(--muted); }
.x-btn .ic { width: 1.1rem; height: 1.1rem; }
.handle { position: absolute; top: .45rem; left: 50%; width: 2.6rem; height: .3rem; margin-left: -1.3rem; border-radius: 9px; background: var(--line); }
.disp { display: flex; flex-direction: column; align-items: center; gap: .2rem; padding: .4rem 0; }
.disp-row { display: flex; align-items: baseline; gap: .5rem; }
.disp-val { display: flex; direction: ltr; font-size: clamp(2.8rem, 15vw, 3.6rem); font-weight: 700; line-height: 1.15; min-height: 4.2rem; padding: 0 .4rem; border-radius: 1rem; }
.disp-val span { display: inline-block; }
.disp-val.ph { color: var(--faint); }
.disp-val.fresh { background: var(--lilac-bg); }
.disp-row small { font-size: 1.1rem; color: var(--muted); }
.disp-hint { font-size: 1rem; color: var(--lilac); min-height: 1.5rem; }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; direction: ltr; }
.key { height: 4.2rem; border-radius: 1.3rem; background: var(--surface-hi); font-size: 1.9rem; font-weight: 600; display: grid; place-items: center; }
.key.fn { background: transparent; border: 2px solid var(--surface-top); font-size: 1.05rem; color: var(--muted); }
.key .ic { width: 1.8rem; height: 1.8rem; }
.btn-ok { height: 4rem; border-radius: 999px; background: var(--primary); color: var(--on-primary); font-size: 1.25rem; font-weight: 700; }
.field { display: flex; flex-direction: column; gap: .5rem; }
.field span { color: var(--muted); font-size: .95rem; }
.field textarea {
  width: 100%; min-height: 16rem; resize: vertical; border-radius: 1.2rem; padding: 1rem 1.1rem;
  background: var(--surface); border: 1px solid var(--line); outline: none; font-size: 1.1rem; line-height: 1.8;
}
.field textarea:focus { border-color: var(--lilac); }

.toast {
  position: fixed; z-index: 40; left: 0; right: 0; bottom: calc(1.2rem + env(safe-area-inset-bottom, 0px));
  margin: 0 auto; width: fit-content; max-width: calc(100% - 32px);
  display: flex; align-items: center; gap: .8rem; padding: .6rem .6rem .6rem 1.3rem; border-radius: 999px;
  background: var(--primary); color: var(--on-primary); font-size: 1rem; font-weight: 500;
  box-shadow: 0 14px 40px -10px rgba(0, 0, 0, .7);
}
.toast:not(.has-undo) { padding: .8rem 1.4rem; }
.toast button { height: 2.6rem; padding: 0 1.1rem; border-radius: 999px; background: var(--on-primary); color: var(--primary); font-weight: 600; }
.confetti { position: fixed; inset: 0; z-index: 50; pointer-events: none; overflow: hidden; }
.confetti i { position: absolute; display: block; border-radius: 2px; }
</style>
<!--HEAD-END-->
</head>
<body>
<!--BODY-START-->
<div class="glow" aria-hidden="true"></div>
<main class="app" id="app" dir="rtl" lang="ar">
  <section class="hero" aria-label="الفاتورة">
    <div class="ring-wrap">
      <svg class="ring" id="ring" viewBox="0 0 300 300">
        <circle class="ring-track" cx="150" cy="150" r="128"></circle>
        <g id="segs" transform="rotate(-90 150 150)"></g>
      </svg>
      <button class="ring-center press" id="priceBtn" type="button">
        <span class="rc-empty" id="rcEmpty"><span class="rc-plus" data-ic="plus"></span>اضغط هنا<br>واكتب المبلغ</span>
        <span class="rc-full" id="rcFull" hidden>
          <span class="rc-lbl">مبلغ الفاتورة</span>
          <span class="rc-num"><b class="num" id="totalVal">٠</b><small>ر.س</small></span>
          <span class="rc-edit"><span data-ic="edit"></span>غيّر المبلغ</span>
        </span>
      </button>
    </div>
    <div class="per" id="perBox" hidden><span>على الشخص</span><b class="num" id="perVal">٠</b><small>ر.س</small></div>
    <p class="heads" id="headsLine"></p>
  </section>

  <section class="fams" aria-labelledby="famsTitle">
    <div class="sec-h">
      <h2 id="famsTitle">مين حضر؟</h2>
      <p>اضغط على العائلة وحدد مين جاء</p>
    </div>
    <ul class="list" id="list"></ul>
  </section>

  <section class="end" aria-label="إرسال النتيجة">
    <a class="btn btn-wa press" id="waBtn" href="#" target="_blank" rel="noopener"><span data-ic="send"></span>أرسل النتيجة في واتساب</a>
    <button class="btn btn-soft press" id="copyBtn" type="button"><span data-ic="copy"></span>انسخ النتيجة</button>
    <div class="quiet">
      <button id="resetBtn" type="button"><span data-ic="redo"></span>الكل حاضر من جديد</button>
      <button id="editBtn" type="button"><span data-ic="edit"></span>عدّل الأسماء</button>
    </div>
  </section>
</main>

<div class="scrim" id="scrim" hidden></div>

<div class="sheet" id="priceSheet" role="dialog" aria-modal="true" aria-labelledby="priceTitle" hidden dir="rtl">
  <span class="handle" aria-hidden="true"></span>
  <div class="sheet-in">
    <div class="sheet-top"><h2 id="priceTitle">كم مبلغ الفاتورة؟</h2><button class="x-btn press" type="button" data-close><span data-ic="close"></span>إغلاق</button></div>
    <div class="disp">
      <div class="disp-row"><span class="disp-val num" id="dispVal"></span><small>ر.س</small></div>
      <span class="disp-hint" id="dispHint"></span>
    </div>
    <div class="keys" id="keys"></div>
    <button class="btn-ok press" id="priceOk" type="button">تم</button>
  </div>
</div>

<div class="sheet" id="namesSheet" role="dialog" aria-modal="true" aria-labelledby="namesTitle" hidden dir="rtl">
  <span class="handle" aria-hidden="true"></span>
  <div class="sheet-in">
    <div class="sheet-top"><h2 id="namesTitle">الأسماء</h2><button class="x-btn press" type="button" data-close><span data-ic="close"></span>إغلاق</button></div>
    <label class="field"><span>كل عائلة في سطر: اسم العائلة، بعدها نقطتين، بعدها الأفراد بينهم فاصلة</span>
      <textarea id="namesText" spellcheck="false"></textarea>
    </label>
    <button class="btn-ok press" id="namesOk" type="button">احفظ</button>
  </div>
</div>

<div class="sheet" id="copySheet" role="dialog" aria-modal="true" aria-labelledby="copyTitle" hidden dir="rtl">
  <span class="handle" aria-hidden="true"></span>
  <div class="sheet-in">
    <div class="sheet-top"><h2 id="copyTitle">انسخ النتيجة</h2><button class="x-btn press" type="button" data-close><span data-ic="close"></span>إغلاق</button></div>
    <label class="field"><span>حدّد النص وانسخه</span><textarea id="copyText" readonly></textarea></label>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden><span id="toastMsg"></span><button id="toastUndo" type="button" hidden>تراجع</button></div>
<div class="confetti" id="confetti" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
'use strict';

// ——— الأسماء (تجريبية). بدّلها بأسماء العوائل الحقيقية ———
// الاسم اللي يبدأ بـ "-" يعني ما حضر.
const DEFAULT_FAMILIES = [
  ['عائلة عادل', ['عادل', 'نورة', 'محمد', '-ريم', 'فهد']],
  ['عائلة خالد', ['خالد', 'سارة', 'عبدالله', 'لمى']],
  ['عائلة فيصل', ['فيصل', 'هيا', 'تركي']],
  ['عائلة ناصر', ['ناصر', 'منيرة', 'سلطان', 'جود', 'العنود', '-يوسف']],
  ['عائلة ماجد', ['ماجد', 'دانة']],
];
const COLORS = ['#5ccfc4', '#7ee0b0', '#f2dc8c', '#ff9f7a', '#9b6cf0', '#7fb4ff', '#f59ac8', '#c8e07a', '#ffc46b', '#a0a4ff'];

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TOUCH = matchMedia('(pointer: coarse)').matches;
if (REDUCED) gsap.globalTimeline.timeScale(20);
document.documentElement.lang = 'ar';
document.documentElement.dir = 'rtl';

// ——— springs: real spring physics as GSAP eases ———
function springEase({ stiffness = 200, damping = 22, mass = 1, duration = 1 }) {
  const w0 = Math.sqrt(stiffness / mass), z = damping / (2 * Math.sqrt(stiffness * mass));
  const wd = w0 * Math.sqrt(Math.abs(1 - z * z));
  const f = z < 1
    ? p => { const t = p * duration; return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
    : p => { const t = p * duration; return 1 - Math.exp(-w0 * t) * (1 + w0 * t); };
  const end = f(1);
  return p => f(p) / end;
}
gsap.registerEase('spring', springEase({ stiffness: 200, damping: 22, mass: 1.2, duration: 1 }));
gsap.registerEase('springSoft', springEase({ stiffness: 272, damping: 33, mass: 1, duration: .4 }));
gsap.registerEase('springOut', springEase({ stiffness: 170, damping: 26, mass: 1, duration: .7 }));

const svg = p => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I = {
  plus: svg('<path d="M12 5v14M5 12h14"/>'),
  edit: svg('<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>'),
  close: svg('<path d="M18 6 6 18M6 6l12 12"/>'),
  check: svg('<path class="ck" d="M20 6 9 17l-5-5" pathLength="1"/>'),
  chev: svg('<path d="m6 9 6 6 6-6"/>'),
  back: svg('<path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Z"/><path d="m18 9-6 6M12 9l6 6"/>'),
  send: svg('<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/>'),
  copy: svg('<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'),
  redo: svg('<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>'),
};
$$('[data-ic]').forEach(el => { el.innerHTML = I[el.dataset.ic]; });

// ——— state ———
const KEY = 'qatta.v3';
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function makeFamily(name, members) {
  return { id: uid(), name, members: members.map(n => ({ id: uid(), name: n.replace(/^-/, ''), present: !n.startsWith('-') })) };
}
function load() {
  try {
    const raw = localStorage.getItem(KEY) || localStorage.getItem('qatta.v1');
    if (raw) {
      const s = JSON.parse(raw);
      if (s && Array.isArray(s.families)) {
        return {
          total: +s.total || 0,
          families: s.families.map(f => ({ id: f.id || uid(), name: String(f.name), members: (f.members || []).map(m => ({ id: m.id || uid(), name: String(m.name), present: m.present !== false })) })),
        };
      }
    }

  return { total: 1250, families: DEFAULT_FAMILIES.map(([n, m]) => makeFamily(n, m)) };
}
let state = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ } }
const color = i => COLORS[i % COLORS.length];

// ——— numbers ———
const NF = new Intl.NumberFormat('ar-SA-u-nu-arab', { maximumFractionDigits: 2 });
const NFI = new Intl.NumberFormat('ar-SA-u-nu-arab', { maximumFractionDigits: 0 });
const fmt = n => NF.format(Math.round((+n || 0) * 100) / 100);

  for (const f of state.families) {

function setNum(el, to, anim = true) {

// ——— the ring: one piece per family, sized by how many of them came ———

}

}
function updateRing(c, anim = true, stagger = 0) {

  state.families.forEach((f, i) => {
    const s = segs.get(f.id);

    const start = acc;
    acc += len;
    if (!s) return;
    gsap.killTweensOf(s);
    if (!anim) { s.start = start; s.len = len; drawSeg(s); return; }

// ——— update everything from state ———
function update(anim = true) {

// ——— open / close a family in place ———

$$('.sheet').forEach(sh => {

// ——— names editor ———
function splitNames(s) {
  return String(s).split(/[،,؛;\n]+/).map(t => t.replace(/^[\s\-•*·]+/, '').trim()).filter(Boolean);
}
function parseNames(text) {
  const out = [];
  let fam = null;
  for (const raw of String(text).split(/\r?\n/)) {
    const line = raw.trim();
    if (!line) { fam = null; continue; }
    const m = line.match(/^(.+?)\s*[:：]\s*(.*)$/);
    if (m) { fam = { name: m[1].replace(/^[\s\-•*·]+/, '').trim(), members: splitNames(m[2]) }; out.push(fam); }
    else if (fam) fam.members.push(...splitNames(line));
    else { fam = { name: line, members: [] }; out.push(fam); }
  }
  return out.filter(f => f.name);
}
$('#editBtn').addEventListener('click', () => {
  $('#namesText').value = state.families.map(f => `${f.name}: ${f.members.map(m => m.name).join('، ')}`).join('\n');
  openSheet('namesSheet');
});
$('#namesOk').addEventListener('click', () => {
  const parsed = parseNames($('#namesText').value);
  if (!parsed.length) { shake($('#namesText')); return; }
  const before = JSON.stringify(state);
  const oldFams = new Map(state.families.map(f => [f.name, f]));
  state.families = parsed.map(p => {
    const old = oldFams.get(p.name);
    const pool = new Map();
    if (old) old.members.forEach(m => { if (!pool.has(m.name)) pool.set(m.name, []); pool.get(m.name).push(m); });
    return {
      id: old ? old.id : uid(), name: p.name,
      members: p.members.map(n => (pool.get(n) && pool.get(n).shift()) || { id: uid(), name: n, present: true }),
    };
  });
  save(); closeSheet();
  setTimeout(() => { rebuild(true); toast('حفظنا الأسماء', before); }, 220);
});

// ——— send the result ———
function summary() {

  for (const f of state.families) {
    const n = c.rows.get(f.id);
    L.push(n ? `${f.name} (${fmt(n)}): ${fmt(c.share(f.id))} ريال` : `${f.name}: ما حضر أحد`);
  }
  return L.join('\n');
}

// ——— press feedback & confetti ———
document.addEventListener('pointerdown', e => {
  const p = e.target.closest('.press');
  if (!p) return;
  gsap.to(p, { scale: .96, duration: .15, ease: 'power2.out' });
  const up = () => {
    gsap.to(p, { scale: 1, duration: .5, ease: 'springOut', clearProps: 'scale' });

  };

function burst(x, y, count, spread) {
  const layer = $('#confetti');
  for (let i = 0; i < count; i++) {
    const p = document.createElement('i');
    const w = gsap.utils.random(5, 9);
    p.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${w * 1.4}px;background:${COLORS[i % COLORS.length]}`;
    layer.appendChild(p);
    const a = gsap.utils.random(-Math.PI * .95, -Math.PI * .05), sp = gsap.utils.random(spread * .4, spread);
    gsap.timeline({ onComplete: () => p.remove() })
      .to(p, { x: Math.cos(a) * sp, y: Math.sin(a) * sp, rotation: gsap.utils.random(-260, 260), duration: .6, ease: 'power3.out' })
      .to(p, { y: `+=${spread * 1.4}`, opacity: 0, duration: gsap.utils.random(.8, 1.3), ease: 'power1.in' });
  }
}

// ——— boot ———
function rebuild(anim) {
  openId = null;
  ring.classList.remove('focus');
  buildRing();
  renderList();
  update(false);
  if (anim) {
    segs.forEach(s => { s.start = 0; s.len = 0; drawSeg(s); });
    updateRing(compute(), true, .08);
    gsap.fromTo('.fam', { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: .6, stagger: .05, ease: 'springSoft', clearProps: 'transform,opacity' });
  }
}
function intro() {
  const blur = px => TOUCH ? {} : { filter: `blur(${px}px)` };
  const c = compute();
  const tl = gsap.timeline();
  tl.fromTo('.ring-center', { scale: .6, opacity: 0 }, { scale: 1, opacity: 1, duration: 1, ease: 'spring', clearProps: 'all' }, 0)
    .fromTo('.ring-track', { opacity: 0 }, { opacity: 1, duration: .6 }, 0)
    .add(() => {
      segs.forEach(s => { s.start = 0; s.len = 0; drawSeg(s); });
      updateRing(c, true, .09);
    }, .15)
    .add(() => {
      const t = $('#totalVal'); t.dataset.val = 0; setNum(t, state.total);
      const p = $('#perVal'); p.dataset.val = 0; setNum(p, c.per);
    }, .3)
    .fromTo(['#perBox', '#headsLine'], { y: 16, opacity: 0, ...blur(6) }, { y: 0, opacity: 1, ...blur(0), duration: .6, stagger: .06, ease: 'springSoft', clearProps: 'all' }, .45)
    .fromTo('.sec-h > *', { y: 24, opacity: 0, ...blur(8) }, { y: 0, opacity: 1, ...blur(0), duration: .6, stagger: .06, ease: 'springSoft', clearProps: 'all' }, .55)
    .fromTo('.fam', { y: 50, opacity: 0, ...blur(8) }, { y: 0, opacity: 1, ...blur(0), duration: .7, stagger: .06, ease: 'springSoft', clearProps: 'transform,opacity,filter' }, .62)
    .fromTo('.end > *', { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: .6, stagger: .06, ease: 'springSoft', clearProps: 'all' }, .9);
}
buildRing();
renderList();
update(false);
intro();
})();
</script>
<!--BODY-END-->
