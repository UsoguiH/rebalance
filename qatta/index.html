<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--HEAD-START-->
<title>حاسبة القطّة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#131117">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: one screen in three numbered steps, read top to bottom.
   1) the bill ring (price in the middle, one colored piece per family)
   2) every family with all its names visible; tap a name to mark who did not come
   3) send or listen to the result. Big type and big targets for an elderly user. */
:root {
  --bg: #131117;
  --surface: #201d25;
  --surface-hi: #2a272f;
  --surface-top: #35323a;
  --line: #57525e;
  --fg: #f1ecf4;
  --muted: #d0c9d4;
  --faint: #9a94a1;
  --primary: #f3eef8;
  --on-primary: #1b1620;
  --lilac: #cbb4f1;
  --lilac-bg: #3d2f5c;
  --yes: #7ee0a5;
  --yes-ink: #06301a;
  --wa: #25d366;
  --wa-ink: #05341a;
  --font: "Readex Pro", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; }
html { font-size: 20px; background: var(--bg); }
@media (max-width: 360px) { html { font-size: 18px; } }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: 1rem; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
body.locked { overflow: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 3px solid var(--lilac); outline-offset: 3px; }
[hidden] { display: none !important; }
.ic { width: 1.3rem; height: 1.3rem; flex: none; display: block; }
.num { font-variant-numeric: tabular-nums; }

.glow {
  position: absolute; inset: 0 0 auto; height: 34rem; z-index: 0; pointer-events: none;
  background:
    radial-gradient(60% 50% at 50% 32%, rgba(124, 92, 190, .28), transparent 70%),
    radial-gradient(40% 40% at 85% 10%, rgba(92, 207, 196, .10), transparent 70%);
}
.app {
  position: relative; z-index: 1; max-width: 30rem; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 1rem 3rem;
  display: flex; flex-direction: column; gap: 2.4rem;
}

/* ——— numbered steps ——— */
.step { display: flex; flex-direction: column; gap: 1rem; }
.step-h { margin: 0; display: flex; align-items: center; gap: .7rem; font-size: 1.3rem; font-weight: 700; line-height: 1.35; }
.step-n {
  position: relative; flex: none; width: 2.3rem; height: 2.3rem; border-radius: 50%;
  display: grid; place-items: center; background: var(--primary); color: var(--on-primary); font-size: 1.1rem; font-weight: 700;
}
.step-n .ic { width: 1.3rem; height: 1.3rem; stroke-width: 3; }
.step-n.done { background: var(--yes); color: var(--yes-ink); }
.step-p { margin: -.5rem 0 0; color: var(--muted); font-size: 1rem; display: flex; flex-wrap: wrap; gap: .3rem .9rem; }
.key-dot { display: inline-flex; align-items: center; gap: .35rem; }
.key-dot i { width: .9rem; height: .9rem; border-radius: 50%; display: inline-block; }
.key-dot .g { background: var(--yes); }
.key-dot .x { border: 2px dashed var(--faint); }

/* ——— the bill ring ——— */
.hero { display: flex; flex-direction: column; align-items: center; gap: .8rem; }
.ring-wrap { position: relative; width: min(82vw, 17rem); aspect-ratio: 1; max-width: 100%; }
.ring { width: 100%; height: 100%; display: block; overflow: visible; }
.ring-track { fill: none; stroke: rgba(255, 255, 255, .06); stroke-width: 24; }
.seg { fill: none; stroke-width: 24; stroke-linecap: round; cursor: pointer; }
.ring-center {
  position: absolute; inset: 15%; border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  background: radial-gradient(circle at 50% 35%, #2c2833, #1b1920 70%);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .07), 0 20px 50px -20px rgba(0, 0, 0, .8);
}
.rc-full { display: flex; flex-direction: column; align-items: center; gap: .1rem; }
.rc-lbl { font-size: .85rem; color: var(--muted); }
.rc-num { display: flex; align-items: baseline; gap: .3rem; }
.rc-num b { font-size: clamp(2.1rem, 11vw, 2.6rem); font-weight: 700; line-height: 1.15; }
.rc-num small { font-size: .9rem; color: var(--muted); }
.rc-edit { display: inline-flex; align-items: center; gap: .3rem; margin-top: .3rem; padding: .25rem .8rem; border-radius: 999px; background: var(--lilac-bg); color: var(--lilac); font-size: .8rem; }
.rc-edit .ic { width: .95rem; height: .95rem; }
.rc-empty { display: flex; flex-direction: column; align-items: center; gap: .45rem; font-size: 1.1rem; font-weight: 700; line-height: 1.35; }
.rc-plus { width: 3.3rem; height: 3.3rem; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; }
.rc-plus .ic { width: 1.7rem; height: 1.7rem; stroke-width: 2.6; }
.per {
  display: flex; align-items: baseline; gap: .45rem; padding: .65rem 1.4rem; border-radius: 999px;
  background: var(--surface-hi); border: 1px solid rgba(255, 255, 255, .07);
}
.per span { color: var(--muted); }
.per b { font-size: 1.6rem; font-weight: 700; }
.per small { color: var(--muted); font-size: .9rem; }
.heads { margin: 0; color: var(--muted); }
.heads b { color: var(--fg); font-weight: 600; }

/* ——— families, always open ——— */
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1rem; }
.fam { border-radius: 1.5rem; background: var(--surface); border: 1px solid rgba(255, 255, 255, .06); padding: 1rem; display: flex; flex-direction: column; gap: .9rem; }
.fam-head { display: grid; grid-template-columns: auto 1fr auto; align-items: center; column-gap: .8rem; }
.av {
  grid-row: 1 / 3; width: 2.9rem; height: 2.9rem; border-radius: 50%;
  background: var(--c); color: #16131b; display: grid; place-items: center; font-size: 1.25rem; font-weight: 700;
  transition: filter .3s;
}
.fam.none .av { filter: grayscale(1) brightness(.6); }
.fam-name { min-width: 0; font-size: 1.2rem; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.fam-sub { grid-column: 2; font-size: .9rem; color: var(--muted); }
.fam-amt { grid-column: 3; grid-row: 1 / 3; display: flex; flex-direction: column; align-items: center; padding: .4rem .9rem; border-radius: 1rem; background: var(--surface-top); min-width: 4.6rem; }
.fam-amt b { font-size: 1.35rem; font-weight: 700; line-height: 1.2; }
.fam-amt small { font-size: .75rem; color: var(--muted); }
.mems { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .55rem; }
.mem {
  width: 100%; min-height: 3.7rem; display: flex; align-items: center; gap: .55rem; padding: .45rem .7rem .45rem .5rem;
  border-radius: 1.1rem; text-align: start; border: 2px dashed var(--line); background: transparent; color: var(--faint);
  transition: background-color .25s, border-color .25s, color .25s;
}
.mem.on { background: var(--yes); border: 2px solid var(--yes); color: var(--yes-ink); }
.mk { flex: none; width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .08); }
.mem.on .mk { background: rgba(6, 48, 26, .14); }
.mk .ic { width: 1.15rem; height: 1.15rem; stroke-width: 3; }
.mt { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.mn { font-size: 1.1rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mem:not(.on) .mn { text-decoration: line-through; text-decoration-thickness: 2px; }
.ms { font-size: .78rem; font-weight: 500; opacity: .85; }
.fam-empty { margin: 0; color: var(--faint); font-size: .95rem; }

/* ——— send ——— */
.btn { min-height: 3.9rem; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: .6rem; font-size: 1.15rem; font-weight: 700; padding: 0 1.2rem; text-align: center; }
.btn .ic { width: 1.5rem; height: 1.5rem; }
.btn-wa { background: var(--wa); color: var(--wa-ink); }
.btn-soft { background: var(--surface-hi); font-weight: 600; }
.btn-soft.talking { background: var(--lilac-bg); color: var(--lilac); }
.quiet { display: flex; justify-content: center; gap: .4rem; flex-wrap: wrap; margin-top: .6rem; }
.quiet button { min-height: 2.8rem; padding: 0 1rem; border-radius: 999px; color: var(--muted); font-size: .9rem; display: inline-flex; align-items: center; gap: .4rem; border: 1px solid rgba(255, 255, 255, .1); }
.quiet .ic { width: 1.05rem; height: 1.05rem; }

/* ——— sheets ——— */
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .66); }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-width: 30rem; margin: 0 auto;
  border-radius: 1.8rem 1.8rem 0 0; background: #1b191f; border-top: 1px solid rgba(255, 255, 255, .08);
}
.sheet-in {
  max-height: 94dvh; overflow-y: auto; overscroll-behavior: contain;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: .8rem;
}
.sheet-in > * { flex-shrink: 0; }
.sheet-top { display: flex; align-items: center; justify-content: space-between; gap: .6rem; padding-top: 1.1rem; touch-action: none; }
.sheet-top h2 { margin: 0; font-size: 1.25rem; font-weight: 700; }
.x-btn { min-height: 2.7rem; padding: 0 .95rem; border-radius: 999px; background: var(--surface-hi); display: inline-flex; align-items: center; gap: .35rem; font-size: .9rem; color: var(--muted); }
.x-btn .ic { width: 1.05rem; height: 1.05rem; }
.handle { position: absolute; top: .45rem; left: 50%; width: 2.6rem; height: .3rem; margin-left: -1.3rem; border-radius: 9px; background: var(--line); }
.disp { display: flex; flex-direction: column; align-items: center; gap: .1rem; }
.disp-row { display: flex; align-items: baseline; gap: .5rem; }
.disp-val { display: flex; direction: ltr; font-size: clamp(2.6rem, 14vw, 3.2rem); font-weight: 700; line-height: 1.15; min-height: 3.8rem; padding: 0 .4rem; border-radius: 1rem; }
.disp-val span { display: inline-block; }
.disp-val.ph { color: var(--faint); }
.disp-val.fresh { background: var(--lilac-bg); }
.disp-row small { font-size: 1rem; color: var(--muted); }
.disp-hint { font-size: .95rem; color: var(--lilac); min-height: 1.45rem; }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; direction: ltr; }
.key { height: 3.6rem; border-radius: 1.2rem; background: var(--surface-hi); font-size: 1.7rem; font-weight: 600; display: grid; place-items: center; }
.key.fn { background: transparent; border: 2px solid var(--surface-top); font-size: .95rem; color: var(--muted); }
.key .ic { width: 1.6rem; height: 1.6rem; }
.btn-ok { min-height: 3.8rem; border-radius: 999px; background: var(--yes); color: var(--yes-ink); font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: .5rem; }
.btn-ok .ic { width: 1.5rem; height: 1.5rem; stroke-width: 3; }
.field { display: flex; flex-direction: column; gap: .5rem; }
.field span { color: var(--muted); font-size: .9rem; }
.field textarea {
  width: 100%; min-height: 15rem; resize: vertical; border-radius: 1.2rem; padding: 1rem 1.1rem;
  background: var(--surface); border: 1px solid var(--line); outline: none; font-size: 1.05rem; line-height: 1.8;
}
.field textarea:focus { border-color: var(--lilac); }

.toast {
  position: fixed; z-index: 40; left: 0; right: 0; bottom: calc(1.2rem + env(safe-area-inset-bottom, 0px));
  margin: 0 auto; width: fit-content; max-width: calc(100% - 32px);
  display: flex; align-items: center; gap: .8rem; padding: .55rem .55rem .55rem 1.2rem; border-radius: 999px;
  background: var(--primary); color: var(--on-primary); font-size: 1rem; font-weight: 600;
  box-shadow: 0 14px 40px -10px rgba(0, 0, 0, .7);
}
.toast:not(.has-undo) { padding: .8rem 1.4rem; }
.toast button { min-height: 2.7rem; padding: 0 1.1rem; border-radius: 999px; background: var(--on-primary); color: var(--primary); font-weight: 700; }
.confetti { position: fixed; inset: 0; z-index: 50; pointer-events: none; overflow: hidden; }
.confetti i { position: absolute; display: block; border-radius: 2px; }
</style>
<!--HEAD-END-->
</head>
<body>
<!--BODY-START-->
<div class="glow" aria-hidden="true"></div>
<main class="app" id="app" dir="rtl" lang="ar">

  <section class="step" id="step1" aria-labelledby="h1">
    <h2 class="step-h" id="h1"><span class="step-n" id="n1">١</span>اكتب مبلغ الفاتورة</h2>
    <div class="hero">
      <div class="ring-wrap">
        <svg class="ring" id="ring" viewBox="0 0 300 300" aria-hidden="true">
          <circle class="ring-track" cx="150" cy="150" r="128"></circle>
          <g id="segs" transform="rotate(-90 150 150)"></g>
        </svg>
        <button class="ring-center press" id="priceBtn" type="button">
          <span class="rc-empty" id="rcEmpty"><span class="rc-plus" id="rcPlus" data-ic="plus"></span>اضغط هنا</span>
          <span class="rc-full" id="rcFull" hidden>
            <span class="rc-lbl">الفاتورة</span>
            <span class="rc-num"><b class="num" id="totalVal">٠</b><small>ريال</small></span>
            <span class="rc-edit"><span data-ic="edit"></span>تغيير</span>
          </span>
        </button>
      </div>
      <div class="per" id="perBox" hidden><span>على الشخص</span><b class="num" id="perVal">٠</b><small>ريال</small></div>
      <p class="heads" id="headsLine"></p>
    </div>
  </section>

  <section class="step" id="step2" aria-labelledby="h2">
    <h2 class="step-h" id="h2"><span class="step-n" id="n2">٢</span>اضغط على اللي ما حضر</h2>
    <p class="step-p"><span class="key-dot"><i class="g"></i>أخضر: حاضر</span><span class="key-dot"><i class="x"></i>مشطوب: ما حضر</span></p>
    <ul class="list" id="list"></ul>
  </section>

  <section class="step" id="step3" aria-labelledby="h3">
    <h2 class="step-h" id="h3"><span class="step-n" id="n3">٣</span>أرسل الحساب للعائلة</h2>
    <a class="btn btn-wa press" id="waBtn" href="#" target="_blank" rel="noopener"><span data-ic="send"></span>أرسل في واتساب</a>
    <button class="btn btn-soft press" id="speakBtn" type="button" hidden><span data-ic="sound"></span><span id="speakLbl">اسمع الحساب</span></button>
    <div class="quiet">
      <button id="resetBtn" type="button"><span data-ic="redo"></span>عزيمة جديدة</button>
      <button id="copyBtn" type="button"><span data-ic="copy"></span>انسخ</button>
      <button id="editBtn" type="button"><span data-ic="edit"></span>عدّل الأسماء</button>
    </div>
  </section>
</main>

<div class="scrim" id="scrim" hidden></div>

<div class="sheet" id="priceSheet" role="dialog" aria-modal="true" aria-labelledby="priceTitle" hidden dir="rtl">
  <span class="handle" aria-hidden="true"></span>
  <div class="sheet-in">
    <div class="sheet-top"><h2 id="priceTitle">كم الفاتورة؟</h2><button class="x-btn press" type="button" data-close><span data-ic="close"></span>إغلاق</button></div>
    <div class="disp">
      <div class="disp-row"><span class="disp-val num" id="dispVal"></span><small>ريال</small></div>
      <span class="disp-hint" id="dispHint"></span>
    </div>
    <div class="keys" id="keys"></div>
    <button class="btn-ok press" id="priceOk" type="button"><span data-ic="check"></span>تم</button>
  </div>
</div>

<div class="sheet" id="namesSheet" role="dialog" aria-modal="true" aria-labelledby="namesTitle" hidden dir="rtl">
  <span class="handle" aria-hidden="true"></span>
  <div class="sheet-in">
    <div class="sheet-top"><h2 id="namesTitle">الأسماء</h2><button class="x-btn press" type="button" data-close><span data-ic="close"></span>إغلاق</button></div>
    <label class="field"><span>كل عائلة في سطر: اسم العائلة، بعدها نقطتين، بعدها الأفراد بينهم فاصلة</span>
      <textarea id="namesText" spellcheck="false"></textarea>
    </label>
    <button class="btn-ok press" id="namesOk" type="button"><span data-ic="check"></span>احفظ</button>
  </div>
</div>

<div class="sheet" id="copySheet" role="dialog" aria-modal="true" aria-labelledby="copyTitle" hidden dir="rtl">
  <span class="handle" aria-hidden="true"></span>
  <div class="sheet-in">
    <div class="sheet-top"><h2 id="copyTitle">انسخ الحساب</h2><button class="x-btn press" type="button" data-close><span data-ic="close"></span>إغلاق</button></div>
    <label class="field"><span>حدّد النص وانسخه</span><textarea id="copyText" readonly></textarea></label>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden><span id="toastMsg"></span><button id="toastUndo" type="button" hidden>تراجع</button></div>
<div class="confetti" id="confetti" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
'use strict';

// ——— الأسماء (تجريبية). بدّلها بأسماء العوائل الحقيقية ———
// الاسم اللي يبدأ بـ "-" يعني ما حضر.
const DEFAULT_FAMILIES = [
  ['عائلة عادل', ['عادل', 'نورة', 'محمد', '-ريم', 'فهد']],
  ['عائلة خالد', ['خالد', 'سارة', 'عبدالله', 'لمى']],
  ['عائلة فيصل', ['فيصل', 'هيا', 'تركي']],
  ['عائلة ناصر', ['ناصر', 'منيرة', 'سلطان', 'جود', 'العنود', '-يوسف']],
  ['عائلة ماجد', ['ماجد', 'دانة']],
];
const COLORS = ['#5ccfc4', '#7ee0b0', '#f2dc8c', '#ff9f7a', '#9b6cf0', '#7fb4ff', '#f59ac8', '#c8e07a', '#ffc46b', '#a0a4ff'];

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TOUCH = matchMedia('(pointer: coarse)').matches;
if (REDUCED) gsap.globalTimeline.timeScale(20);
document.documentElement.lang = 'ar';
document.documentElement.dir = 'rtl';

// ——— springs: real spring physics as GSAP eases ———
function springEase({ stiffness = 200, damping = 22, mass = 1, duration = 1 }) {
  const w0 = Math.sqrt(stiffness / mass), z = damping / (2 * Math.sqrt(stiffness * mass));
  const wd = w0 * Math.sqrt(Math.abs(1 - z * z));
  const f = z < 1
    ? p => { const t = p * duration; return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
    : p => { const t = p * duration; return 1 - Math.exp(-w0 * t) * (1 + w0 * t); };
  const end = f(1);
  return p => f(p) / end;
}
gsap.registerEase('spring', springEase({ stiffness: 200, damping: 22, mass: 1.2, duration: 1 }));
gsap.registerEase('springSoft', springEase({ stiffness: 272, damping: 33, mass: 1, duration: .4 }));
gsap.registerEase('springOut', springEase({ stiffness: 170, damping: 26, mass: 1, duration: .7 }));

const svg = p => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I = {
  plus: svg('<path d="M12 5v14M5 12h14"/>'),
  edit: svg('<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>'),
  close: svg('<path d="M18 6 6 18M6 6l12 12"/>'),
  check: svg('<path class="ck" d="M20 6 9 17l-5-5" pathLength="1"/>'),
  back: svg('<path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Z"/><path d="m18 9-6 6M12 9l6 6"/>'),
  send: svg('<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/>'),
  copy: svg('<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'),
  redo: svg('<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>'),
  sound: svg('<path d="M11 5 6 9H2v6h4l5 4Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/>'),

// ——— state ———
const KEY = 'qatta.v3';
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function makeFamily(name, members) {
  return { id: uid(), name, members: members.map(n => ({ id: uid(), name: n.replace(/^-/, ''), present: !n.startsWith('-') })) };
}
function load() {
  try {
    const raw = localStorage.getItem(KEY) || localStorage.getItem('qatta.v1');
    if (raw) {
      const s = JSON.parse(raw);
      if (s && Array.isArray(s.families)) {
        return {
          total: +s.total || 0,
          families: s.families.map(f => ({ id: f.id || uid(), name: String(f.name), members: (f.members || []).map(m => ({ id: m.id || uid(), name: String(m.name), present: m.present !== false })) })),
        };
      }
    }
  } catch (e) { /* storage unavailable */ }

}
let state = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ } }
const color = i => COLORS[i % COLORS.length];

// ——— numbers: whole riyals only ———
const NF = new Intl.NumberFormat('ar-SA-u-nu-arab', { maximumFractionDigits: 0 });
const fmt = n => NF.format(Math.round(+n || 0));
const initial = name => (String(name).trim().replace(/^(عائلة|عايلة|عائله|بيت|آل)\s+/, '').replace(/^(أبو|ابو|أم|ام)\s+/, '')[0] || '؟');
function compute() {
  let heads = 0, all = 0;
  const rows = new Map();
  for (const f of state.families) {
    const n = f.members.filter(m => m.present).length;
    heads += n; all += f.members.length;
    rows.set(f.id, n);
  }
  // each person pays the same whole number of riyals, rounded up so the bill is always covered
  const per = heads && state.total ? Math.ceil(state.total / heads - 1e-9) : 0;
  return { heads, all, per, rows, share: id => per * rows.get(id) };
}
function setNum(el, to, anim = true) {
  const prev = el.dataset.val;
  const from = prev === undefined || prev === '' ? null : +prev;
  el.dataset.val = to;
  if (el._tw) el._tw.kill();
  if (!anim || from === null || from === to) { el.textContent = fmt(to); return; }
  const o = { v: from };
  el._tw = gsap.to(o, { v: to, duration: .8, ease: 'springOut', onUpdate: () => { el.textContent = fmt(o.v); } });
}
function haptic(ms = 8) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { /* ignore */ } }

// ——— the ring: one piece per family, sized by how many of them came ———
const segG = $('#segs');
const R = 128, GAP = 5.4;
const segs = new Map();
function drawSeg(s) {
  const dash = s.len > 0.01 ? Math.max(.001, s.len - GAP) : 0;
  s.el.setAttribute('stroke-dasharray', `${dash} ${100 - dash}`);
  s.el.setAttribute('stroke-dashoffset', -(s.start + GAP / 2));
  s.el.style.visibility = s.len > 0.01 ? 'visible' : 'hidden';
}
function buildRing() {
  segG.innerHTML = '';
  segs.clear();
  state.families.forEach((f, i) => {
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    el.setAttribute('class', 'seg');
    el.setAttribute('cx', 150); el.setAttribute('cy', 150); el.setAttribute('r', R);
    el.setAttribute('pathLength', 100);
    el.setAttribute('stroke', color(i));
    el.dataset.id = f.id;
    segG.appendChild(el);
    const s = { el, start: 0, len: 0 };
    segs.set(f.id, s);
    drawSeg(s);
  });
}
function updateRing(c, anim = true, stagger = 0) {
  let acc = 0;
  state.families.forEach((f, i) => {
    const s = segs.get(f.id);
    const len = c.heads ? (c.rows.get(f.id) / c.heads) * 100 : 0;
    const start = acc;
    acc += len;
    if (!s) return;
    gsap.killTweensOf(s);
    if (!anim) { s.start = start; s.len = len; drawSeg(s); return; }
    gsap.to(s, { start, len, duration: 1, delay: i * stagger, ease: 'spring', onUpdate: () => drawSeg(s) });
  });
}
segG.addEventListener('click', e => {
  const el = e.target.closest('.seg');

});

// ——— the families: every name is visible, one tap flips it ———
const list = $('#list');
const famEl = id => list.querySelector(`.fam[data-id="${id}"]`);
const markHTML = on => `<span class="mk">${on ? I.check : I.close}</span>`;

}

}

// ——— update everything from state ———
let pulse = null;
function update(anim = true) {
  const c = compute();
  const has = state.total > 0;
  const empty = $('#rcEmpty'), full = $('#rcFull');
  if (full.hidden === has) {
    empty.hidden = has; full.hidden = !has;
    if (anim) gsap.fromTo(has ? full : empty, { opacity: 0, scale: .85 }, { opacity: 1, scale: 1, duration: .7, ease: 'spring', clearProps: 'all' });
  }
  // gently breathe the "press here" button until a price is entered
  if (!has && !pulse && !REDUCED) pulse = gsap.to('#rcPlus', { scale: 1.12, duration: .9, ease: 'sine.inOut', repeat: -1, yoyo: true });
  if (has && pulse) { pulse.kill(); pulse = null; gsap.set('#rcPlus', { clearProps: 'scale' }); }

  const n1 = $('#n1');
  if (n1.classList.contains('done') !== has) {
    n1.classList.toggle('done', has);

  }
  setNum($('#totalVal'), state.total, anim);
  const perBox = $('#perBox');
  const showPer = has && c.heads > 0;
  if (perBox.hidden === showPer) {
    perBox.hidden = !showPer;
    if (showPer && anim) gsap.fromTo(perBox, { opacity: 0, y: -10, scale: .9 }, { opacity: 1, y: 0, scale: 1, duration: .7, ease: 'spring', clearProps: 'all' });
  }

  state.families.forEach(f => {

  $('#waBtn').href = 'https://wa.me/?text=' + encodeURIComponent(summary());

}

// ——— tap a name ———

// ——— price keypad ———

// ——— sheets ———
const scrim = $('#scrim');

  gsap.fromTo(sh, { yPercent: 100, y: 0 }, { yPercent: 0, duration: .7, ease: 'springOut' });

    { y: 0, opacity: 1, duration: .5, stagger: .018, delay: .05, ease: 'springSoft', clearProps: 'transform,opacity' });

$$('[data-close]').forEach(b => b.addEventListener('click', closeSheet));
$$('.sheet').forEach(sh => {
  let y0 = null, dy = 0, t0 = 0;
  sh.addEventListener('pointerdown', e => {
    if (!e.target.closest('.sheet-top') || e.target.closest('button')) return;

// ——— names editor ———
function splitNames(s) {
  return String(s).split(/[،,؛;\n]+/).map(t => t.replace(/^[\s\-•*·]+/, '').trim()).filter(Boolean);
}
function parseNames(text) {
  const out = [];
  let fam = null;
  for (const raw of String(text).split(/\r?\n/)) {
    const line = raw.trim();
    if (!line) { fam = null; continue; }
    const m = line.match(/^(.+?)\s*[:：]\s*(.*)$/);
    if (m) { fam = { name: m[1].replace(/^[\s\-•*·]+/, '').trim(), members: splitNames(m[2]) }; out.push(fam); }
    else if (fam) fam.members.push(...splitNames(line));
    else { fam = { name: line, members: [] }; out.push(fam); }
  }
  return out.filter(f => f.name);
}
$('#editBtn').addEventListener('click', () => {
  $('#namesText').value = state.families.map(f => `${f.name}: ${f.members.map(m => m.name).join('، ')}`).join('\n');

});
$('#namesOk').addEventListener('click', () => {
  const parsed = parseNames($('#namesText').value);
  if (!parsed.length) { shake($('#namesText')); return; }
  const before = JSON.stringify(state);
  const oldFams = new Map(state.families.map(f => [f.name, f]));
  state.families = parsed.map(p => {
    const old = oldFams.get(p.name);
    const pool = new Map();
    if (old) old.members.forEach(m => { if (!pool.has(m.name)) pool.set(m.name, []); pool.get(m.name).push(m); });
    return {
      id: old ? old.id : uid(), name: p.name,
      members: p.members.map(n => (pool.get(n) && pool.get(n).shift()) || { id: uid(), name: n, present: true }),
    };
  });
  save(); closeSheet();
  setTimeout(() => { rebuild(true); toast('حفظنا الأسماء', before); }, 220);
});

// ——— send / listen ———
function summary() {

  const L = ['حساب القطّة', `الفاتورة: ${fmt(state.total)} ريال`, `الحاضرين: ${fmt(c.heads)}، على الشخص ${fmt(c.per)} ريال`, ''];
  for (const f of state.families) {
    const n = c.rows.get(f.id);
    L.push(n ? `${f.name} (${fmt(n)}): ${fmt(c.share(f.id))} ريال` : `${f.name}: ما حضر أحد`);
  }
  return L.join('\n');
}
function needPrice() {

}

  const text = summary();

    $('#copyText').value = text;
    openSheet('copySheet');
    setTimeout(() => { const t = $('#copyText'); t.focus(); t.select(); }, 450);
  };
  try { navigator.clipboard.writeText(text).then(() => { toast('نسخنا الحساب'); haptic(15); }, fallback); }
  catch (e) { fallback(); }
});
// read the result aloud in Arabic, when the phone has a voice for it
const synth = window.speechSynthesis;
if (synth && window.SpeechSynthesisUtterance) $('#speakBtn').hidden = false;
function setTalking(on) {
  const b = $('#speakBtn');
  b.classList.toggle('talking', on);
  $('.ic', b).outerHTML = on ? I.stop : I.sound;
  $('#speakLbl').textContent = on ? 'وقّف الصوت' : 'اسمع الحساب';
}
$('#speakBtn').addEventListener('click', () => {
  if (!state.total) { needPrice(); return; }
  if (synth.speaking) { synth.cancel(); setTalking(false); return; }
  const c = compute();
  const parts = [`الفاتورة ${Math.round(state.total)} ريال.`, `على الشخص ${c.per} ريال.`];
  state.families.forEach(f => {
    const n = c.rows.get(f.id);
    parts.push(n ? `${f.name}: ${c.share(f.id)} ريال.` : `${f.name}: ما حضر أحد.`);
  });
  const u = new SpeechSynthesisUtterance(parts.join(' '));
  u.lang = 'ar-SA';
  u.rate = .85;
  const v = synth.getVoices().find(x => /^ar/i.test(x.lang));
  if (v) u.voice = v;
  u.onend = u.onerror = () => setTalking(false);
  synth.cancel();
  synth.speak(u);
  setTalking(true);
});

// ——— toast with undo ———

    const p = document.createElement('i');
    const w = gsap.utils.random(5, 9);
    p.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${w * 1.4}px;background:${COLORS[i % COLORS.length]}`;
    layer.appendChild(p);
    const a = gsap.utils.random(-Math.PI * .95, -Math.PI * .05), sp = gsap.utils.random(spread * .4, spread);
    gsap.timeline({ onComplete: () => p.remove() })
      .to(p, { x: Math.cos(a) * sp, y: Math.sin(a) * sp, rotation: gsap.utils.random(-260, 260), duration: .6, ease: 'power3.out' })
      .to(p, { y: `+=${spread * 1.4}`, opacity: 0, duration: gsap.utils.random(.8, 1.3), ease: 'power1.in' });
  }
}

// ——— boot ———
function rebuild(anim) {
  buildRing();
  renderList();
  update(false);
  if (anim) {
    segs.forEach(s => { s.start = 0; s.len = 0; drawSeg(s); });
    updateRing(compute(), true, .08);
    gsap.fromTo('.fam', { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: .6, stagger: .05, ease: 'springSoft', clearProps: 'transform,opacity' });
  }
}
function intro() {
  const blur = px => TOUCH ? {} : { filter: `blur(${px}px)` };
  const c = compute();
  const tl = gsap.timeline();
  tl.fromTo('#step1 .step-h', { y: 20, opacity: 0, ...blur(6) }, { y: 0, opacity: 1, ...blur(0), duration: .6, ease: 'springSoft', clearProps: 'transform,opacity,filter' }, 0)
    .fromTo('.ring-center', { scale: .6, opacity: 0 }, { scale: 1, opacity: 1, duration: 1, ease: 'spring', clearProps: 'transform,opacity' }, .05)
    .fromTo('.ring-track', { opacity: 0 }, { opacity: 1, duration: .6 }, 0)
    .add(() => {
      segs.forEach(s => { s.start = 0; s.len = 0; drawSeg(s); });
      updateRing(c, true, .09);
    }, .15)
    .add(() => {
      const t = $('#totalVal'); t.dataset.val = 0; setNum(t, state.total);
      const p = $('#perVal'); p.dataset.val = 0; setNum(p, c.per);
    }, .3)
    .fromTo(['#perBox', '#headsLine'], { y: 16, opacity: 0, ...blur(6) }, { y: 0, opacity: 1, ...blur(0), duration: .6, stagger: .06, ease: 'springSoft', clearProps: 'transform,opacity,filter' }, .45)
    .fromTo('#step2 > :not(.list)', { y: 24, opacity: 0, ...blur(8) }, { y: 0, opacity: 1, ...blur(0), duration: .6, stagger: .06, ease: 'springSoft', clearProps: 'transform,opacity,filter' }, .55)
    .fromTo('.fam', { y: 50, opacity: 0, ...blur(8) }, { y: 0, opacity: 1, ...blur(0), duration: .7, stagger: .07, ease: 'springSoft', clearProps: 'transform,opacity,filter' }, .62)
    .fromTo('.mem', { scale: .85, opacity: 0 }, { scale: 1, opacity: 1, duration: .5, stagger: .02, ease: 'springSoft', clearProps: 'transform,opacity' }, .75)
    .fromTo('#step3 > *', { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: .6, stagger: .06, ease: 'springSoft', clearProps: 'transform,opacity' }, .95);
}
buildRing();
renderList();
update(false);
intro();
})();
</script>
