<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--any:head-->
<title>Wordmark Assembly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* One screen: the animated word fills the stage on its own background,
   with the word field and playback controls in a bar along the bottom. */
:root {
  --bg: #022713;
  --ink: #CDE4B1;
  --green: #18C76B;
  --bar: rgba(205, 228, 177, 0.07);
  --line: rgba(205, 228, 177, 0.18);
  --muted: rgba(205, 228, 177, 0.62);
  --f-ui: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 var(--f-ui);
  display: grid; grid-template-rows: 1fr auto; overflow: hidden;
}
.stage { position: relative; min-height: 0; display: grid; place-items: center; padding: 3vh max(16px, 4vw) 0; }
#art { width: min(100%, 1180px); height: min(100%, 62vh); }
#grid {
  display: none; width: min(100%, 1180px); max-height: 100%; overflow-y: auto; align-self: start;
  grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; padding-bottom: 8px;
}
body.letters #art { display: none; }
body.letters #grid { display: grid; }
body.letters .word-only { display: none; }
.cell { aspect-ratio: 1; border: 1px solid var(--line); border-radius: 10px; position: relative; overflow: hidden; }
.cell span { position: absolute; left: 7px; top: 4px; font: 11px var(--f-mono); color: var(--muted); }
.empty { color: var(--muted); }
.bar {
  display: grid; gap: 10px; justify-items: center;
  padding-block: 12px calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: 100%; }
#word {
  font: 600 22px/1 var(--f-ui); color: var(--ink); background: var(--bar); border: 1px solid var(--line);
  border-radius: 999px; padding: 10px 18px; width: min(360px, 100%); text-align: center; letter-spacing: 0.01em;
}
#word:focus { outline: none; border-color: var(--green); }
button, select {
  font: inherit; color: var(--ink); background: var(--bar); border: 1px solid var(--line);
  border-radius: 999px; height: 34px; min-width: 34px; padding: 0 12px; cursor: pointer;
}
select { background: var(--bg); }
button { display: inline-grid; place-items: center; }
button:hover, select:hover { border-color: var(--muted); }
button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
button svg { width: 14px; height: 14px; display: block; }
input[type="range"] { accent-color: var(--green); }
#scrub { width: min(40vw, 380px); }
input[type="color"] { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 50%; padding: 0; background: none; cursor: pointer; overflow: hidden; }
.read { font: 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; min-width: 9.5em; text-align: center; }
.sw { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; }
@media (max-width: 620px) { #scrub { width: 100%; } .row.play { row-gap: 8px; } }
</style>
<!--/any:head-->
</head>
<body>
<!--any:body-->
<main class="stage"><div id="art" aria-live="polite"></div><div id="grid" aria-label="Every letter with its own animation"></div></main>
<div class="bar">
  <div class="row">
    <input id="word" type="text" value="slaace" maxlength="16" spellcheck="false" autocomplete="off" aria-label="Word">
    <select id="font" aria-label="Typeface"></select>
    <button id="view" type="button" aria-pressed="false" title="Every letter of the font, each with its own animation">All letters</button>
  </div>
  <div class="row play word-only" role="toolbar" aria-label="Playback">
    <button id="play" type="button" aria-label="Pause"><svg viewBox="0 0 14 14" id="play-ic"><path d="M3 2h3v10H3zM8 2h3v10H8z" fill="currentColor"/></svg></button>
    <button id="prev" type="button" aria-label="Previous frame"><svg viewBox="0 0 14 14"><path d="M3 2h2v10H3zM12 2v10L6 7z" fill="currentColor"/></svg></button>
    <button id="next" type="button" aria-label="Next frame"><svg viewBox="0 0 14 14"><path d="M9 2h2v10H9zM2 2v10l6-5z" fill="currentColor"/></svg></button>
    <input id="scrub" type="range" min="0" max="57" value="0" step="0.05" aria-label="Frame">
    <span class="read" id="read">frame 0 / 57</span>
    <select id="speed" aria-label="Speed">
      <option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option>
    </select>
    <button id="loop" type="button" aria-pressed="true">Loop</button>
    <button id="reg" type="button" aria-pressed="true" title="Registered mark">®</button>
    <button id="exact" type="button" aria-pressed="true" title="Play the traced recording for the word slaace">Exact slaace</button>
    <label class="sw"><input type="color" id="c-bg" value="#022713" aria-label="Background colour"></label>
    <label class="sw"><input type="color" id="c-green" value="#18C76B" aria-label="Green colour"></label>
    <label class="sw"><input type="color" id="c-cream" value="#CDE4B1" aria-label="Letter colour"></label>
  </div>
</div>
<!--/any:body-->
<script src="slaace.frames.js"></script>
<script src="motion.data.js"></script>
<script src="font.data.js"></script>
<script src="assemble.js"></script>
<!--any:script-->
<script>
(function () {
  const LA = window.LogoAssemble;
  const $ = (id) => document.getElementById(id);
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const store = {
    get(k, d) { try { const v = localStorage.getItem('la3:' + k); return v == null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('la3:' + k, v); } catch (e) { /* storage off */ } },
  };

  Object.entries(LA.FONTS).forEach(([k, f]) => {
    const op = document.createElement('option'); op.value = k; op.textContent = f.label; $('font').appendChild(op);
  });
  $('word').value = store.get('word', 'slaace');
  $('font').value = store.get('font', 'slaace');
  if (!$('font').value) $('font').value = 'slaace';

  const anim = LA.create($('art'), {
    word: $('word').value, font: $('font').value,
    onUpdate(f, n) {
      $('scrub').max = n;
      $('scrub').value = f;
      $('read').textContent = `frame ${Math.floor(f)} / ${n} · ${(f / LA.FPS).toFixed(2)} s`;
    },
  });

  function setPlay(on) {
    on ? anim.play() : anim.pause();
    $('play').setAttribute('aria-label', on ? 'Pause' : 'Play');
    $('play-ic').innerHTML = on
      ? '<path d="M3 2h3v10H3zM8 2h3v10H8z" fill="currentColor"/>'
      : '<path d="M3 2l9 5-9 5z" fill="currentColor"/>';
  }
  function restart() {
    if (reduce) { anim.pause(); anim.seek(anim.frames); setPlay(false); return; }
    anim.seek(0); setPlay(true);
  }

  let deb = 0;
  $('word').addEventListener('input', () => {
    clearTimeout(deb);
    deb = setTimeout(() => { store.set('word', $('word').value); anim.set({ word: $('word').value }).then(restart); }, 250);
  });
  $('word').addEventListener('keydown', (e) => { if (e.key === 'Enter') { clearTimeout(deb); anim.set({ word: $('word').value }).then(restart); } });
  $('font').addEventListener('change', () => { store.set('font', $('font').value); anim.set({ font: $('font').value }).then(restart); });

  $('play').addEventListener('click', () => setPlay(!anim.playing));
  $('prev').addEventListener('click', () => { setPlay(false); anim.seek(Math.max(0, Math.round(anim.frame) - 1)); });
  $('next').addEventListener('click', () => { setPlay(false); anim.seek(Math.min(anim.frames, Math.round(anim.frame) + 1)); });
  $('scrub').addEventListener('input', (e) => { setPlay(false); anim.seek(+e.target.value); });
  $('speed').addEventListener('change', (e) => { anim.options.speed = +e.target.value; });
  $('loop').addEventListener('click', (e) => {
    const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
    e.currentTarget.setAttribute('aria-pressed', on); anim.options.loop = on;
    if (on && !anim.playing) setPlay(true);
  });
  $('reg').addEventListener('click', (e) => {
    const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
    e.currentTarget.setAttribute('aria-pressed', on); anim.set({ registered: on });
  });
  $('exact').addEventListener('click', (e) => {
    const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
    e.currentTarget.setAttribute('aria-pressed', on); anim.set({ exact: on }).then(restart);
  });
  const colour = () => {
    document.documentElement.style.setProperty('--bg', $('c-bg').value);
    anim.set({ colors: { bg: $('c-bg').value, green: $('c-green').value, cream: $('c-cream').value } });
  };
  ['c-bg', 'c-green', 'c-cream'].forEach((id) => $(id).addEventListener('input', colour));
  document.addEventListener('keydown', (e) => {
    if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
    if (e.code === 'ArrowLeft') $('prev').click();
    if (e.code === 'ArrowRight') $('next').click();
  });

  // All letters: every glyph of the font, each looping its own animation.
  let cells = [];
  $('view').addEventListener('click', (e) => {
    const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
    e.currentTarget.setAttribute('aria-pressed', on);
    document.body.classList.toggle('letters', on);
    if (on) {
      setPlay(false);
      const G = window.SLAACE_FONT.glyphs, order = 'abcdefghijklmnopqrstuvwxyz0123456789';
      const chars = Object.keys(G).sort((x, y) => (order.indexOf(x) + 1 || 99) - (order.indexOf(y) + 1 || 99));
      cells = chars.map((ch, i) => {
        const cell = document.createElement('div'); cell.className = 'cell';
        cell.innerHTML = `<span>${ch === '<' ? '&lt;' : ch}</span>`;
        $('grid').appendChild(cell);
        const a = LA.create(cell, { word: ch, registered: false, exact: false, font: 'slaace',
          colors: { bg: $('c-bg').value, green: $('c-green').value, cream: $('c-cream').value } });
        a.ready.then(() => { if (reduce) a.seek(a.frames); else { a.seek((i * 7) % a.frames); a.play(); } });
        return a;
      });
    } else {
      cells.forEach((a) => a.destroy()); cells = []; $('grid').innerHTML = '';
      restart();
    }
  });

  anim.ready.then(restart);
})();
</script>
<!--/any:script-->
</body>
</html>
