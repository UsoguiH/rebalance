<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Credits</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=Roboto+Mono&display=swap">
<style>
  :root { color-scheme: light; }
  body { margin: 0; background: #f1f1f1; color: #000; font: 18px/1.4 "Inter Tight", system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 60px; }
  h1 { font-weight: 500; font-size: 40px; letter-spacing: -.02em; margin: 0 0 8px; }
  p { font-family: "Roboto Mono", monospace; font-size: 15px; color: #555; margin: 0 0 24px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  li { display: flex; gap: 16px; align-items: center; background: #fff; border-radius: 28px; padding: 10px; }
  img { width: 66px; height: 88px; object-fit: cover; border-radius: 20px; flex: none; }
  li div { display: flex; flex-direction: column; min-width: 0; }
  b { font-weight: 500; font-size: 20px; }
  span { font-family: "Roboto Mono", monospace; font-size: 13px; color: #666; overflow-wrap: anywhere; }
  a { color: #e8410f; }
</style>
</head>
<body>
<main>
  <h1>Photo credits</h1>
  <p>The style examples are real photos shared under open licenses. They are cropped and resized. Thank you to every photographer.</p>
  <ul>
<li><img src="assets/styles/low-fade.jpg" alt="" loading="lazy"><div><b>Low Fade</b><span>Haircut</span><span>Photo by ImagePros · <a href="https://creativecommons.org/licenses/by/2.0/">CC BY 2.0</a> · <a href="https://www.flickr.com/photos/40645329@N06/4971797614">source</a></span></div></li>
<li><img src="assets/styles/handlebar.jpg" alt="" loading="lazy"><div><b>Handlebar</b><span>Beard</span><span>Photo by crackdog · <a href="https://creativecommons.org/publicdomain/mark/1.0/">Public Domain Mark</a> · <a href="https://www.flickr.com/photos/88645472@N00/4260999743">source</a></span></div></li>
  </ul>
</main>
</body>
</html>
