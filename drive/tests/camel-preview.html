<!doctype html>
<html><head><meta charset="utf-8"><title>camel preview</title>
<script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script>
<style>html,body{margin:0;background:#222}canvas{display:block}</style></head>
<body><script type="module">
import * as THREE from 'three';
import { createCamelRider } from '../js/camel.js';
const W = 800, H = 500;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xf0cf9c); scene.fog = new THREE.Fog(0xf0cf9c, 25, 70);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0xd9b57a, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
scene.add(new THREE.HemisphereLight(0xcfe6ff, 0xb08850, 1.1));
const sun = new THREE.DirectionalLight(0xfff0d0, 2.6); sun.position.set(6, 10, 5); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024); Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 1, far: 30 });
scene.add(sun);
const cam = new THREE.PerspectiveCamera(32, W / H, 0.1, 100);
const camel = createCamelRider(); scene.add(camel.root);
window.camel = camel; window.THREE = THREE;
const VIEWS = {
  side: [9, 1.9, 0, 0, 1.6, 0.2], front: [0.5, 2.2, 9, 0, 1.7, 0], q34: [6.2, 3.0, 6.0, 0, 1.6, 0.2],
  rear: [-4.5, 2.8, -6.5, 0, 1.8, 0], close: [3.6, 3.3, 3.6, 0, 2.6, 0.4],
};
let t = 0;
window.snap = (o) => {
  const st = Object.assign({ x: 0, y: 0, z: 0, heading: 0, speed: 0, vx: 0, vz: 0, steer: 0, throttle: 0, sprint: false, sprintEnergy: 1, braking: false, slip: 0, gaitPhase: 0, gait: 'idle', pitch: 0, roll: 0, grounded: true, lastBump: null }, o.state);
  const cyc = o.cycle || 3, dt = 1 / 60;
  const yawRate = o.yawRate || 0; if (o.call) camel.root.userData.playCall(9);
  for (let i = 0; i < (o.frames || 120); i++) {
    st.gaitPhase = (st.gaitPhase + (st.speed * dt) / cyc + 1000) % 1; st.heading += yawRate * dt; t += dt;
    camel.update(dt, st, t);
  }
  const v = VIEWS[o.view || 'side']; cam.position.set(v[0], v[1], v[2]); cam.lookAt(v[3], v[4], v[5]);
  sun.target.position.set(0, 0, 0);
  renderer.render(scene, cam);
  return { calls: renderer.info.render.calls, tris: renderer.info.render.triangles };
};
window.ready = true;
</script></body></html>
