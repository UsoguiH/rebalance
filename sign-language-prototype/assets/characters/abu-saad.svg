  <path d="M250 190 C270 200 276 226 276 258 C276 296 278 330 282 360 L250 360 C258 320 262 280 258 236 C256 214 252 200 244 190 Z" fill="#EEE5D8"/>
  <path d="M206 250 L208 356" stroke="#EAE0D2" stroke-width="2.5" stroke-linecap="round" fill="none"/>
