  <!-- eyebrows -->
  <rect x="149" y="84" width="32" height="15" rx="3" fill="#4A3A34" transform="rotate(-8 165 94)"/>
  <rect x="201" y="73" width="29" height="15" rx="3" fill="#4A3A34" transform="rotate(-4 215 84)"/>

  <!-- shmagh front fold over the forehead -->
  <path d="M132 100 C138 70 166 56 200 56 C236 56 262 70 268 98 C254 84 230 78 200 78 C170 78 146 86 132 100 Z" fill="url(#shmagh)"/>

  <!-- agal -->
  <path d="M124 60 C150 42 250 38 276 58 C280 62 278 70 272 70 C246 56 154 58 130 72 C122 74 120 64 124 60 Z" fill="#3A2E2E"/>
  <path d="M120 76 C150 58 252 54 280 74 C284 78 282 86 276 86 C248 72 152 74 126 88 C118 90 116 80 120 76 Z" fill="#3A2E2E"/>
  <path d="M132 62 C160 50 236 48 266 58" stroke="#5A4A48" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M128 78 C158 66 240 64 272 74" stroke="#5A4A48" stroke-width="2.5" fill="none" stroke-linecap="round"/>
