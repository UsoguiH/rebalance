  <path d="M190 188 C196 196 214 196 222 188" stroke="#E6DBCC" stroke-width="3" fill="none" stroke-linecap="round"/>
  <rect x="200" y="196" width="12" height="44" rx="4" fill="none" stroke="#E6DBCC" stroke-width="2.4"/>
  <circle cx="206" cy="210" r="2.4" fill="#E2D6C6"/><circle cx="206" cy="226" r="2.4" fill="#E2D6C6"/>
  <path d="M222 220 L252 220 L252 246 C252 249 250 250 247 250 L227 250 C224 250 222 249 222 246 Z" fill="none" stroke="#E6DBCC" stroke-width="2.4" stroke-linejoin="round"/>
  <rect x="226" y="212" width="3.2" height="16" rx="1.4" fill="#2E2626"/>

  <!-- sleeve of the arm on the cane -->
  <path d="M188 194 C164 194 150 206 146 222 C144 230 146 236 150 238 L170 238 C172 226 178 214 192 204 Z" fill="#F3ECE1"/>
  <path d="M150 238 L170 238" stroke="#E6DBCC" stroke-width="3" stroke-linecap="round"/>

  <!-- cane -->
  <path d="M140 372 C138 330 136 288 136 258 C136 246 142 240 150 240 C158 240 162 246 162 254" fill="none" stroke="#7A3F2A" stroke-width="7" stroke-linecap="round"/>
  <path d="M140 372 C138 330 136 288 136 258" fill="none" stroke="#8E4E35" stroke-width="2.5" stroke-linecap="round"/>

  <!-- hand on the cane -->
