  <path d="M170 140 C176 176 226 182 240 136 C222 144 190 146 170 140 Z" fill="#7C2F22"/>
  <path d="M173 142 C190 149 220 148 238 138 C236 150 228 158 216 160 C198 162 182 156 173 142 Z" fill="#FFFFFF"/>
