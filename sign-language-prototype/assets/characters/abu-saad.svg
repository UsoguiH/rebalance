<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="أبو سعد">
  <defs>
    <pattern id="shmagh" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#FBEAE3"/>
      <rect x="1" y="1" width="5.6" height="5.6" rx="2" fill="#E5675F"/>
      <rect x="7" y="7" width="2.4" height="2.4" rx="1" fill="#EF9C92"/>
    </pattern>
    <pattern id="shmaghShade" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#F2D8CF"/>
      <rect x="1" y="1" width="5.6" height="5.6" rx="2" fill="#D45A53"/>
    </pattern>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="210" cy="373" rx="96" ry="7" fill="#E3E6EA"/>

  <!-- shmagh tail falling behind the right shoulder -->
  <path d="M244 150 C278 160 300 190 302 236 C292 238 282 234 272 226 C266 200 256 176 236 166 Z" fill="url(#shmaghShade)"/>

