    <circle cx="215" cy="109" r="20" fill="#FFFFFF"/>
    <path d="M150 124 C147 106 158 94 172 95" stroke="#2B2222" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <path d="M197 116 C194 98 205 88 219 89" stroke="#2B2222" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <circle cx="170" cy="114" r="11.5" fill="#2B2222"/>
    <circle cx="217" cy="109" r="12" fill="#2B2222"/>
    <circle cx="173" cy="110" r="2.6" fill="#FFFFFF"/>
    <circle cx="220" cy="105" r="2.8" fill="#FFFFFF"/>
