<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#e6bd7f">
  <meta name="description" content="معرض أعمال تفاعلي ثلاثي الأبعاد: اركب الجمل وتجوّل في قرية صحراوية لتكتشف المشاريع.">
  <title>قرية الواحة</title>
  <link rel="preload" href="fonts/reem-kufi-arabic-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/cairo-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/ui.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.min.js",
        "three-addons": "./vendor/three-addons.min.js",
        "cannon-es": "./vendor/cannon-es.min.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene" aria-label="عالم ثلاثي الأبعاد: قرية صحراوية تتجول فيها بالجمل"></canvas>

  <!-- UI root: the UI module (js/ui/ui.js) owns everything inside. -->
  <div id="ui">
    <section id="loader" class="loader" aria-label="شاشة البداية" aria-busy="true">
      <div class="ld-sky" aria-hidden="true"></div>
      <svg class="ld-stars" viewBox="0 0 400 200" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
        <defs><path id="ld-star" d="M0 -6L1.3 -2.5L4.2 -4.2L2.5 -1.3L6 0L2.5 1.3L4.2 4.2L1.3 2.5L0 6L-1.3 2.5L-4.2 4.2L-2.5 1.3L-6 0L-2.5 -1.3L-4.2 -4.2L-1.3 -2.5Z"/></defs>
        <use href="#ld-star" x="40" y="30" class="tw1"/><use href="#ld-star" x="98" y="70" class="tw2" transform="scale(.6)"/>
        <use href="#ld-star" x="330" y="26" class="tw3"/><use href="#ld-star" x="365" y="80" class="tw1" transform="scale(.7)"/>
        <use href="#ld-star" x="210" y="14" class="tw2" transform="scale(.5)"/><use href="#ld-star" x="150" y="44" class="tw3" transform="scale(.8)"/>
        <use href="#ld-star" x="290" y="60" class="tw2" transform="scale(.9)"/><use href="#ld-star" x="16" y="96" class="tw3" transform="scale(.6)"/>
      </svg>
      <div class="ld-sun" aria-hidden="true"></div>
      <div class="ld-dunes" aria-hidden="true">
        <svg class="dune d4" viewBox="0 0 1440 320" preserveAspectRatio="xMidYMax slice"><path d="M0 150C200 104 380 96 560 134S900 176 1080 128S1340 90 1440 116V320H0Z"/></svg>
        <svg class="dune d3" viewBox="0 0 1440 320" preserveAspectRatio="xMidYMax slice"><path d="M0 206C180 176 360 166 520 190S860 222 1040 186S1320 168 1440 196V320H0Z"/>
          <g class="village"><path d="M700 196v-26h34v26zM726 170v-8h6v8zM742 194v-40h28v40zM746 154v-5h4v5zM756 154v-5h4v5zM764 154v-5h4v5zM778 192v-22h40v22zM798 170a16 16 0 0 1 32 0v20h-32zM812 154l2-8 2 8zM836 190v-48h14v48zM832 142h22v-6h-22zM858 188v-22h36v22z"/>
          <path d="M620 196c1-12 0-22 3-34" stroke-width="3.5" fill="none" class="trunk"/><path d="M623 162c-8-6-18-6-26 1 8-2 16-1 26 1zM623 162c8-6 18-6 26 1-8-2-16-1-26 1zM623 162c-4-8-11-12-18-12 6 2 11 6 18 12zM623 162c4-8 11-12 18-12-6 2-11 6-18 12z"/>
          <path d="M930 186c1-14 0-26 3-40" stroke-width="3.5" fill="none" class="trunk"/><path d="M933 146c-8-6-18-6-26 1 8-2 16-1 26 1zM933 146c8-6 18-6 26 1-8-2-16-1-26 1zM933 146c-4-8-11-12-18-12 6 2 11 6 18 12zM933 146c4-8 11-12 18-12-6 2-11 6-18 12z"/></g></svg>
        <svg class="dune d2" viewBox="0 0 1440 320" preserveAspectRatio="xMidYMax slice"><path d="M0 250C240 220 420 230 640 250S1040 272 1240 246S1400 234 1440 240V320H0Z"/></svg>
        <svg class="dune d1" viewBox="0 0 1440 320" preserveAspectRatio="xMidYMax slice"><path d="M0 292C300 268 520 280 760 292S1200 302 1440 284V320H0Z"/></svg>
      </div>
      <div class="ld-content">
        <p class="ld-kicker" id="ld-kicker">معرض أعمال تفاعلي</p>
        <h1 class="ld-title">قرية الواحة</h1>
        <p class="ld-tagline" id="ld-tagline">اركب الجمل وتجوّل بين الأعمال</p>
        <div class="ld-stage">
          <div class="ld-progress" id="ld-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="تحميل القرية">
            <div class="ld-track"><span id="load-bar"></span></div>
            <div class="ld-walker" id="ld-walker">
              <svg class="ld-camel" viewBox="0 0 64 50" aria-hidden="true">
                <g class="c-body"><path d="M52 22C52 14 44 6 36 7C29 8 27 16 22 17C18 17 16 12 14 9L12 7C10 5 5 5 3 7C1 8 1 11 3 11L9 12C12 13 13 17 15 21C17 25 19 29 24 30L48 30C53 30 54 26 52 22Z"/><path d="M52 21q5 3 3 10" fill="none" stroke-width="1.6" class="tail"/></g>
                <rect class="leg l1" x="21" y="28" width="3" height="20" rx="1.5"/><rect class="leg l2" x="26" y="28" width="3" height="20" rx="1.5"/>
                <rect class="leg l3" x="43" y="28" width="3" height="20" rx="1.5"/><rect class="leg l4" x="48" y="28" width="3" height="20" rx="1.5"/>
              </svg>
            </div>
            <p class="ld-status"><span id="ld-text">جارٍ تجهيز القرية…</span> <b id="ld-pct">٠٪</b></p>
          </div>
          <button type="button" class="ld-start" id="ld-start" hidden>
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2L14.53 5.9L19.07 4.93L18.1 9.47L22 12L18.1 14.53L19.07 19.07L14.53 18.1L12 22L9.47 18.1L4.93 19.07L5.9 14.53L2 12L5.9 9.47L4.93 4.93L9.47 5.9Z"/></svg>
            <span>ادخل القرية</span>
          </button>
        </div>
        <p class="ld-hint"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 9.5h3.2L11.5 5.5v13l-4.8-4H3.5z"/><path d="M15 9.2a4 4 0 0 1 0 5.6M17.8 6.5a7.8 7.8 0 0 1 0 11"/></svg> الصوت يعمل عند الدخول</p>
      </div>
      <p class="ld-name" id="ld-name"></p>
    </section>
  </div>

  <p id="fatal" hidden></p>
  <script type="module" src="js/main.js"></script>
</body>
</html>
