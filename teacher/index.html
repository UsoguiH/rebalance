<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>معلّم القدرات</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Tajawal:wght@500;800;900&display=swap" rel="stylesheet" />
<style>
  :root { --bg: #faeddd; --card: #fff; --line: #ead9c4; --ink: #3c2a1e; --muted: #8a7563; --stage: #fbf1e4; --accent: #7c3aed; --accent-deep: #5b21b6; --chip: #f3e8ff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1d1724; --card: #2a2233; --line: #3d3249; --ink: #f6eefc; --muted: #b9a8c9; --chip: #3b2a55; } }
  :root[data-theme="dark"] { --bg: #1d1724; --card: #2a2233; --line: #3d3249; --ink: #f6eefc; --muted: #b9a8c9; --chip: #3b2a55; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Tajawal, Nunito, system-ui, sans-serif; }
  header { max-width: 1180px; margin: 0 auto; padding: 32px 16px 8px; display: flex; align-items: end; gap: 16px; flex-wrap: wrap; justify-content: space-between; }
  h1 { margin: 0; font-size: clamp(28px, 5vw, 44px); font-weight: 900; }
  h1 span { color: var(--accent); }
  header p { margin: 6px 0 0; color: var(--muted); font-size: 17px; font-weight: 500; }
  .chip { background: var(--chip); color: var(--accent); padding: 6px 12px; border-radius: 999px; font: 800 14px Nunito, sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 16px 16px 48px; display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
  .card { all: unset; cursor: pointer; background: var(--card); border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 22px; padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 8px; transition: transform .12s ease-out, border-color .12s; }
  .card:hover { border-color: #cdb4f7; }
  .card:active { transform: scale(.97); }
  .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .view { direction: ltr; width: 100%; background: var(--stage); border-radius: 15px; overflow: hidden; position: relative; }
  .label { display: flex; justify-content: space-between; align-items: baseline; padding: 0 6px; gap: 8px; }
  .label b { font-size: 21px; font-weight: 900; }
  .label small { font: 800 13px Nunito, sans-serif; color: var(--muted); direction: ltr; }
  .overlay { position: fixed; inset: 0; background: rgba(20, 10, 30, .55); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 5; }
  .overlay.open { display: flex; }
  .big { background: var(--card); border-radius: 28px; border: 2px solid var(--line); border-bottom-width: 6px; padding: 14px; width: min(480px, 100%, calc((100vh - 120px) * 0.75)); display: flex; flex-direction: column; gap: 10px; }
  .bar { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .bar b { font-size: 24px; font-weight: 900; }
  .btn { all: unset; cursor: pointer; background: var(--chip); color: var(--accent); border-bottom: 4px solid #d9c2fb; border-radius: 14px; padding: 8px 14px; font: 900 15px Nunito, Tajawal, sans-serif; }
  .btn.main { background: var(--accent); color: #fff; border-bottom-color: var(--accent-deep); }
  .btn:active { transform: translateY(2px); border-bottom-width: 2px; }
  body.solo { background: #fbf1e4; overflow: hidden; }
  body.solo header, body.solo main { display: none; }
  body.solo .overlay { display: flex; background: #fbf1e4; padding: 0; }
  body.solo .big { border: 0; padding: 0; background: none; width: 100vw; border-radius: 0; }
  body.solo .view { border-radius: 0; }
  body.solo .bar { display: none; }
</style>
</head>
<body>
<header>
  <div>
    <h1>معلّم <span>القدرات</span></h1>
    <p>الشخصية نفسها من الصورة الأصلية — ١٠ حركات حيّة. اضغط على أي بطاقة لتكبيرها</p>
  </div>
  <span class="chip">original art · 10 animated poses</span>
</header>
<main id="grid"></main>
<div class="overlay" id="ov" role="dialog" aria-modal="true">
  <div class="big">
    <div class="bar">
      <b id="bigTitle"></b>
      <div style="display:flex;gap:8px">
        <button class="btn" id="prev" aria-label="السابق">→</button>
        <button class="btn" id="pause">إيقاف</button>
        <button class="btn" id="next" aria-label="التالي">←</button>
        <button class="btn main" id="close">إغلاق</button>
      </div>
    </div>
    <div class="view" id="bigView"></div>
  </div>
</div>
<script type="module">
import { POSES, mountStage, render, fit } from './anim.js';

const L = await (await fetch('img/layers.json')).json();
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const params = new URLSearchParams(location.search);
const grid = document.getElementById('grid');

const cards = POSES.map((pose, i) => {
  const btn = document.createElement('button');
  btn.className = 'card';
  btn.setAttribute('aria-label', `${pose.ar} — ${pose.en}`);
  btn.innerHTML = `<div class="view"></div><div class="label"><b>${pose.ar}</b><small>${pose.en}</small></div>`;
  grid.appendChild(btn);
  const S = mountStage(btn.querySelector('.view'), pose, L);
  S.visible = true; S.offset = i * 431;
  btn.addEventListener('click', () => openBig(i));
  render(S, 0);
  return S;
});
// nothing runs unseen
const io = new IntersectionObserver((es) => es.forEach((e) => { const S = cards.find((k) => k.el.parentElement === e.target); if (S) S.visible = e.isIntersecting; }), { rootMargin: '80px' });
cards.forEach((S) => io.observe(S.el.parentElement));
addEventListener('resize', () => { cards.forEach(fit); if (big) fit(big); });

const ov = document.getElementById('ov'), bigView = document.getElementById('bigView');
let big = null, bigIdx = -1, bigStart = 0, paused = false, pauseT = 0;
const pauseBtn = document.getElementById('pause');
function openBig(i) {
  bigIdx = (i + POSES.length) % POSES.length;
  ov.classList.add('open');
  big = mountStage(bigView, POSES[bigIdx], L);
  bigStart = performance.now(); paused = false; pauseBtn.textContent = 'إيقاف';
  document.getElementById('bigTitle').textContent = `${POSES[bigIdx].ar} · ${POSES[bigIdx].en}`;
  render(big, 0);
}
function closeBig() { ov.classList.remove('open'); big = null; bigIdx = -1; bigView.innerHTML = ''; }
pauseBtn.onclick = () => { paused = !paused; if (paused) pauseT = performance.now() - bigStart; else bigStart = performance.now() - pauseT; pauseBtn.textContent = paused ? 'تشغيل' : 'إيقاف'; };
document.getElementById('close').onclick = closeBig;
document.getElementById('prev').onclick = () => openBig(bigIdx - 1);
document.getElementById('next').onclick = () => openBig(bigIdx + 1);
ov.addEventListener('click', (e) => { if (e.target === ov) closeBig(); });
addEventListener('keydown', (e) => { if (bigIdx < 0) return; if (e.key === 'Escape') closeBig(); if (e.key === 'ArrowLeft') openBig(bigIdx + 1); if (e.key === 'ArrowRight') openBig(bigIdx - 1); if (e.key === ' ') { e.preventDefault(); pauseBtn.click(); } });

// one clock; requestAnimationFrame already pauses in a hidden tab
const t0 = performance.now();
let manual = false;
function tick(now) {
  if (!manual) {
    if (!big) for (const S of cards) { if (S.visible) render(S, now - t0 + S.offset); }
    else if (!paused) render(big, now - bigStart);
  }
  requestAnimationFrame(tick);
}
if (!reduced) requestAnimationFrame(tick);

// export hooks: ?solo=<id> fills the window with one pose; __renderAt(ms) draws an exact frame
if (params.has('solo')) {
  document.body.classList.add('solo');
  manual = true;
  openBig(Math.max(0, POSES.findIndex((p) => p.id === params.get('solo'))));
}
window.__poses = POSES.map((p) => ({ id: p.id, period: p.period }));
window.__renderAt = (ms) => { manual = true; render(big, ms); };
window.__ready = true;
</script>
</body>
</html>
