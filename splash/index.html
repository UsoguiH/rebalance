<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glass Blob Mascot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  :root {
    --page: #f4f3f6;
    --bezel: #0b0a0d;
    --frame-a: #e9e8ec;
    --frame-b: #9f9ea5;
    --screen: #020003;
    --w: 393px;            /* logical screen width; everything scales off it */
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --page: #0d0c10; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --page: #0d0c10; color-scheme: dark; }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--page);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    font-family: "Inter", "SF Pro Display", -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- phone frame (desktop / wide screens) ---------- */
  .phone {
    position: relative;
    padding: calc(var(--w) * 0.032);
    border-radius: calc(var(--w) * 0.175);
    background: linear-gradient(135deg, var(--frame-a), var(--frame-b) 45%, var(--frame-a) 70%, var(--frame-b));
    box-shadow: 0 30px 80px rgba(0,0,0,.18), inset 0 0 0 1px rgba(255,255,255,.6);
  }
  .phone::before {             /* black bezel ring inside the metal band */
    content: ""; position: absolute; inset: calc(var(--w) * 0.012);
    border-radius: calc(var(--w) * 0.163); background: var(--bezel);
  }
  .screen {
    position: relative; overflow: hidden;
    width: var(--w); height: calc(var(--w) * 2.168);
    border-radius: calc(var(--w) * 0.142);
    background: #020003;
    color: #fff;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; touch-action: manipulation;
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- status bar (frame mode only) ---------- */
  .status {
    position: absolute; left: 0; right: 0; top: 0; height: calc(var(--w) * 0.14);
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(var(--w) * 0.012) calc(var(--w) * 0.105) 0 calc(var(--w) * 0.115);
    font-weight: 600; font-size: calc(var(--w) * 0.0405); letter-spacing: -0.01em;
  }
  .status svg { height: calc(var(--w) * 0.03); width: auto; display: block; }
  .status .icons { display: flex; align-items: center; gap: calc(var(--w) * 0.014); }

  /* ---------- back button ---------- */
  .back {
    position: absolute;
    left: calc(var(--w) * (0.109 - 0.053)); top: calc(var(--w) * (0.211 - 0.053));
    width: calc(var(--w) * 0.106); height: calc(var(--w) * 0.106);
    border-radius: 50%; border: 0; padding: 0;
    background: #18151b; color: #f2f1f5;
    display: grid; place-items: center; cursor: pointer;
  }
  .back svg { width: calc(var(--w) * 0.046); height: auto; }

  /* ---------- headline ---------- */
  .headline {
    position: absolute; left: 0; right: 0;
    top: calc(var(--w) * 0.9854);
    margin: 0; text-align: center;
    font-weight: 400;
    font-size: calc(var(--w) * 0.0765);
    line-height: calc(var(--w) * 0.0828);
    letter-spacing: -0.052em;
    color: #8f8d8e;
  }
  .headline { transition: opacity .18s ease, transform .18s ease, filter .18s ease; }
  .headline.swap { opacity: 0; transform: translateY(calc(var(--w) * 0.012)); filter: blur(3px); }
  .headline .hi  { color: #ffffff; }
  .headline .mid { color: #8f8d8e; }
  .headline .low { color: #d8d7da; }

  /* ---------- agent: answer, state chips, ask box ---------- */
  .agent {
    position: absolute; left: 0; right: 0;
    top: calc(var(--w) * 1.19); bottom: calc(var(--w) * 0.055 + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; gap: calc(var(--w) * 0.03);
    padding: 0 calc(var(--w) * 0.06);
  }
  .answer {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    text-align: center; color: #d2d0d6;
    font-size: calc(var(--w) * 0.043); line-height: 1.45; letter-spacing: -0.012em;
    padding: calc(var(--w) * 0.02) calc(var(--w) * 0.02);
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 10%, #000 90%, transparent);
            mask-image: linear-gradient(to bottom, transparent, #000 10%, #000 90%, transparent);
    scrollbar-width: none; -webkit-user-select: text; user-select: text;
  }
  .answer::-webkit-scrollbar { display: none; }
  .answer .you { display: block; color: #6f6b76; font-size: calc(var(--w) * 0.035); margin-bottom: calc(var(--w) * 0.02); }
  .answer .note { display: block; color: #8a8592; font-size: calc(var(--w) * 0.034); margin-top: calc(var(--w) * 0.02); }
  .answer .caret { display: inline-block; width: 0.5ch; animation: blinkc 1s steps(1) infinite; color: #8b84ff; }
  @keyframes blinkc { 50% { opacity: 0; } }

  .chips {
    display: flex; gap: calc(var(--w) * 0.02); overflow-x: auto; scrollbar-width: none;
    margin: 0 calc(var(--w) * -0.06); padding: 2px calc(var(--w) * 0.06);
    -webkit-mask-image: linear-gradient(to right, transparent, #000 6%, #000 94%, transparent);
            mask-image: linear-gradient(to right, transparent, #000 6%, #000 94%, transparent);
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    font: 500 calc(var(--w) * 0.034)/1 "Inter", system-ui, sans-serif; letter-spacing: -0.01em;
    color: #e9e8ec; background: #18151b;
    border: 1px solid rgba(255,255,255,.08); border-radius: 999px;
    padding: calc(var(--w) * 0.021) calc(var(--w) * 0.032);
    display: inline-flex; align-items: center; gap: calc(var(--w) * 0.014);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: background .2s, border-color .2s, transform .12s, box-shadow .2s;
  }
  .chip:hover { background: #221e27; }
  .chip:active { transform: scale(.95); }
  .chip:focus-visible, .send:focus-visible { outline: 2px solid #8b84ff; outline-offset: 2px; }
  .chip .emo { font-size: 1.1em; line-height: 1; }
  .chip[aria-pressed="true"] { background: #26212c; border-color: var(--tint); box-shadow: 0 0 calc(var(--w) * 0.05) -4px var(--tint); }

  .ask {
    display: flex; align-items: center; gap: calc(var(--w) * 0.02);
    background: #18151b; border: 1px solid rgba(255,255,255,.09); border-radius: 999px;
    padding: calc(var(--w) * 0.012) calc(var(--w) * 0.012) calc(var(--w) * 0.012) calc(var(--w) * 0.048);
    transition: border-color .2s, box-shadow .2s;
  }
  .ask:focus-within { border-color: rgba(139,132,255,.55); box-shadow: 0 0 calc(var(--w) * 0.06) -6px #8b84ff; }
  .ask input {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: none;
    color: #f2f1f5; font: 400 max(16px, calc(var(--w) * 0.042)) "Inter", system-ui, sans-serif; letter-spacing: -0.01em;
    padding: calc(var(--w) * 0.018) 0;
  }
  .ask input::placeholder { color: #6f6b76; }
  .send {
    flex: none; width: calc(var(--w) * 0.1); height: calc(var(--w) * 0.1); border-radius: 50%;
    border: 0; background: #f2f1f5; color: #0b0a0d; display: grid; place-items: center; cursor: pointer;
    transition: background .2s, color .2s, transform .12s;
  }
  .send:active { transform: scale(.92); }
  .send svg { width: calc(var(--w) * 0.044); height: auto; }
  .send .stop { display: none; }
  .send[data-busy="true"] { background: #2a2530; color: #f2f1f5; }
  .send[data-busy="true"] .go { display: none; }
  .send[data-busy="true"] .stop { display: block; }

  .zzz {
    position: absolute; pointer-events: none;
    left: calc(var(--w) * 0.69); top: calc(var(--w) * 0.33);
    font: 600 calc(var(--w) * 0.05)/1 "Inter", system-ui, sans-serif; color: #b9b4ff;
    opacity: 0; transition: opacity .6s;
  }
  .zzz.on { opacity: 1; }
  .zzz span { position: absolute; left: 0; top: 0; opacity: 0; animation: zfloat 3s ease-out infinite; }
  .zzz span:nth-child(2) { animation-delay: 1s; font-size: 0.8em; }
  .zzz span:nth-child(3) { animation-delay: 2s; font-size: 0.65em; }
  @keyframes zfloat {
    0%   { transform: translate(0, 0) scale(.6); opacity: 0; }
    20%  { opacity: .9; }
    100% { transform: translate(calc(var(--w) * 0.08), calc(var(--w) * -0.16)) scale(1.25); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .zzz span, .answer .caret { animation: none; }
    .zzz span:first-child { opacity: .8; }
  }
  canvas { cursor: pointer; }

  /* ---------- full-bleed on phones ---------- */
  body.bleed .phone { padding: 0; border-radius: 0; background: none; box-shadow: none; }
  body.bleed .phone::before { display: none; }
  body.bleed .phone { width: 100%; height: 100%; }
  body.bleed .screen { border-radius: 0; width: 100%; height: 100%; }
  body.bleed .status { display: none; }
  body.bleed { background: var(--screen); }
</style>
</head>
<body>
<div class="phone">
  <div class="screen" id="screen">
    <canvas id="gl" aria-hidden="true"></canvas>

    <div class="status" aria-hidden="true">
      <span>10:10</span>
      <span class="icons">
        <svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#fff"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#fff"/><rect x="10" y="3" width="3" height="9" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#fff"/></svg>
        <svg viewBox="0 0 16 12"><path d="M8 11.6l2.3-2.7a3.4 3.4 0 0 0-4.6 0z" fill="#fff"/><path d="M3.8 6.9a6.2 6.2 0 0 1 8.4 0l1.4-1.6a8.4 8.4 0 0 0-11.2 0z" fill="#fff"/><path d="M1.4 4.1a9.9 9.9 0 0 1 13.2 0L16 2.5a12 12 0 0 0-16 0z" fill="#fff"/></svg>
        <svg viewBox="0 0 27 12"><rect x="0.5" y="0.5" width="23" height="11" rx="3.3" fill="none" stroke="rgba(255,255,255,.4)"/><rect x="2" y="2" width="20" height="8" rx="2.2" fill="#fff"/><path d="M25 4v4c.8-.3 1.4-1.1 1.4-2s-.6-1.7-1.4-2z" fill="rgba(255,255,255,.4)"/></svg>
      </span>
    </div>

    <button class="back" aria-label="Replay intro" title="Replay intro">
      <svg viewBox="0 0 20 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 8H1.5M8 1.5L1.5 8 8 14.5"/></svg>
    </button>

    <h1 class="headline" id="headline" aria-live="polite"><span class="hi">Hey There!</span> <span class="mid">What’s On</span><br><span class="low">Your Mind Today</span></h1>

    <div class="zzz" id="zzz" aria-hidden="true"><span>z</span><span>z</span><span>z</span></div>

    <div class="agent">
      <div class="answer" id="answer" aria-live="polite"></div>
      <div class="chips" id="chips" role="group" aria-label="Show a state"></div>
      <form class="ask" id="ask" autocomplete="off">
        <input id="askInput" type="text" maxlength="500" placeholder="Ask me anything…" aria-label="Ask the mascot">
        <button class="send" id="send" type="submit" aria-label="Send" data-busy="false">
          <svg class="go" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 16V4M4.5 9.5L10 4l5.5 5.5"/></svg>
          <svg class="stop" viewBox="0 0 20 20"><rect x="5" y="5" width="10" height="10" rx="2" fill="currentColor"/></svg>
        </button>
      </form>
    </div>
  </div>
</div>

<script>
(() => {
  // ------------------------------------------------------------------
  // Layout (all measurements were taken from the reference recording and
  // expressed in units of the phone screen width W).
  // ------------------------------------------------------------------
  const BLOB_X = 0.5, BLOB_Y = 0.533, BLOB_R = 0.233;   // blob rest centre + radius
  const LOOP = 2.026;                                     // length of the reference clip (used by ?t=)

  const screen = document.getElementById('screen');
  function layout() {
    const vw = innerWidth, vh = innerHeight;
    const bleed = vw <= 560 || vw / vh < 0.62;
    document.body.classList.toggle('bleed', bleed);
    let w;
    if (bleed) w = vw;
    else w = Math.min(430, (vh * 0.92) / (2.168 + 0.064 * 1.0) );
    document.documentElement.style.setProperty('--w', w + 'px');
  }
  layout();
  addEventListener('resize', () => { layout(); resize(); });

  // ------------------------------------------------------------------
  // Keyframe helper: [[t, value], ...] -> eased interpolation
  // ------------------------------------------------------------------
  const ease = x => x * x * (3 - 2 * x);
  function track(keys) {
    return t => {
      if (t <= keys[0][0]) return keys[0][1];
      for (let i = 1; i < keys.length; i++) {
        const [t1, v1] = keys[i];
        if (t <= t1) {
          const [t0, v0] = keys[i - 1];
          const k = ease((t - t0) / (t1 - t0));
          return Array.isArray(v0) ? v0.map((a, j) => a + (v1[j] - a) * k) : v0 + (v1 - v0) * k;
        }
      }
      return keys[keys.length - 1][1];
    };
  }
  // linear (for fast-travelling droplet)
  function lin(keys) {
    return t => {
      if (t <= keys[0][0]) return keys[0][1];
      for (let i = 1; i < keys.length; i++) {
        const [t1, v1] = keys[i];
        if (t <= t1) {
          const [t0, v0] = keys[i - 1];
          const k = (t - t0) / (t1 - t0);
          return v0.map((a, j) => a + (v1[j] - a) * k);
        }
      }
      return keys[keys.length - 1][1];
    };
  }

  // ---- body: [offsetX, offsetY, scale, rimBrightness] (offsets in R units, y down)
  const body = track([
    [0.000, [ 0.02, -0.03, 0.31, 0.55]],
    [0.190, [ 0.02, -0.03, 0.33, 0.55]],
    [0.215, [ 0.02, -0.03, 0.42, 0.55]],
    [0.242, [ 0.01, -0.02, 0.76, 0.50]],
    [0.275, [-0.01, 0.01, 0.92, 0.56]],
    [0.308, [ 0.00, 0.00, 0.99, 0.64]],
    [0.370, [ 0.00, 0.00, 1.015, 0.74]],
    [0.460, [ 0.00, 0.00, 1.00, 0.88]],
    [0.600, [ 0.00, 0.00, 1.00, 1.00]],
    [2.100, [ 0.00, 0.00, 1.00, 1.00]],
  ]);

  // ---- eyes: [x, y, morph(0 small dots -> 1 big glossy pills), scale]  (R units, measured per frame)
  const eyes = lin([
    [0.000, [0.033, -0.043, 0.00, 0.52]], [0.242, [0.033, -0.043, 0.00, 0.52]],
    [0.275, [0.033, -0.043, 0.00, 0.57]], [0.308, [0.033, -0.043, 0.00, 0.76]],
    [0.340, [0.033, -0.043, 0.00, 0.92]], [0.374, [0.033, -0.043, 0.00, 1.05]],
    [0.406, [0.033, -0.045, 0.00, 1.10]], [0.440, [0.033, -0.031, 0.00, 1.09]],
    [0.500, [0.033, -0.002, 0.00, 1.00]], [0.632, [0.033,  0.052, 0.00, 1.00]],
    [0.760, [0.033,  0.109, 0.00, 1.00]], [0.890, [0.033,  0.164, 0.00, 1.00]],
    [0.954, [0.033,  0.182, 0.00, 1.00]], [1.083, [0.033,  0.232, 0.00, 1.00]],
    [1.115, [0.033,  0.246, 0.04, 1.00]], [1.147, [0.031,  0.261, 0.19, 1.00]],
    [1.179, [0.031,  0.275, 0.26, 1.00]], [1.211, [0.031,  0.256, 0.41, 1.00]],
    [1.244, [0.031,  0.154, 0.52, 1.00]], [1.276, [0.028,  0.050, 0.59, 1.00]],
    [1.308, [0.028, -0.052, 0.70, 1.00]], [1.341, [0.031, -0.154, 0.81, 1.00]],
    [1.373, [0.026, -0.237, 0.85, 1.00]], [1.405, [0.028, -0.218, 0.93, 1.00]],
    [1.437, [0.026, -0.197, 0.96, 1.00]], [1.500, [0.026, -0.156, 1.00, 1.00]],
    [1.565, [0.026, -0.118, 1.00, 1.00]], [1.629, [0.026, -0.076, 1.00, 1.00]],
    [1.680, [0.026, -0.053, 1.00, 1.00]], [1.700, [0.026, -0.052, 1.00, 1.00]],
    [2.100, [0.026, -0.052, 1.00, 1.00]],
  ]);

  // ---- coloured lights refracted inside the glass: [x, y, radius, intensity]
  const BLUE = [0.24, 0.17, 1.00], DEEPBLUE = [0.10, 0.10, 0.85], CORAL = [0.82, 0.38, 0.32],
        RED = [0.95, 0.06, 0.04], FLARE = [1.00, 0.30, 0.20], LILAC = [0.24, 0.18, 0.88];
  const lights = [
    { c: BLUE, k: track([          // blue patch, inner upper-left
      [0.00, [-0.70, -0.30, 0.22, 0.38]], [0.22, [-0.66, -0.28, 0.22, 0.38]],
      [0.30, [-0.55, -0.24, 0.22, 0.08]], [0.47, [-0.55, -0.20, 0.22, 0.20]],
      [0.60, [-0.45, -0.22, 0.24, 0.50]], [0.66, [-0.42, -0.22, 0.25, 1.00]],
      [0.82, [-0.45, -0.06, 0.24, 0.75]], [1.00, [-0.50, -0.10, 0.24, 0.60]],
      [1.20, [-0.48, -0.15, 0.24, 0.55]], [1.47, [-0.45, -0.20, 0.27, 1.00]],
      [1.62, [-0.45, -0.28, 0.22, 0.55]], [1.75, [-0.45, -0.30, 0.22, 0.55]],
      [2.03, [-0.48, -0.28, 0.24, 0.85]] ]) },
    { c: DEEPBLUE, k: track([      // blue glow hugging the small eyes
      [0.00, [ 0.12,  0.04, 0.10, 0.90]], [0.22, [ 0.12,  0.04, 0.10, 0.90]],
      [0.30, [ 0.00,  0.03, 0.10, 0.25]], [0.45, [-0.02,  0.02, 0.10, 0.70]],
      [0.62, [-0.04,  0.10, 0.11, 0.80]], [0.82, [-0.10,  0.20, 0.12, 0.90]],
      [1.08, [-0.10,  0.18, 0.12, 0.80]], [1.25, [-0.20,  0.00, 0.12, 0.35]],
      [1.40, [-0.25, -0.10, 0.12, 0.00]], [2.03, [-0.25, -0.10, 0.12, 0.00]] ]) },
    { c: LILAC, k: track([         // blue/violet band along the bottom rim
      [0.00, [ 0.00,  0.95, 0.30, 0.00]], [0.47, [ 0.00,  0.95, 0.30, 0.10]],
      [0.66, [ 0.00,  0.95, 0.32, 0.55]], [0.86, [-0.05,  0.95, 0.34, 0.80]],
      [1.08, [-0.10,  0.92, 0.36, 1.00]], [1.22, [ 0.10,  0.90, 0.32, 0.45]],
      [1.45, [ 0.50,  0.75, 0.28, 0.30]], [1.70, [ 0.55,  0.70, 0.26, 0.15]],
      [2.03, [ 0.50,  0.72, 0.28, 0.30]] ]) },
    { c: CORAL, k: track([         // warm coral along the top-right rim
      [0.00, [ 0.20, -0.60, 0.20, 0.35]], [0.22, [ 0.25, -0.65, 0.20, 0.30]],
      [0.30, [ 0.35, -0.85, 0.26, 0.15]], [0.62, [ 0.40, -0.85, 0.26, 0.22]],
      [0.86, [ 0.40, -0.80, 0.28, 0.45]], [1.00, [ 0.38, -0.82, 0.28, 0.65]],
      [1.20, [ 0.38, -0.82, 0.28, 0.60]], [1.50, [ 0.42, -0.78, 0.26, 0.45]],
      [1.80, [ 0.45, -0.68, 0.26, 0.38]], [2.03, [ 0.45, -0.66, 0.26, 0.32]] ]) },
    { c: RED, k: track([           // the red ember that swims up inside
      [0.00, [ 0.60,  0.30, 0.10, 0.00]], [0.84, [ 0.55,  0.25, 0.10, 0.00]],
      [0.89, [ 0.20,  0.00, 0.15, 1.00]], [0.95, [ 0.15, -0.15, 0.13, 1.00]],
      [1.05, [ 0.08, -0.25, 0.10, 0.90]], [1.18, [ 0.05, -0.30, 0.07, 0.70]],
      [1.36, [ 0.04, -0.32, 0.05, 0.00]], [2.03, [ 0.04, -0.32, 0.05, 0.00]] ]) },
    { c: FLARE, k: track([         // the red flash that sweeps the right rim
      [0.00, [ 0.70,  0.50, 0.30, 0.00]], [0.64, [ 0.65,  0.55, 0.22, 0.00]],
      [0.75, [ 0.62,  0.58, 0.24, 0.35]], [0.85, [ 0.80,  0.35, 0.32, 0.50]],
      [0.89, [ 0.85,  0.25, 0.38, 0.85]], [0.96, [ 0.72,  0.10, 0.30, 0.35]],
      [1.08, [ 0.60,  0.00, 0.26, 0.00]], [2.03, [ 0.60,  0.00, 0.26, 0.00]] ]) },
  ];

  // ---- the red droplet thrown off during the intro: [x, y, radius, alpha]
  const drop = lin([
    [0.000, [-0.56,  0.35, 0.165, 1]], [0.033, [-0.60,  0.36, 0.165, 1]],
    [0.070, [-0.60,  0.32, 0.165, 1]], [0.085, [-0.30,  0.22, 0.165, 0.8]],
    [0.100, [-0.12,  0.12, 0.165, 0.75]], [0.125, [ 0.80, -0.20, 0.170, 1]],
    [0.178, [ 0.86, -0.19, 0.170, 1]],
    [0.210, [ 0.80, -0.17, 0.170, 1]], [0.242, [ 0.82, -0.12, 0.150, 1]],
    [0.262, [ 0.88, -0.10, 0.080, 0.6]], [0.275, [ 0.88, -0.08, 0.030, 0]],
    [2.100, [ 0.88, -0.08, 0.000, 0]],
  ]);
  // ---- small violet speck that touches the top-right edge
  const speck = track([
    [0.00, [0.85, -0.72, 0.050, 0.0]], [0.60, [0.86, -0.70, 0.045, 0.0]],
    [0.66, [0.85, -0.72, 0.050, 0.8]], [0.75, [0.82, -0.74, 0.052, 1.0]],
    [0.82, [0.80, -0.74, 0.045, 0.5]], [0.87, [0.78, -0.74, 0.030, 0.0]],
    [2.10, [0.78, -0.74, 0.030, 0.0]],
  ]);
  // ghost visibility of lights outside the (collapsed) body
  const ghost = track([[0, 1], [0.215, 1], [0.30, 0], [2.1, 0]]);

  // ---- star specks (screen-W units): x, y, brightness, twinkle
  const STARS = [
    [0.493, 0.182, 0.42, 0], [0.639, 0.182, 0.15, 1], [0.454, 0.209, 0.26, 0], [0.474, 0.209, 0.26, 0],
    [0.493, 0.209, 0.29, 0], [0.619, 0.209, 0.18, 0], [0.368, 0.235, 0.21, 0], [0.387, 0.235, 0.19, 0],
    [0.407, 0.235, 0.22, 0], [0.434, 0.235, 0.25, 0], [0.487, 0.250, 0.75, 1], [0.421, 0.288, 0.75, 1],
    [0.454, 0.290, 0.66, 1], [0.745, 0.460, 0.95, 1], [0.811, 0.511, 0.75, 0], [0.785, 0.666, 0.53, 0],
    [0.295, 0.772, 0.80, 1], [0.679, 0.877, 0.98, 1], [0.324, 0.720, 0.70, 1], [0.636, 0.775, 0.80, 1],
    [0.672, 0.858, 0.85, 1], [0.162, 0.590, 0.30, 0], [0.900, 0.380, 0.25, 0], [0.560, 0.205, 0.20, 0],
  ];

  // ------------------------------------------------------------------
  // WebGL
  // ------------------------------------------------------------------
  const canvas = document.getElementById('gl');
  const gl = canvas.getContext('webgl', { antialias: false, premultipliedAlpha: false, preserveDrawingBuffer: true });
  if (!gl) return;

  const VS = `attribute vec2 a; void main(){ gl_Position = vec4(a,0.,1.); }`;
  const FS = `
precision highp float;
uniform vec2  uRes;      // canvas px
uniform float uW;        // screen width in canvas px
uniform float uL;        // intro time (drop layering)
uniform float uS;        // continuous seconds (shape wobble, twinkle, shimmer)
uniform float uBlink;    // 1 open .. 0 closed
uniform vec4  uBody;     // offset.xy, scale, rim brightness
uniform vec4  uEye;      // x, y, morph, scale
uniform vec4  uLP[6];
uniform vec3  uLC[6];
uniform vec4  uDrop;
uniform float uDropFront;  // 1: drop passes in front of the mascot
uniform vec4  uTrail[4];   // motion trail: x, y, r, alpha (negative alpha = behind)
uniform vec4  uSpeck;
uniform float uGhost;
uniform vec4  uStars[24];
uniform vec3  uMood;     // laugh, cry, angry weights
uniform vec4  uMood2;    // think, happy, surprised, confused weights
uniform vec4  uMood3;    // sleep, listen, speak weights, voice-ring age (0..1, 1 = none)
uniform float uT;        // free-running seconds (mood animation)
uniform vec2  uSquash;   // body squash & stretch

const vec2  C  = vec2(${BLOB_X.toFixed(3)}, ${BLOB_Y.toFixed(3)});
const float RR = ${BLOB_R.toFixed(3)};

// Outline traced from the reference at 180 angles per frame: a rounded hexagon
// (6th harmonic, 2.9% of the radius; every other harmonic is ~0) spinning clockwise
// at a steady 11.5 rad/s of phase = 1.92 rad/s of rotation.
float shapeBody(float a, float t){
  return 0.985 + 0.029 * cos(6.0 * a + 6.86 - 11.5 * t);
}
float shapeHalo(float a, float t){
  float b = a + 0.45 * t;                      // the halo turns slowly, as one rigid shape
  return 1.265*(1.0 + 0.024*cos(5.0*b + 1.00)
                    + 0.020*cos(3.0*b + 2.50)
                    + 0.014*cos(2.0*b + 0.30)
                    + 0.010*cos(7.0*b + 0.90));
}
float sdRoundBox(vec2 p, vec2 b, float r){
  vec2 q = abs(p) - b + r;
  return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
}
// glossy red droplet lit from the mascot's side, with a soft glow; returns rgb + coverage
vec4 dropShade(vec2 p, vec4 D, vec2 toward, float px, float gloss){
  if (D.z < 0.001 || D.w <= 0.0) return vec4(0.0);
  vec2  dq = (p - D.xy) / D.z;
  float dd = length(dq);
  float soft = 0.045 + 1.5 * px / D.z;
  float m = 1.0 - smoothstep(1.0 - soft, 1.0 + soft, dd);
  vec3  n = vec3(dq, sqrt(max(1.0 - dd * dd, 0.0)));
  vec3  ld = normalize(vec3(toward * 0.85, 0.55));
  float diff = clamp(dot(n, ld), 0.0, 1.0);
  vec3  c = mix(vec3(0.70, 0.05, 0.04), vec3(1.00, 0.46, 0.30), diff);
  float spec = pow(max(dot(reflect(-ld, n), vec3(0.0, 0.0, 1.0)), 0.0), 18.0);
  c += vec3(1.0, 0.85, 0.78) * spec * 0.55 * gloss;
  c = mix(c, vec3(1.0, 0.55, 0.45), smoothstep(0.75, 1.0, dd) * 0.25);           // soft lit rim
  float glow = exp(-max(dd - 1.0, 0.0) / 0.45) * (1.0 - m) * 0.30;
  return vec4(c, (m + glow) * D.w);
}
// three glowing thought sparks orbiting the mascot on a tilted ring (front or back half)
vec4 thoughtSparks(vec2 p, vec2 c, float s, float t, float front, float px){
  vec4 acc = vec4(0.0);
  for (int i = 0; i < 3; i++){
    float th = t * 2.4 + float(i) * 2.0944;
    float z = sin(th);
    if ((z > 0.0) != (front > 0.5)) continue;
    vec2 o = vec2(cos(th) * 1.32, sin(th) * 0.30);
    float ca = cos(-0.32), sa = sin(-0.32);
    o = vec2(ca * o.x - sa * o.y, sa * o.x + ca * o.y) * s;
    float r = 0.045 * s * (1.0 + 0.3 * z);
    float d = length(p - c - o);
    float core = 1.0 - smoothstep(r * 0.75 - px, r + px, d);
    float glow = exp(-max(d - r, 0.0) / (r * 1.3)) * 0.55;
    vec3 tint = i == 0 ? vec3(0.55, 0.85, 1.0) : (i == 1 ? vec3(0.78, 0.62, 1.0) : vec3(1.0, 0.95, 1.0));
    float a = max(core, glow) * (0.75 + 0.25 * z);
    acc.rgb = mix(acc.rgb, mix(tint, vec3(1.0), core * 0.6), a);
    acc.a = max(acc.a, a);
  }
  return acc;
}
float bgLevel(float y){
  float v = mix(15.0, 18.0, smoothstep(0.0, 0.35, y));
  v = mix(v, 9.0, smoothstep(0.35, 0.68, y));
  v = mix(v, 2.5, smoothstep(0.66, 0.80, y));
  return v / 255.0;
}

void main(){
  vec2 frag = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec2 s  = frag / uW;                 // screen units (W = 1), y down
  float px = 1.0 / (uW * RR);          // one pixel in blob-R units
  vec2 p  = (s - C) / RR;              // blob-R units around rest centre
  float L = uL;

  // ---- background
  float v = bgLevel(s.y);
  vec3 col = vec3(v, max(v - 3.0/255.0, 0.0), v + 3.0/255.0);

  // ---- halo (ghost sphere behind the mascot, lit from above)
  float ah = atan(p.y, p.x);
  float rh = shapeHalo(ah, uS);
  float dh = length(p) / rh;
  float hin = 1.0 - smoothstep(1.0 - 1.5*px/rh, 1.0 + 1.5*px/rh, dh);
  vec2  nh = p / max(length(p), 1e-4);
  float top = smoothstep(0.15, -0.95, nh.y);
  // soft shadow the halo casts on the sides / bottom (none on top: it is lit from above)
  col *= 1.0 - 0.72 * exp(-max(dh - 1.0, 0.0) / 0.28) * (1.0 - top) * (1.0 - hin);
  vec3 haloCol = vec3(0.012, 0.008, 0.017) * (0.25 + 0.75 * smoothstep(0.8, -0.3, nh.y))
               + vec3(0.072, 0.067, 0.078) * top * smoothstep(0.62, 0.99, dh)
               + vec3(0.020, 0.018, 0.022) * top;
  haloCol += vec3(0.11, 0.012, 0.01) * uMood.z * (0.35 + 0.65 * top) * smoothstep(0.55, 0.99, dh);
  haloCol += vec3(0.00, 0.012, 0.05) * uMood.y * top * smoothstep(0.55, 0.99, dh);
  col = mix(col, haloCol, hin);
  col += vec3(0.030, 0.027, 0.033) * exp(-pow((dh - 0.992) / 0.02, 2.0)) * (0.6 + 0.4*top);

  // ---- star specks
  float sr = max(0.0016 * uW, 0.9);
  for (int i = 0; i < 24; i++){
    vec4 st = uStars[i];
    float tw = st.w > 0.5 ? 0.35 + 0.65 * step(0.0, sin(uT * 3.14159 * 2.0 + float(i) * 2.1) + 0.2) : 1.0;
    float d = length(frag - st.xy * uW);
    col += vec3(st.z * tw) * exp(-d*d / (sr*sr));
  }

  // ---- coloured lights (shared by body + ghosts)
  vec3 ghostCol = vec3(0.0);
  float glw[6];
  for (int i = 0; i < 6; i++){
    vec2 d = p - uLP[i].xy;
    float g = uLP[i].w * exp(-dot(d, d) / (uLP[i].z * uLP[i].z));
    glw[i] = g;
    ghostCol += uLC[i] * g;
  }

  // ---- droplet + trail
  vec2 tob = normalize(uBody.xy - uDrop.xy + vec2(1e-4));         // towards the mascot
  vec4 dropC = dropShade(p, uDrop, tob, px, 1.0);
  bool dropFront = uDropFront > 0.5;
  vec4 trailF = vec4(0.0), trailB = vec4(0.0);
  for (int i = 0; i < 4; i++){
    vec4 tr = uTrail[i];
    vec4 tc = dropShade(p, vec4(tr.xy, tr.z, abs(tr.w)), tob, px, 0.0);
    if (tr.w > 0.0) trailF = vec4(mix(trailF.rgb, tc.rgb, tc.a), max(trailF.a, tc.a));
    else            trailB = vec4(mix(trailB.rgb, tc.rgb, tc.a), max(trailB.a, tc.a));
  }

  // ghosts of the lights visible outside the collapsed body
  col += ghostCol * uGhost * 0.28;

  col = mix(col, trailB.rgb, trailB.a);
  vec4 sparkB = thoughtSparks(p, uBody.xy, uBody.z, uT, 0.0, px);
  sparkB.a *= uMood2.x;
  col = mix(col, sparkB.rgb, sparkB.a);
  // voice ring: a soft ring that rolls outward when he hears a keystroke or speaks
  float vr = length((p - uBody.xy) / uBody.z);
  float va = uMood3.w;
  col += vec3(0.72, 0.78, 1.0) * exp(-pow((vr - (1.04 + 0.42 * va)) / 0.022, 2.0)) * (1.0 - va) * 0.32
       * clamp(uMood3.y + uMood3.z, 0.0, 1.0);
  if (!dropFront) col = mix(col, dropC.rgb, dropC.a);

  // ---- body
  vec2  q  = (p - uBody.xy) / (uBody.z * uSquash);
  float a  = atan(q.y, q.x);
  float rb = shapeBody(a, uS)
           + uMood.z * (0.030 * cos(9.0 * a + 7.0 * uT) + 0.018 * cos(13.0 * a - 11.0 * uT));
  float d  = length(q) / rb;
  float aa = 1.3 * px / (uBody.z * min(uSquash.x, uSquash.y) * rb);
  float beat = pow(0.5 + 0.5 * sin(uT * 9.0), 3.0);           // angry heartbeat
  float msum = clamp(uMood.x + uMood.y + uMood.z + uMood2.x + uMood2.y + uMood2.z + uMood2.w + uMood3.x, 0.0, 1.0);
  float inside = 1.0 - smoothstep(1.0 - aa, 1.0 + aa, d);

  if (inside > 0.0){
    vec2 nb = q / max(length(q), 1e-4);
    float rim = pow(clamp((d - 0.50) / 0.50, 0.0, 1.0), 1.05);
    float lit = 0.64 + 0.44 * dot(nb, normalize(vec2(-0.75, -0.65)));
    vec3 base = vec3(0.86, 0.83, 0.92);
    base = mix(base, vec3(1.00, 0.88, 0.76), uMood.x * 0.40);
    base = mix(base, vec3(0.62, 0.72, 1.00), uMood.y * 0.75);
    base = mix(base, vec3(1.00, 0.55, 0.48), uMood.z * 0.60);
    vec3 bc = base * (0.74 * rim + 0.14 * smoothstep(0.90, 1.0, d)) * lit * uBody.w * (1.0 - 0.15 * uMood.y) * (1.0 - 0.32 * uMood3.x);
    for (int i = 0; i < 6; i++){
      float g = min(glw[i], 1.0) * (1.0 - 0.55 * msum) * (1.0 - 0.6 * uMood3.x);
      bc = bc * (1.0 - 0.62 * g) + uLC[i] * g * (0.62 + 0.12 * rim);
    }
    // mood glows inside the glass
    vec2 g1 = q - vec2(0.0, 0.62);
    float gl1 = uMood.x * (0.45 + 0.20 * sin(uT * 17.0)) * exp(-dot(g1, g1) / 0.10);
    vec2 g1b = q - vec2(0.45, -0.62);
    gl1 += uMood.x * 0.35 * exp(-dot(g1b, g1b) / 0.06);
    bc = bc * (1.0 - 0.5 * gl1) + vec3(1.00, 0.62, 0.22) * gl1 * (0.75 + 0.2 * rim);
    vec2 g2 = q - vec2(0.0, 0.78);
    float gl2 = uMood.y * 0.80 * exp(-dot(g2, g2) / 0.16);
    vec2 g2b = q - vec2(-0.5, -0.25);
    gl2 += uMood.y * 0.55 * exp(-dot(g2b, g2b) / 0.06);
    bc = bc * (1.0 - 0.5 * gl2) + vec3(0.20, 0.33, 1.00) * gl2 * (0.75 + 0.2 * rim);
    vec2 g3 = q - vec2(0.0, 0.22);
    float gl3 = uMood.z * (0.35 + 0.45 * beat) * exp(-dot(g3, g3) / 0.22);
    vec2 g3b = q - vec2(0.15, -0.82);
    gl3 += uMood.z * 0.8 * exp(-dot(g3b, g3b) / 0.15);
    bc = bc * (1.0 - 0.5 * gl3) + vec3(1.00, 0.10, 0.05) * gl3 * (0.75 + 0.2 * rim);

    // eyes (body-local units)
    float m = clamp(uEye.z, 0.0, 1.1);
    vec2  hs = mix(vec2(0.0315, 0.045), vec2(0.0765, 0.109), m);   // half size
    float sp = mix(0.068, 0.1535, m);                               // half spacing
    float sc = uEye.w;
    hs *= sc; sp *= sc;
    hs.y *= mix(1.0, uBlink, step(0.5, m));
    vec2 e = p - uEye.xy;                                           // eyes measured in world R units
    float side = e.x >= 0.0 ? 1.0 : -1.0;                           // +1 his left eye (screen right)
    e.x = abs(e.x) - sp;                                            // +x points away from the face centre
    float sd = sdRoundBox(e, hs, min(hs.x, hs.y) * 0.98);

    // ---- expression eyes: same glossy pill style, rounded everywhere
    float wsum = max(1.0, uMood.x + uMood.y + uMood.z + uMood2.x + uMood2.y + uMood2.z + uMood2.w + uMood3.x);
    vec3  mw = uMood / wsum;
    vec4  m2 = uMood2 / wsum;
    float mz = uMood3.x / wsum;
    float msw = mw.x + mw.y + mw.z + m2.x + m2.y + m2.z + m2.w + mz;

    // laugh: smiling eyes - the pill pushed shut from below by his cheeks, leaving a thick
    // rounded arch; tilted slightly outward and squeezing in time with the laugh
    vec2  lq = e - vec2(0.0, 0.01 * sc);
    float lc = cos(0.12), ls = sin(0.12);
    vec2  lp = vec2(lc * lq.x + ls * lq.y, -ls * lq.x + lc * lq.y);
    lp.y *= 1.0 + 0.14 * abs(sin(uT * 8.5));
    float lrr = 0.016 * sc;
    vec2  lhs = vec2(0.092, 0.070) * sc;
    float lPill = sdRoundBox(lp, lhs - lrr, min(lhs.x, lhs.y) - lrr);
    float lCheek = length(lp - vec2(0.0, 0.078 * sc)) - 0.108 * sc;
    float sdL = max(lPill, -lCheek - lrr) - lrr;

    // cry: big soft eyes whose tops droop to the outside, trembling a little
    vec2  cq = e + vec2(0.0, 0.004 * sc * sin(uT * 45.0) * mw.y);
    vec2  chs = vec2(0.086, 0.116) * sc;
    float crr = 0.034 * sc;
    float cBox = sdRoundBox(cq, chs - crr, (min(chs.x, chs.y) - crr) * 0.9);
    float cLid = (-0.045 * sc + 0.50 * cq.x - cq.y) / sqrt(1.0 + 0.50 * 0.50);
    float sdC = max(cBox, cLid + crr) - crr;

    // angry: squinting eyes whose tops slant down to the middle
    vec2  ahs = vec2(0.088, 0.104) * sc;
    float arr = 0.030 * sc;
    float aBox = sdRoundBox(e - vec2(0.0, 0.012 * sc), ahs - arr, (min(ahs.x, ahs.y) - arr) * 0.9);
    float aLid = (-0.012 * sc - 0.52 * e.x - e.y) / sqrt(1.0 + 0.52 * 0.52);
    float sdA = max(aBox, aLid + arr) - arr;

    // happy: the same smiling arch as laugh, calm (no squeeze)
    vec2  hp = vec2(lc * lq.x + ls * lq.y, -ls * lq.x + lc * lq.y);
    float sdH = max(sdRoundBox(hp, lhs - lrr, min(lhs.x, lhs.y) - lrr),
                    -(length(hp - vec2(0.0, 0.078 * sc)) - 0.108 * sc) - lrr) - lrr;

    // think: pills looking up, his left eye narrowed as if weighing something
    vec2  ths = vec2(0.070, 0.098) * sc;
    float trr = 0.032 * sc;
    float tBox = sdRoundBox(e, ths - trr, (min(ths.x, ths.y) - trr) * 0.9);
    float tLid = (side > 0.0 ? (-0.048 * sc + 0.22 * e.x) : -0.2) - e.y;
    float sdT = max(tBox, tLid + trr) - trr;

    // surprised: big round eyes
    float sdS = length(e - vec2(0.0, -0.012 * sc)) - 0.096 * sc;

    // confused: one eye shrinks and lifts, the other stays big
    vec2  qhs = (side > 0.0 ? vec2(0.054, 0.074) : vec2(0.080, 0.112)) * sc;
    float sdQ = sdRoundBox(e - vec2(0.0, side > 0.0 ? -0.035 * sc : 0.0), qhs, min(qhs.x, qhs.y) * 0.98);

    // sleep: closed eyes, relaxed downward curves
    vec2  zq = e - vec2(0.0, -0.030 * sc);
    float zr = 0.068 * sc, zt = 0.016 * sc;
    float sdZ = zq.y > 0.0 ? abs(length(zq) - zr) - zt : length(vec2(abs(zq.x) - zr, zq.y)) - zt;

    sd = sd * (1.0 - msw) + sdL * mw.x + sdC * mw.y + sdA * mw.z
       + sdT * m2.x + sdH * m2.y + sdS * m2.z + sdQ * m2.w + sdZ * mz;

    float eaa = 1.2 * px;
    float emask = 1.0 - smoothstep(-eaa, eaa, sd);
    float border = 0.024 * sc;
    float yy = e.y / hs.y;
    float inner = 0.51 + 0.10 * smoothstep(-0.2, 0.4, yy) + 0.33 * smoothstep(0.35, 0.92, yy);
    vec3 icol = vec3(inner, inner*0.99, inner*1.02);
    // cry: watery blue pooling at the bottom plus two wet glints
    icol = mix(icol, vec3(0.40, 0.58, 1.00), mw.y * smoothstep(0.0, 0.9, yy) * 0.85);
    vec2 hl1 = e - vec2(0.026 * sc, -0.022 * sc), hl2 = e - vec2(-0.03 * sc, 0.045 * sc);
    icol = mix(icol, vec3(1.0), mw.y * (exp(-dot(hl1, hl1) / pow(0.022 * sc, 2.0)) * 0.95
                                      + exp(-dot(hl2, hl2) / pow(0.011 * sc, 2.0)) * 0.8));
    // angry: hot red-grey inside with one small hard glint
    icol = mix(icol, vec3(0.66, 0.30, 0.32) * (0.85 + 0.3 * smoothstep(0.2, 0.9, yy)), mw.z * 0.75);
    vec2 hl3 = e - vec2(0.022 * sc, 0.035 * sc);
    icol = mix(icol, vec3(1.0, 0.9, 0.9), mw.z * exp(-dot(hl3, hl3) / pow(0.012 * sc, 2.0)) * 0.9);
    vec3 ecol = mix(vec3(0.97), icol,
                    smoothstep(0.45, 1.0, m) * (1.0 - mw.x - m2.y - mz) * smoothstep(-border*0.4, -border*1.2, sd));
    ecol = mix(ecol, vec3(1.0) * (0.90 + 0.10 * smoothstep(0.0, 0.06, -lp.y / sc)), mw.x + m2.y);   // laugh/happy: solid white
    ecol = mix(ecol, vec3(0.93, 0.92, 0.98), mz);                                                    // sleep: soft white lines
    vec2 hs4 = e - vec2(0.03 * sc, -0.045 * sc);
    ecol = mix(ecol, vec3(1.0), m2.z * exp(-dot(hs4, hs4) / pow(0.02 * sc, 2.0)) * 0.9);            // surprised glint
    // soft glow around eyes
    bc += vec3(0.12) * exp(-max(sd, 0.0) / (0.010 * sc)) * (1.0 - emask);
    bc = mix(bc, ecol, emask);

    col = mix(col, bc, inside);
  }

  col = mix(col, trailF.rgb, trailF.a);

  const CHIPS = [
    ['listen', '👂', 'Listen', '#8fb3ff'], ['think', '🤔', 'Think', '#b49cff'], ['speak', '💬', 'Speak', '#9fe0ff'],
    ['happy', '😊', 'Happy', '#ffd27a'], ['laugh', '😂', 'Laugh', '#ffb36b'], ['surprised', '😮', 'Surprised', '#ffe08a'],
    ['confused', '😕', 'Confused', '#c9b6ff'], ['cry', '😢', 'Cry', '#6f8cff'], ['angry', '😠', 'Angry', '#ff5a4f'],

    speak:     ['Okay,', 'Here’s', 'What I Think'],

  function poseAt(L) {
    return { L, shape: L, body: body(L), eyes: eyes(L), lp: lights.map(l => l.k(L)),
             drop: drop(L), dropFront: L < 0.215 ? 1 : 0, trail: NO_TRAIL,

  // ---- the droplet's orbit: a tilted ellipse through the measured lower-left and
  // upper-right turning points, passing in front of the mascot on the way up
  const OC = [0.11, 0.07], OU = [0.939, -0.344], OV = [0.344, 0.939], OA = 0.756, OB = 0.13;
  function orbitAt(u) {

    const k = 0.5 * u + 0.5 * ease(u);                // eases in and out of the spin
    const phi = Math.PI + 2 * Math.PI * k;            // one full turn, starting and ending lower-left
    const c = Math.cos(phi), sn = Math.sin(phi);

  }

  // where the red ball is at intro time t: one turn around the small mascot, then it
  // glides into him as he grows and dissolves inside like a glow (it never just vanishes)
  function dropAt(t) {
    if (t < ORBIT) {
      const o = orbitAt(t / ORBIT);
      return { x: o.x, y: o.y, r: DROP_R * (1 + 0.22 * o.z), a: 1, front: o.z > 0, z: o.z };
    }

    const L = 0.19 + (t - ORBIT);
    const g = ease(Math.min(1, Math.max(0, (L - 0.19) / 0.16)));     // glide towards his middle
    const f = ease(Math.min(1, Math.max(0, (L - 0.30) / 0.35)));     // then melt away inside

      P.eyes[0] += (0.03 * (d.x - OC[0]) / OA - 0.05 * (d.x - OC[0])) * sw;
      P.eyes[1] += (0.015 * (d.y - OC[1]) / OA - 0.05 * (d.y - OC[1])) * sw;

  const ERRORS = {

      setMood(next, 4.5);
      lastActivity = T;
    },
  };
  function setBusy(b) {
    agent.busy = b;
    sendBtn.dataset.busy = String(b);
    sendBtn.setAttribute('aria-label', b ? 'Stop' : 'Send');
  }
  function parseReply(text) {
    const m = text.match(/^\s*\[([a-zA-Z]+)\]\s*/);
    if (m) return { tag: m[1].toLowerCase(), body: text.slice(m[0].length) };
    if (/^\s*\[[a-zA-Z]*$/.test(text)) return { tag: null, body: '' };       // tag still arriving
    return { tag: null, body: text };
  }

  async function ask(q) {
    wake();
    setBusy(true);
    answerEl.textContent = '';
    const you = document.createElement('span'); you.className = 'you'; you.textContent = q;
    const out = document.createElement('span');
    const caret = document.createElement('span'); caret.className = 'caret'; caret.textContent = '▍';
    answerEl.append(you, out, caret);
    Object.assign(agent, { revealing: true, target: '', shown: 0, reveal: 0, done: false, tag: null, out, caret, note: '',
                           startAt: T + 0.9 });                                  // think for at least a moment
    setMood('think', 0);

    if (!sample) {
      await new Promise(r => setTimeout(r, 1400));
      Object.assign(agent, { target: OFFLINE, tag: 'happy', done: true });
      return;
    }
    const ctl = agent.ctl = new AbortController();
    agent.turns.push({ role: 'user', content: q });
    agent.turns = agent.turns.slice(-8);
    try {
      const { text } = await sample([{ role: 'user', content: RULES }, ...agent.turns], {
        modelTier: 'quick', cache: false, signal: ctl.signal,
        onText: ({ text }) => { const r = parseReply(text); agent.target = r.body; if (r.tag) agent.tag = r.tag; },
      });
      const r = parseReply(text);
      agent.target = r.body.trim() || agent.target; agent.tag = r.tag;
      agent.turns.push({ role: 'assistant', content: text });
      agent.done = true;
    } catch (e) {
      agent.turns.pop();                                        // forget the unanswered question
      const code = e && e.code;
      if (code === 'cancelled') {
        agent.target = agent.target.slice(0, agent.shown); agent.tag = null; agent.done = true;
        return;
      }
      if (BLOCKED.includes(code)) {
        sample = null;
        agent.target = OFFLINE; agent.tag = 'confused';
      } else {
        agent.target = agent.target.slice(0, Math.max(agent.shown, 0));
        agent.note = ERRORS[code] || ERRORS.upstream_error;
        agent.tag = 'confused';
      }
      agent.done = true;
    }
  }

  const hint = document.createElement('span');
  hint.className = 'note';
  hint.textContent = 'Ask me something below, or tap a state to see it.';
  answerEl.append(hint);

  form.addEventListener('submit', e => {
    e.preventDefault();
    if (agent.busy) { agent.ctl?.abort(); return; }
    const q = input.value.trim();
    if (!q) { input.focus(); return; }
    input.value = '';
    ask(q);
  });
  input.addEventListener('input', () => {
    wake();
    pulseAt = T; kick = 1;
    if (!agent.busy) setMood(input.value ? 'listen' : null, 0);
    if (!agent.busy && !input.value) setMood(null);
  });
  input.addEventListener('focus', () => { wake(); if (!agent.busy && input.value) setMood('listen', 0); });
  input.addEventListener('blur', () => { if (!agent.busy && mood === 'listen') setMood(null); });

  // ?t=1.25 freezes the idle animation on one loop time (handy for comparing frames)
  const params = new URLSearchParams(location.search);
  const fixed = params.get('t');
  window.__renderAt = render;
  window.__introAt = t => { gl.uniform2f(u.squash, 1, 1); const P = introPose(t); P.shape = t; draw(P, 1, t); };
  window.__ambAt = t => { gl.uniform2f(u.squash, 1, 1); const P = ambientPose(t, 1); P.shape = t + 3; draw(P, 1, t); };
  window.__setMood = setMood;
  if (fixed !== null) { render(parseFloat(fixed) % LOOP); return; }
  if (STATES.includes(params.get('mood'))) setMood(params.get('mood'));

  let last = performance.now();
  (function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    step(dt);
    requestAnimationFrame(frame);
  })(last);
})();
</script>
</body>
</html>
