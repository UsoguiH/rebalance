<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glass Blob Mascot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  :root {
    --page: #f4f3f6;
    --bezel: #0b0a0d;
    --frame-a: #e9e8ec;
    --frame-b: #9f9ea5;
    --screen: #020003;
    --w: 393px;            /* logical screen width; everything scales off it */
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --page: #0d0c10; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --page: #0d0c10; color-scheme: dark; }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--page);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    font-family: "Inter", "SF Pro Display", -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- phone frame (desktop / wide screens) ---------- */
  .phone {
    position: relative;
    padding: calc(var(--w) * 0.032);
    border-radius: calc(var(--w) * 0.175);
    background: linear-gradient(135deg, var(--frame-a), var(--frame-b) 45%, var(--frame-a) 70%, var(--frame-b));
    box-shadow: 0 30px 80px rgba(0,0,0,.18), inset 0 0 0 1px rgba(255,255,255,.6);
  }
  .phone::before {             /* black bezel ring inside the metal band */
    content: ""; position: absolute; inset: calc(var(--w) * 0.012);
    border-radius: calc(var(--w) * 0.163); background: var(--bezel);
  }
  .screen {
    position: relative; overflow: hidden;
    width: var(--w); height: calc(var(--w) * 2.168);
    border-radius: calc(var(--w) * 0.142);
    background: #020003;
    color: #fff;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; touch-action: manipulation;
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- status bar (frame mode only) ---------- */
  .status {
    position: absolute; left: 0; right: 0; top: 0; height: calc(var(--w) * 0.14);
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(var(--w) * 0.012) calc(var(--w) * 0.105) 0 calc(var(--w) * 0.115);
    font-weight: 600; font-size: calc(var(--w) * 0.0405); letter-spacing: -0.01em;
  }
  .status svg { height: calc(var(--w) * 0.03); width: auto; display: block; }
  .status .icons { display: flex; align-items: center; gap: calc(var(--w) * 0.014); }

  /* ---------- back button ---------- */
  .back {
    position: absolute;
    left: calc(var(--w) * (0.109 - 0.053)); top: calc(var(--w) * (0.211 - 0.053));
    width: calc(var(--w) * 0.106); height: calc(var(--w) * 0.106);
    border-radius: 50%; border: 0; padding: 0;
    background: #18151b; color: #f2f1f5;
    display: grid; place-items: center; cursor: pointer;
  }
  .back svg { width: calc(var(--w) * 0.046); height: auto; }

  /* ---------- headline ---------- */
  .headline {
    position: absolute; left: 0; right: 0;
    top: calc(var(--w) * 0.9854);
    margin: 0; text-align: center;
    font-weight: 400;
    font-size: calc(var(--w) * 0.0765);
    line-height: calc(var(--w) * 0.0828);
    letter-spacing: -0.052em;
    color: #8f8d8e;
  }
  .headline { transition: opacity .18s ease, transform .18s ease, filter .18s ease; }
  .headline.swap { opacity: 0; transform: translateY(calc(var(--w) * 0.012)); filter: blur(3px); }
  .headline .hi  { color: #ffffff; }
  .headline .mid { color: #8f8d8e; }
  .headline .low { color: #d8d7da; }

  /* ---------- mood controls ---------- */
  .moods {
    position: absolute; left: 0; right: 0; top: calc(var(--w) * 1.25);
    display: flex; justify-content: center; gap: calc(var(--w) * 0.025);
  }
  .mood {
    font: 500 calc(var(--w) * 0.038)/1 "Inter", system-ui, sans-serif;
    letter-spacing: -0.01em;
    color: #e9e8ec; background: #18151b;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 999px;
    padding: calc(var(--w) * 0.026) calc(var(--w) * 0.042);
    display: inline-flex; align-items: center; gap: calc(var(--w) * 0.018);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: background .2s, border-color .2s, transform .12s, box-shadow .2s;
  }
  .mood:hover { background: #221e27; }
  .mood:active { transform: scale(.95); }
  .mood:focus-visible { outline: 2px solid #8b84ff; outline-offset: 2px; }
  .mood .emo { font-size: 1.15em; line-height: 1; }
  .mood[aria-pressed="true"] { background: #26212c; border-color: var(--tint); box-shadow: 0 0 calc(var(--w) * 0.05) -4px var(--tint); }
  .mood[data-mood="laugh"] { --tint: #ffb36b; }
  .mood[data-mood="cry"]   { --tint: #6f8cff; }
  .mood[data-mood="angry"] { --tint: #ff5a4f; }
  .hint {
    position: absolute; left: 0; right: 0; top: calc(var(--w) * 1.39);
    text-align: center; color: #5d5a63;
    font-size: calc(var(--w) * 0.032); letter-spacing: -0.01em;
  }
  canvas { cursor: pointer; }

  /* ---------- full-bleed on phones ---------- */
  body.bleed .phone { padding: 0; border-radius: 0; background: none; box-shadow: none; }
  body.bleed .phone::before { display: none; }
  body.bleed .phone { width: 100%; height: 100%; }
  body.bleed .screen { border-radius: 0; width: 100%; height: 100%; }
  body.bleed .status { display: none; }
  body.bleed { background: var(--screen); }
</style>
</head>
<body>
<div class="phone">
  <div class="screen" id="screen">
    <canvas id="gl" aria-hidden="true"></canvas>

    <div class="status" aria-hidden="true">
      <span>10:10</span>
      <span class="icons">
        <svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#fff"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#fff"/><rect x="10" y="3" width="3" height="9" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#fff"/></svg>
        <svg viewBox="0 0 16 12"><path d="M8 11.6l2.3-2.7a3.4 3.4 0 0 0-4.6 0z" fill="#fff"/><path d="M3.8 6.9a6.2 6.2 0 0 1 8.4 0l1.4-1.6a8.4 8.4 0 0 0-11.2 0z" fill="#fff"/><path d="M1.4 4.1a9.9 9.9 0 0 1 13.2 0L16 2.5a12 12 0 0 0-16 0z" fill="#fff"/></svg>
        <svg viewBox="0 0 27 12"><rect x="0.5" y="0.5" width="23" height="11" rx="3.3" fill="none" stroke="rgba(255,255,255,.4)"/><rect x="2" y="2" width="20" height="8" rx="2.2" fill="#fff"/><path d="M25 4v4c.8-.3 1.4-1.1 1.4-2s-.6-1.7-1.4-2z" fill="rgba(255,255,255,.4)"/></svg>
      </span>
    </div>

    <button class="back" aria-label="Back">
      <svg viewBox="0 0 20 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 8H1.5M8 1.5L1.5 8 8 14.5"/></svg>
    </button>

    <h1 class="headline" id="headline" aria-live="polite"><span class="hi">Hey There!</span> <span class="mid">What’s On</span><br><span class="low">Your Mind Today</span></h1>

    <div class="moods" role="group" aria-label="Mascot mood">
      <button class="mood" data-mood="laugh" aria-pressed="false"><span class="emo" aria-hidden="true">😂</span>Laugh</button>
      <button class="mood" data-mood="cry" aria-pressed="false"><span class="emo" aria-hidden="true">😢</span>Cry</button>
      <button class="mood" data-mood="angry" aria-pressed="false"><span class="emo" aria-hidden="true">😠</span>Angry</button>
    </div>
    <p class="hint">Tap him to tickle · keys 1 2 3</p>
  </div>
</div>

<script>
(() => {
  // ------------------------------------------------------------------
  // Layout (all measurements were taken from the reference recording and
  // expressed in units of the phone screen width W).
  // ------------------------------------------------------------------
  const BLOB_X = 0.5, BLOB_Y = 0.533, BLOB_R = 0.233;   // blob rest centre + radius
  const LOOP = 2.026;                                     // seconds per cycle

  const screen = document.getElementById('screen');
  function layout() {
    const vw = innerWidth, vh = innerHeight;
    const bleed = vw <= 560 || vw / vh < 0.62;
    document.body.classList.toggle('bleed', bleed);
    let w;
    if (bleed) w = vw;
    else w = Math.min(430, (vh * 0.92) / (2.168 + 0.064 * 1.0) );
    document.documentElement.style.setProperty('--w', w + 'px');
  }
  layout();
  addEventListener('resize', () => { layout(); resize(); });

  // ------------------------------------------------------------------
  // Keyframe helper: [[t, value], ...] -> eased interpolation
  // ------------------------------------------------------------------
  const ease = x => x * x * (3 - 2 * x);
  function track(keys) {
    return t => {
      if (t <= keys[0][0]) return keys[0][1];
      for (let i = 1; i < keys.length; i++) {
        const [t1, v1] = keys[i];
        if (t <= t1) {
          const [t0, v0] = keys[i - 1];
          const k = ease((t - t0) / (t1 - t0));
          return Array.isArray(v0) ? v0.map((a, j) => a + (v1[j] - a) * k) : v0 + (v1 - v0) * k;
        }
      }
      return keys[keys.length - 1][1];
    };
  }
  // linear (for fast-travelling droplet)
  function lin(keys) {
    return t => {
      if (t <= keys[0][0]) return keys[0][1];
      for (let i = 1; i < keys.length; i++) {
        const [t1, v1] = keys[i];
        if (t <= t1) {
          const [t0, v0] = keys[i - 1];
          const k = (t - t0) / (t1 - t0);
          return v0.map((a, j) => a + (v1[j] - a) * k);
        }
      }
      return keys[keys.length - 1][1];
    };
  }

  // ---- body: [offsetX, offsetY, scale, rimBrightness] (offsets in R units, y down)
  const body = track([
    [0.000, [ 0.02, -0.03, 0.31, 0.55]],
    [0.190, [ 0.02, -0.03, 0.33, 0.55]],
    [0.215, [ 0.02, -0.03, 0.42, 0.55]],
    [0.242, [ 0.01, -0.02, 0.76, 0.50]],
    [0.275, [-0.01, 0.01, 0.92, 0.56]],
    [0.308, [ 0.00, 0.00, 0.99, 0.64]],
    [0.370, [ 0.00, 0.00, 1.015, 0.74]],
    [0.460, [ 0.00, 0.00, 1.00, 0.88]],
    [0.600, [ 0.00, 0.00, 1.00, 1.00]],
    [2.100, [ 0.00, 0.00, 1.00, 1.00]],
  ]);

  // ---- eyes: [x, y, morph(0 small dots -> 1 big glossy pills), scale]  (R units, measured per frame)
  const eyes = lin([
    [0.000, [0.033, -0.043, 0.00, 0.52]], [0.242, [0.033, -0.043, 0.00, 0.52]],
    [0.275, [0.033, -0.043, 0.00, 0.57]], [0.308, [0.033, -0.043, 0.00, 0.76]],
    [0.340, [0.033, -0.043, 0.00, 0.92]], [0.374, [0.033, -0.043, 0.00, 1.05]],
    [0.406, [0.033, -0.045, 0.00, 1.10]], [0.440, [0.033, -0.031, 0.00, 1.09]],
    [0.500, [0.033, -0.002, 0.00, 1.00]], [0.632, [0.033,  0.052, 0.00, 1.00]],
    [0.760, [0.033,  0.109, 0.00, 1.00]], [0.890, [0.033,  0.164, 0.00, 1.00]],
    [0.954, [0.033,  0.182, 0.00, 1.00]], [1.083, [0.033,  0.232, 0.00, 1.00]],
    [1.115, [0.033,  0.246, 0.04, 1.00]], [1.147, [0.031,  0.261, 0.19, 1.00]],
    [1.179, [0.031,  0.275, 0.26, 1.00]], [1.211, [0.031,  0.256, 0.41, 1.00]],
    [1.244, [0.031,  0.154, 0.52, 1.00]], [1.276, [0.028,  0.050, 0.59, 1.00]],
    [1.308, [0.028, -0.052, 0.70, 1.00]], [1.341, [0.031, -0.154, 0.81, 1.00]],
    [1.373, [0.026, -0.237, 0.85, 1.00]], [1.405, [0.028, -0.218, 0.93, 1.00]],
    [1.437, [0.026, -0.197, 0.96, 1.00]], [1.500, [0.026, -0.156, 1.00, 1.00]],
    [1.565, [0.026, -0.118, 1.00, 1.00]], [1.629, [0.026, -0.076, 1.00, 1.00]],
    [1.680, [0.026, -0.053, 1.00, 1.00]], [1.700, [0.026, -0.052, 1.00, 1.00]],
    [2.100, [0.026, -0.052, 1.00, 1.00]],
  ]);

  // ---- coloured lights refracted inside the glass: [x, y, radius, intensity]
  const BLUE = [0.24, 0.17, 1.00], DEEPBLUE = [0.10, 0.10, 0.85], CORAL = [0.82, 0.38, 0.32],
        RED = [0.95, 0.06, 0.04], FLARE = [1.00, 0.30, 0.20], LILAC = [0.24, 0.18, 0.88];
  const lights = [
    { c: BLUE, k: track([          // blue patch, inner upper-left
      [0.00, [-0.70, -0.30, 0.22, 0.38]], [0.22, [-0.66, -0.28, 0.22, 0.38]],
      [0.30, [-0.55, -0.24, 0.22, 0.08]], [0.47, [-0.55, -0.20, 0.22, 0.20]],
      [0.60, [-0.45, -0.22, 0.24, 0.50]], [0.66, [-0.42, -0.22, 0.25, 1.00]],
      [0.82, [-0.45, -0.06, 0.24, 0.75]], [1.00, [-0.50, -0.10, 0.24, 0.60]],
      [1.20, [-0.48, -0.15, 0.24, 0.55]], [1.47, [-0.45, -0.20, 0.27, 1.00]],
      [1.62, [-0.45, -0.28, 0.22, 0.55]], [1.75, [-0.45, -0.30, 0.22, 0.55]],
      [2.03, [-0.48, -0.28, 0.24, 0.85]] ]) },
    { c: DEEPBLUE, k: track([      // blue glow hugging the small eyes
      [0.00, [ 0.12,  0.04, 0.10, 0.90]], [0.22, [ 0.12,  0.04, 0.10, 0.90]],
      [0.30, [ 0.00,  0.03, 0.10, 0.25]], [0.45, [-0.02,  0.02, 0.10, 0.70]],
      [0.62, [-0.04,  0.10, 0.11, 0.80]], [0.82, [-0.10,  0.20, 0.12, 0.90]],
      [1.08, [-0.10,  0.18, 0.12, 0.80]], [1.25, [-0.20,  0.00, 0.12, 0.35]],
      [1.40, [-0.25, -0.10, 0.12, 0.00]], [2.03, [-0.25, -0.10, 0.12, 0.00]] ]) },
    { c: LILAC, k: track([         // blue/violet band along the bottom rim
      [0.00, [ 0.00,  0.95, 0.30, 0.00]], [0.47, [ 0.00,  0.95, 0.30, 0.10]],
      [0.66, [ 0.00,  0.95, 0.32, 0.55]], [0.86, [-0.05,  0.95, 0.34, 0.80]],
      [1.08, [-0.10,  0.92, 0.36, 1.00]], [1.22, [ 0.10,  0.90, 0.32, 0.45]],
      [1.45, [ 0.50,  0.75, 0.28, 0.30]], [1.70, [ 0.55,  0.70, 0.26, 0.15]],
      [2.03, [ 0.50,  0.72, 0.28, 0.30]] ]) },
    { c: CORAL, k: track([         // warm coral along the top-right rim
      [0.00, [ 0.20, -0.60, 0.20, 0.35]], [0.22, [ 0.25, -0.65, 0.20, 0.30]],
      [0.30, [ 0.35, -0.85, 0.26, 0.15]], [0.62, [ 0.40, -0.85, 0.26, 0.22]],
      [0.86, [ 0.40, -0.80, 0.28, 0.45]], [1.00, [ 0.38, -0.82, 0.28, 0.65]],
      [1.20, [ 0.38, -0.82, 0.28, 0.60]], [1.50, [ 0.42, -0.78, 0.26, 0.45]],
      [1.80, [ 0.45, -0.68, 0.26, 0.38]], [2.03, [ 0.45, -0.66, 0.26, 0.32]] ]) },
    { c: RED, k: track([           // the red ember that swims up inside
      [0.00, [ 0.60,  0.30, 0.10, 0.00]], [0.84, [ 0.55,  0.25, 0.10, 0.00]],
      [0.89, [ 0.20,  0.00, 0.15, 1.00]], [0.95, [ 0.15, -0.15, 0.13, 1.00]],
      [1.05, [ 0.08, -0.25, 0.10, 0.90]], [1.18, [ 0.05, -0.30, 0.07, 0.70]],
      [1.36, [ 0.04, -0.32, 0.05, 0.00]], [2.03, [ 0.04, -0.32, 0.05, 0.00]] ]) },
    { c: FLARE, k: track([         // the red flash that sweeps the right rim
      [0.00, [ 0.70,  0.50, 0.30, 0.00]], [0.64, [ 0.65,  0.55, 0.22, 0.00]],
      [0.75, [ 0.62,  0.58, 0.24, 0.35]], [0.85, [ 0.80,  0.35, 0.32, 0.50]],
      [0.89, [ 0.85,  0.25, 0.38, 0.85]], [0.96, [ 0.72,  0.10, 0.30, 0.35]],
      [1.08, [ 0.60,  0.00, 0.26, 0.00]], [2.03, [ 0.60,  0.00, 0.26, 0.00]] ]) },
  ];

  // ---- the red droplet thrown off during the intro: [x, y, radius, alpha]
  const drop = lin([
    [0.000, [-0.56,  0.35, 0.165, 1]], [0.033, [-0.60,  0.36, 0.165, 1]],
    [0.070, [-0.60,  0.32, 0.165, 1]], [0.085, [-0.30,  0.22, 0.165, 0.8]],
    [0.100, [-0.12,  0.12, 0.165, 0.75]], [0.125, [ 0.80, -0.20, 0.170, 1]],
    [0.178, [ 0.86, -0.19, 0.170, 1]],
    [0.210, [ 0.80, -0.17, 0.170, 1]], [0.242, [ 0.82, -0.12, 0.150, 1]],
    [0.262, [ 0.88, -0.10, 0.080, 0.6]], [0.275, [ 0.88, -0.08, 0.030, 0]],
    [2.100, [ 0.88, -0.08, 0.000, 0]],
  ]);
  // ---- small violet speck that touches the top-right edge
  const speck = track([
    [0.00, [0.85, -0.72, 0.050, 0.0]], [0.60, [0.86, -0.70, 0.045, 0.0]],
    [0.66, [0.85, -0.72, 0.050, 0.8]], [0.75, [0.82, -0.74, 0.052, 1.0]],
    [0.82, [0.80, -0.74, 0.045, 0.5]], [0.87, [0.78, -0.74, 0.030, 0.0]],
    [2.10, [0.78, -0.74, 0.030, 0.0]],
  ]);
  // ghost visibility of lights outside the (collapsed) body
  const ghost = track([[0, 1], [0.215, 1], [0.30, 0], [2.1, 0]]);

  // ---- star specks (screen-W units): x, y, brightness, twinkle
  const STARS = [
    [0.493, 0.182, 0.42, 0], [0.639, 0.182, 0.15, 1], [0.454, 0.209, 0.26, 0], [0.474, 0.209, 0.26, 0],
    [0.493, 0.209, 0.29, 0], [0.619, 0.209, 0.18, 0], [0.368, 0.235, 0.21, 0], [0.387, 0.235, 0.19, 0],
    [0.407, 0.235, 0.22, 0], [0.434, 0.235, 0.25, 0], [0.487, 0.250, 0.75, 1], [0.421, 0.288, 0.75, 1],
    [0.454, 0.290, 0.66, 1], [0.745, 0.460, 0.95, 1], [0.811, 0.511, 0.75, 0], [0.785, 0.666, 0.53, 0],
    [0.295, 0.772, 0.80, 1], [0.679, 0.877, 0.98, 1], [0.324, 0.720, 0.70, 1], [0.636, 0.775, 0.80, 1],
    [0.672, 0.858, 0.85, 1], [0.162, 0.590, 0.30, 0], [0.900, 0.380, 0.25, 0], [0.560, 0.205, 0.20, 0],
  ];

  // ------------------------------------------------------------------
  // WebGL
  // ------------------------------------------------------------------
  const canvas = document.getElementById('gl');
  const gl = canvas.getContext('webgl', { antialias: false, premultipliedAlpha: false, preserveDrawingBuffer: true });
  if (!gl) return;

  const VS = `attribute vec2 a; void main(){ gl_Position = vec4(a,0.,1.); }`;
  const FS = `
precision highp float;
uniform vec2  uRes;      // canvas px
uniform float uW;        // screen width in canvas px
uniform float uL;        // loop time 0..2
uniform vec4  uBody;     // offset.xy, scale, rim brightness
uniform vec4  uEye;      // x, y, morph, scale
uniform vec4  uLP[6];
uniform vec3  uLC[6];
uniform vec4  uDrop;
uniform vec4  uSpeck;
uniform float uGhost;
uniform vec4  uStars[24];
uniform vec3  uMood;     // laugh, cry, angry weights
uniform float uT;        // free-running seconds (mood animation)
uniform vec2  uSquash;   // body squash & stretch

const vec2  C  = vec2(${BLOB_X.toFixed(3)}, ${BLOB_Y.toFixed(3)});
const float RR = ${BLOB_R.toFixed(3)};

float shapeBody(float a, float L){
  return 1.0 + 0.028*cos(6.0*a + 0.60 + 0.90*L)
             + 0.022*cos(3.0*a + 1.70 - 1.30*L)
             + 0.020*cos(2.0*a + 0.40 + 1.10*L)
             + 0.012*cos(4.0*a + 2.90 + 0.70*L)
             + 0.010*cos(5.0*a + 2.20 - 1.90*L);
}
float shapeHalo(float a, float L){
  return 1.265*(1.0 + 0.024*cos(5.0*a + 1.00 + 0.60*L)
                    + 0.020*cos(3.0*a + 2.50 - 0.80*L)
                    + 0.014*cos(2.0*a + 0.30 + 0.50*L)
                    + 0.010*cos(7.0*a + 0.90 - 0.40*L));
}
float sdRoundBox(vec2 p, vec2 b, float r){
  vec2 q = abs(p) - b + r;
  return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
}
float bgLevel(float y){
  float v = mix(15.0, 18.0, smoothstep(0.0, 0.35, y));
  v = mix(v, 9.0, smoothstep(0.35, 0.68, y));
  v = mix(v, 2.5, smoothstep(0.66, 0.80, y));
  return v / 255.0;
}

void main(){
  vec2 frag = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec2 s  = frag / uW;                 // screen units (W = 1), y down
  float px = 1.0 / (uW * RR);          // one pixel in blob-R units
  vec2 p  = (s - C) / RR;              // blob-R units around rest centre
  float L = uL;

  // ---- background
  float v = bgLevel(s.y);
  vec3 col = vec3(v, max(v - 3.0/255.0, 0.0), v + 3.0/255.0);

  // ---- halo (ghost sphere behind the mascot, lit from above)
  float ah = atan(p.y, p.x);
  float rh = shapeHalo(ah, L);
  float dh = length(p) / rh;
  float hin = 1.0 - smoothstep(1.0 - 1.5*px/rh, 1.0 + 1.5*px/rh, dh);
  vec2  nh = p / max(length(p), 1e-4);
  float top = smoothstep(0.15, -0.95, nh.y);
  // soft shadow the halo casts on the sides / bottom (none on top: it is lit from above)
  col *= 1.0 - 0.72 * exp(-max(dh - 1.0, 0.0) / 0.28) * (1.0 - top) * (1.0 - hin);
  vec3 haloCol = vec3(0.012, 0.008, 0.017) * (0.25 + 0.75 * smoothstep(0.8, -0.3, nh.y))
               + vec3(0.072, 0.067, 0.078) * top * smoothstep(0.62, 0.99, dh)
               + vec3(0.020, 0.018, 0.022) * top;
  haloCol += vec3(0.11, 0.012, 0.01) * uMood.z * (0.35 + 0.65 * top) * smoothstep(0.55, 0.99, dh);
  haloCol += vec3(0.00, 0.012, 0.05) * uMood.y * top * smoothstep(0.55, 0.99, dh);
  col = mix(col, haloCol, hin);
  col += vec3(0.030, 0.027, 0.033) * exp(-pow((dh - 0.992) / 0.02, 2.0)) * (0.6 + 0.4*top);

  // ---- star specks
  float sr = max(0.0016 * uW, 0.9);
  for (int i = 0; i < 24; i++){
    vec4 st = uStars[i];
    float tw = st.w > 0.5 ? 0.35 + 0.65 * step(0.0, sin(L * 3.14159 * 2.0 + float(i) * 2.1) + 0.2) : 1.0;
    float d = length(frag - st.xy * uW);
    col += vec3(st.z * tw) * exp(-d*d / (sr*sr));
  }

  // ---- coloured lights (shared by body + ghosts)
  vec3 ghostCol = vec3(0.0);
  float glw[6];
  for (int i = 0; i < 6; i++){
    vec2 d = p - uLP[i].xy;
    float g = uLP[i].w * exp(-dot(d, d) / (uLP[i].z * uLP[i].z));
    glw[i] = g;
    ghostCol += uLC[i] * g;
  }

  // ---- droplet (helper values)
  vec2  dq  = (p - uDrop.xy) / max(uDrop.z, 1e-3);
  vec2  tob = normalize(uBody.xy - uDrop.xy + vec2(1e-4));        // towards the mascot
  float along = dot(dq, tob);
  vec2  dq2 = vec2(along * (along > 0.0 ? 0.86 : 1.0), dot(dq, vec2(-tob.y, tob.x)));
  float dd  = length(dq2);
  float daa = 0.14 + 1.5 * px / max(uDrop.z, 1e-3);
  float dmask = (1.0 - smoothstep(1.0 - daa, 1.0 + daa, dd)) * uDrop.w * step(0.001, uDrop.z);
  float dl = clamp(0.5 + 0.5 * along, 0.0, 1.0);
  vec3  dcol = mix(vec3(0.90, 0.13, 0.08), vec3(1.00, 0.55, 0.42), smoothstep(0.35, 0.85, dl));
  dcol = mix(dcol, vec3(1.0, 0.86, 0.80), smoothstep(0.80, 1.0, dl) * 0.6);
  bool dropFront = uL < 0.215;

  // ghosts of the lights visible outside the collapsed body
  col += ghostCol * uGhost * 0.28;

  if (!dropFront) col = mix(col, dcol, dmask);

  // ---- body
  vec2  q  = (p - uBody.xy) / (uBody.z * uSquash);
  float a  = atan(q.y, q.x);
  float rb = shapeBody(a, L)
           + uMood.z * (0.030 * cos(9.0 * a + 7.0 * uT) + 0.018 * cos(13.0 * a - 11.0 * uT));
  float d  = length(q) / rb;
  float aa = 1.3 * px / (uBody.z * min(uSquash.x, uSquash.y) * rb);
  float beat = pow(0.5 + 0.5 * sin(uT * 9.0), 3.0);           // angry heartbeat
  float msum = clamp(uMood.x + uMood.y + uMood.z, 0.0, 1.0);
  float inside = 1.0 - smoothstep(1.0 - aa, 1.0 + aa, d);

  if (inside > 0.0){
    vec2 nb = q / max(length(q), 1e-4);
    float rim = pow(clamp((d - 0.50) / 0.50, 0.0, 1.0), 1.05);
    float lit = 0.64 + 0.44 * dot(nb, normalize(vec2(-0.75, -0.65)));
    vec3 base = vec3(0.86, 0.83, 0.92);
    base = mix(base, vec3(1.00, 0.88, 0.76), uMood.x * 0.40);
    base = mix(base, vec3(0.62, 0.72, 1.00), uMood.y * 0.75);
    base = mix(base, vec3(1.00, 0.55, 0.48), uMood.z * 0.60);
    vec3 bc = base * (0.74 * rim + 0.14 * smoothstep(0.90, 1.0, d)) * lit * uBody.w * (1.0 - 0.15 * uMood.y);
    for (int i = 0; i < 6; i++){
      float g = min(glw[i], 1.0) * (1.0 - 0.55 * msum);
      bc = bc * (1.0 - 0.62 * g) + uLC[i] * g * (0.62 + 0.12 * rim);
    }
    // mood glows inside the glass
    vec2 g1 = q - vec2(0.0, 0.62);
    float gl1 = uMood.x * (0.45 + 0.20 * sin(uT * 17.0)) * exp(-dot(g1, g1) / 0.10);
    vec2 g1b = q - vec2(0.45, -0.62);
    gl1 += uMood.x * 0.35 * exp(-dot(g1b, g1b) / 0.06);
    bc = bc * (1.0 - 0.5 * gl1) + vec3(1.00, 0.62, 0.22) * gl1 * (0.75 + 0.2 * rim);
    vec2 g2 = q - vec2(0.0, 0.78);
    float gl2 = uMood.y * 0.80 * exp(-dot(g2, g2) / 0.16);
    vec2 g2b = q - vec2(-0.5, -0.25);
    gl2 += uMood.y * 0.55 * exp(-dot(g2b, g2b) / 0.06);
    bc = bc * (1.0 - 0.5 * gl2) + vec3(0.20, 0.33, 1.00) * gl2 * (0.75 + 0.2 * rim);
    vec2 g3 = q - vec2(0.0, 0.22);
    float gl3 = uMood.z * (0.35 + 0.45 * beat) * exp(-dot(g3, g3) / 0.22);
    vec2 g3b = q - vec2(0.15, -0.82);
    gl3 += uMood.z * 0.8 * exp(-dot(g3b, g3b) / 0.15);
    bc = bc * (1.0 - 0.5 * gl3) + vec3(1.00, 0.10, 0.05) * gl3 * (0.75 + 0.2 * rim);

    // eyes (body-local units)
    float m = clamp(uEye.z, 0.0, 1.1);
    vec2  hs = mix(vec2(0.0315, 0.045), vec2(0.0765, 0.109), m);   // half size
    float sp = mix(0.068, 0.1535, m);                               // half spacing
    float sc = uEye.w;
    hs *= sc; sp *= sc;
    vec2 e = p - uEye.xy;                                           // eyes measured in world R units
    e.x = abs(e.x) - sp;                                            // +x points away from the face centre
    float sd = sdRoundBox(e, hs, min(hs.x, hs.y) * 0.98);

    // laugh: closed happy "^ ^" arcs
    vec2  ac = vec2(0.0, 0.05 * sc);
    float ar = 0.088 * sc, at = 0.025 * sc;
    float arc = e.y < ac.y ? abs(length(e - ac) - ar) - at
                           : length(vec2(abs(e.x) - ar, e.y - ac.y)) - at;
    sd = mix(sd, arc, uMood.x);
    // cry: lids droop towards the outside; angry: lids slam down towards the middle
    float lidC = mix(-1.3 * hs.y, -0.40 * hs.y, uMood.y) + 0.55 * uMood.y * e.x;
    float lidA = mix(-1.3 * hs.y, -0.25 * hs.y, uMood.z) - 0.75 * uMood.z * e.x;
    sd = max(sd, (lidC - e.y) * 0.85);
    sd = max(sd, (lidA - e.y) * 0.78);

    float eaa = 1.2 * px;
    float emask = 1.0 - smoothstep(-eaa, eaa, sd);
    float border = 0.024 * sc;
    float yy = e.y / hs.y;
    float inner = 0.51 + 0.10 * smoothstep(-0.2, 0.4, yy) + 0.33 * smoothstep(0.35, 0.92, yy);
    vec3 icol = vec3(inner, inner*0.99, inner*1.02);
    icol = mix(icol, vec3(0.45, 0.62, 1.00), uMood.y * smoothstep(-0.1, 0.9, yy) * 0.8);   // welling up
    icol = mix(icol, vec3(0.75, 0.42, 0.42), uMood.z * 0.45);
    vec2 hl = e - vec2(0.028 * sc, -0.03 * sc);
    icol += vec3(0.9) * uMood.y * exp(-dot(hl, hl) / pow(0.02 * sc, 2.0));                // wet glint
    vec3 ecol = mix(vec3(0.97), icol,
                    smoothstep(0.45, 1.0, m) * (1.0 - uMood.x) * smoothstep(-border*0.4, -border*1.2, sd));
    // soft glow around eyes
    bc += vec3(0.12) * exp(-max(sd, 0.0) / (0.010 * sc)) * (1.0 - emask);
    bc = mix(bc, ecol, emask);

    col = mix(col, bc, inside);
  }

  if (dropFront) col = mix(col, dcol, dmask);


  // ---- violet speck
  vec2 sq = (p - uSpeck.xy) / max(uSpeck.z, 1e-3);
  float sdd = length(sq);
  float sm = (1.0 - smoothstep(0.7, 1.15, sdd)) * uSpeck.w;
  col = mix(col, mix(vec3(0.52, 0.22, 0.80), vec3(0.80, 0.55, 0.95), clamp(-sq.y*0.6 + 0.3, 0.0, 1.0)), sm);

  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const U = n => gl.getUniformLocation(prog, n);
  const u = {
    res: U('uRes'), w: U('uW'), L: U('uL'), body: U('uBody'), eye: U('uEye'),
    lp: U('uLP'), lc: U('uLC'), drop: U('uDrop'), speck: U('uSpeck'), ghost: U('uGhost'), stars: U('uStars'),
    mood: U('uMood'), t: U('uT'), squash: U('uSquash'),
  };
  gl.uniform4fv(u.stars, new Float32Array(STARS.flat()));
  gl.uniform3fv(u.lc, new Float32Array(lights.flatMap(l => l.c)));

  let cssW = 0;
  function resize() {
    const r = screen.getBoundingClientRect();
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    cssW = canvas.width;
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  resize();

  // ------------------------------------------------------------------
  // Moods
  // ------------------------------------------------------------------
  const REST = 1.75;                       // calm idle pose the moods start from
  const MOOD_SECONDS = 5;
  const MOODS = ['laugh', 'cry', 'angry'];
  const LINES = {
    idle:  ['Hey There!', 'What’s On', 'Your Mind Today'],
    laugh: ['Haha!', 'Stop It,', 'That Tickles!'],
    cry:   ['Oh No…', 'I Feel', 'So Blue Today'],
    angry: ['Grrr!', 'I’m So', 'Mad Right Now'],
  };
  const mixv = (a, b, k) => a.map((x, i) => x + (b[i] - x) * k);
  const w = { laugh: 0, cry: 0, angry: 0 };
  let mood = null, moodUntil = 0, T = 0, idleT = 0;
  const look = { x: 0, y: 0, tx: 0, ty: 0 };

  function draw(L, W, extra) {
    const bodyV = mixv(body(L), body(REST), W);
    const eyeV  = mixv(eyes(L), eyes(REST), W);
    const lp = lights.flatMap(l => mixv(l.k(L), l.k(REST), W));
    const dr = drop(L); dr[3] *= 1 - W;
    const sk = speck(L); sk[3] *= 1 - W;
    if (extra) extra(bodyV, eyeV);
    gl.uniform2f(u.res, canvas.width, canvas.height);
    gl.uniform1f(u.w, cssW);
    gl.uniform1f(u.L, L);
    gl.uniform4fv(u.body, bodyV);
    gl.uniform4fv(u.eye, eyeV);
    gl.uniform4fv(u.lp, new Float32Array(lp));
    gl.uniform4fv(u.drop, dr);
    gl.uniform4fv(u.speck, sk);
    gl.uniform1f(u.ghost, ghost(L) * (1 - W));
    gl.uniform3f(u.mood, w.laugh, w.cry, w.angry);
    gl.uniform1f(u.t, T);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  // idle-only render at a fixed loop time (used by ?t= and frame comparisons)
  function render(L) {
    gl.uniform2f(u.squash, 1, 1);
    draw(L, 0);
  }

  function step(dt) {
    T += dt;
    if (mood && T > moodUntil) setMood(null);
    for (const m of MOODS) w[m] += ((mood === m ? 1 : 0) - w[m]) * (1 - Math.exp(-dt * 6));
    const W = Math.min(1, w.laugh + w.cry + w.angry);
    // the idle loop pauses while a mood is showing and resumes from the calm pose
    idleT = W > 0.97 ? REST : (idleT + dt * (1 - W)) % LOOP;

    // body motion
    const lw = w.laugh, cw = w.cry, aw = w.angry;
    let ox = 0, oy = 0, sx = 1, sy = 1, sc = 1;
    const ph = T * 8.5, hop = Math.abs(Math.sin(ph)), land = Math.pow(1 - hop, 3);
    oy -= 0.075 * hop * lw;
    sx += (0.075 * land - 0.025 * hop) * lw;
    sy -= (0.075 * land - 0.03 * hop) * lw;
    const sob = Math.exp(-6 * ((T * 0.9) % 1));
    sx += (0.045 + 0.025 * sob) * cw;
    sy -= (0.055 + 0.035 * sob) * cw;
    oy += (0.045 + 0.03 * sob) * cw;
    ox += 0.014 * Math.sin(T * 63) * aw;
    oy += 0.009 * Math.sin(T * 47) * aw;
    sc *= 1 + aw * (0.02 + 0.03 * (0.5 + 0.5 * Math.sin(T * 9)));

    look.x += (look.tx - look.x) * (1 - Math.exp(-dt * 8));
    look.y += (look.ty - look.y) * (1 - Math.exp(-dt * 8));


    gl.uniform2f(u.squash, sx, sy);
    draw(idleT, W, (bodyV, eyeV) => {
      bodyV[0] += ox; bodyV[1] += oy; bodyV[2] *= sc;
      eyeV[1] += -0.02 * lw + 0.06 * cw + 0.03 * aw;
      eyeV[0] = eyeV[0] + ox + look.x * 0.05;
      eyeV[1] = eyeV[1] * sy + oy + look.y * 0.035;
      eyeV[3] *= sc;
    });
  }

  // ---- headline swap
  const headline = document.getElementById('headline');
  let shown = 'idle', swapTimer = 0;
  function showLines(key) {
    if (key === shown) return;
    shown = key;
    clearTimeout(swapTimer);
    headline.classList.add('swap');
    swapTimer = setTimeout(() => {
      const [hi, mid, low] = LINES[key];
      headline.querySelector('.hi').textContent = hi;
      headline.querySelector('.mid').textContent = mid;
      headline.querySelector('.low').textContent = low;
      headline.classList.remove('swap');
    }, 180);
  }

  // ---- controls
  const buttons = [...document.querySelectorAll('.mood')];
  function setMood(m) {
    mood = m;
    moodUntil = T + MOOD_SECONDS;
    buttons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mood === m)));
    showLines(m || 'idle');
  }
  buttons.forEach(b => b.addEventListener('click', () => setMood(mood === b.dataset.mood ? null : b.dataset.mood)));
  addEventListener('keydown', e => {
    const i = ['1', '2', '3'].indexOf(e.key);
    if (i >= 0) setMood(mood === MOODS[i] ? null : MOODS[i]);
    if (e.key === 'Escape') setMood(null);
  });
  function blobPoint(e) {
    const r = screen.getBoundingClientRect();
    const W = r.width;
    return { x: ((e.clientX - r.left) / W - BLOB_X) / BLOB_R, y: ((e.clientY - r.top) / W - BLOB_Y) / BLOB_R };
  }
  canvas.addEventListener('click', e => {
    const p = blobPoint(e);
    if (Math.hypot(p.x, p.y) < 1.15) setMood('laugh');        // tickle!
  });
  screen.addEventListener('pointermove', e => {
    const p = blobPoint(e);
    look.tx = Math.max(-1, Math.min(1, p.x / 2.5));
    look.ty = Math.max(-1, Math.min(1, p.y / 2.5));
  });
  screen.addEventListener('pointerleave', () => { look.tx = 0; look.ty = 0; });

  // ?t=1.25 freezes the idle animation on one loop time (handy for comparing frames)
  const params = new URLSearchParams(location.search);
  const fixed = params.get('t');
  window.__renderAt = render;
  window.__setMood = setMood;
  if (fixed !== null) { render(parseFloat(fixed) % LOOP); return; }
  if (MOODS.includes(params.get('mood'))) setMood(params.get('mood'));

  let last = performance.now();
  (function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    step(dt);
    requestAnimationFrame(frame);
  })(last);
})();
</script>
</body>
</html>
