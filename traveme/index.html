<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0022e6">
<title>Traveme Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Manrope:wght@500;600;800&display=swap">
<style>
  :root {
    --cream: #f6e6e1;
    --cream-dim: rgba(246, 230, 225, 0.82);
    --pill: rgba(250, 236, 240, 0.9);
    --pink: #f891db;
    --ink: #2a1630;
    --stage: #0d0d14;
    --screen-gradient: linear-gradient(180deg,
      #0021e4 0%, #0024e8 22%, #0030ea 28%, #0b45ec 33%, #2e5aee 38%,
      #4b6cec 45%, #6a7dea 53%, #8590e6 61%, #9c99dc 67%, #b89adb 72%,
      #dc99d4 76%, #f498c6 80%, #f69ba8 84%, #f6a682 88%, #f6b46b 92%, #f4b862 100%);
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--stage);
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--cream);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }

  /* Device: full-bleed on phones, a phone mock on wider screens. */
  .device { position: relative; width: 100vw; height: 100dvh; }
  .screen {
    position: absolute; inset: 0; overflow: hidden;
    background: var(--screen-gradient);
    touch-action: pan-y; user-select: none; -webkit-user-select: none;
  }
  .status, .home-bar, .island { display: none; }

  @media (min-width: 560px) and (min-height: 700px) {
    body { background: radial-gradient(120% 90% at 50% 10%, #1c1f3a 0%, var(--stage) 60%); }
    .device {
      --w: min(390px, calc((100dvh - 48px) * 390 / 844));
      width: var(--w); height: calc(var(--w) * 844 / 390);
      border-radius: calc(var(--w) * 0.142);
      padding: calc(var(--w) * 0.031);
      background: linear-gradient(145deg, #3a3a44, #121216 40%, #2a2a31);
      box-shadow: 0 0 0 2px #4a4a55, 0 40px 90px rgba(0, 0, 0, 0.55), inset 0 0 0 2px #000;
    }
    .screen { inset: calc(var(--w) * 0.031); border-radius: calc(var(--w) * 0.115); }
    .status, .home-bar, .island { display: flex; }
    .island {
      position: absolute; z-index: 5; top: 11px; left: 50%; transform: translateX(-50%);
      width: 31%; height: 33px; border-radius: 20px; background: #000;
    }
    .status {
      position: absolute; z-index: 4; top: 0; left: 0; right: 0; height: 54px;
      align-items: center; justify-content: space-between; padding: 4px 30px 0 40px;
      font: 600 15px/1 -apple-system, "SF Pro Text", "Manrope", sans-serif; color: #fff; letter-spacing: -0.01em;
    }
    .status .left { display: flex; align-items: center; gap: 5px; }
    .status .right { display: flex; align-items: center; gap: 6px; }
    .home-bar {
      position: absolute; z-index: 4; bottom: 8px; left: 50%; transform: translateX(-50%);
      width: 36%; height: 5px; border-radius: 3px; background: #1a1220; opacity: 0.9;
    }
  }

  canvas#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }

  /* Copy */
  .skip {
    position: absolute; z-index: 3; top: calc(env(safe-area-inset-top, 0px) + 54px); right: 22px;
    background: none; border: 0; padding: 8px 4px; margin: 0;
    font: 600 12.5px/1 "Manrope", sans-serif; color: var(--cream-dim); letter-spacing: 0.01em;
    cursor: pointer; transition: opacity 0.4s ease;
  }
  .skip[hidden] { display: block; opacity: 0; pointer-events: none; }
  .copy {
    position: absolute; z-index: 3; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 88px);
    pointer-events: none; text-align: center;
  }
  .slide-copy { position: absolute; left: 0; right: 0; top: 0; padding: 0 28px; }
  .slide-copy h1 {
    margin: 0; font: 800 35px/0.98 "Manrope", sans-serif; letter-spacing: -0.035em;
    color: var(--cream); text-wrap: balance;
  }
  .slide-copy p {
    margin: 14px auto 0; max-width: 262px;
    font: 500 11.5px/1.45 "Manrope", sans-serif; color: var(--cream-dim); letter-spacing: 0.005em;
  }
  /* Copy leaves together in a quick blur, then arrives line by line, as in the original. */
  .slide-copy .ln { display: block; }
  .slide-copy .ln, .slide-copy p {
    opacity: 0; filter: blur(12px); transform: translateY(4px);
    transition: opacity 0.16s ease, filter 0.18s ease, transform 0.18s ease;
  }
  .slide-copy.is-active .ln, .slide-copy.is-active p {
    opacity: 1; filter: blur(0); transform: none;
    transition: opacity 0.35s ease var(--d), filter 0.42s ease var(--d), transform 0.5s cubic-bezier(.2,.8,.2,1) var(--d);
  }
  .slide-copy .ln:nth-child(1) { --d: 0.3s; }
  .slide-copy .ln:nth-child(2) { --d: 0.45s; }
  .slide-copy p { --d: 0.6s; }
  .is-loading .slide-copy .ln, .is-loading .slide-copy p { transition: none; }
  @media (prefers-reduced-motion: reduce) {
    .slide-copy .ln, .slide-copy p, .slide-copy.is-active .ln, .slide-copy.is-active p { filter: none; transform: none; transition-duration: 0.01s; }
  }

  /* Footer */
  .footer {
    position: absolute; z-index: 3; left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 52px);
    display: flex; align-items: center; justify-content: space-between; padding: 0 22px 0 30px;
  }
  .dots { display: flex; align-items: center; gap: 5px; }
  .dot {
    width: 7px; height: 7px; border-radius: 4px; background: rgba(250, 236, 240, 0.42);
    transition: width 0.55s cubic-bezier(.2,.8,.2,1), background 0.4s ease;
  }
  .dot.is-active { width: 52px; background: rgba(252, 242, 245, 0.95); }
  .next {
    position: relative; height: 40px; min-width: 104px; padding: 0 22px; border: 0; border-radius: 20px;
    background: var(--pill); color: var(--ink); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    font: 600 13px/1 "Manrope", sans-serif; letter-spacing: -0.005em; white-space: nowrap; overflow: hidden;
    box-shadow: 0 6px 18px rgba(120, 40, 80, 0.12);
    transition: background 0.5s ease, min-width 0.55s cubic-bezier(.2,.8,.2,1), transform 0.15s ease;
  }
  .next:active { transform: scale(0.96); }
  .next .label { max-width: 0; margin-right: 0; opacity: 0; overflow: hidden; white-space: nowrap;
    transition: max-width 0.55s cubic-bezier(.2,.8,.2,1), margin-right 0.55s cubic-bezier(.2,.8,.2,1), opacity 0.3s ease; }
  .next svg { width: 15px; height: 15px; flex: none; }
  .next.is-last { background: var(--pink); min-width: 136px; }
  .next.is-last .label { max-width: 90px; margin-right: 8px; opacity: 1; }
  .next.is-last .label { transition-delay: 0s, 0s, 0.2s; }

  .no-webgl .fallback { display: grid; }
  .fallback {
    display: none; position: absolute; inset: 0; z-index: 1; place-items: center;
    font: 800 60px/1 "Archivo Black", sans-serif; color: rgba(246, 230, 225, 0.25);
  }
</style>
</head>
<body>
<div class="device">
  <div class="island" aria-hidden="true"></div>
  <main class="screen is-loading" id="screen" aria-roledescription="carousel" aria-label="Welcome to Traveme">
    <div class="status" aria-hidden="true">
      <span class="left">18:20
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M12 22a2.5 2.5 0 0 0 2.4-2h-4.8a2.5 2.5 0 0 0 2.4 2Zm7-6V11a7 7 0 0 0-5-6.7V3.5a2 2 0 0 0-4 0v.8a7 7 0 0 0-1.9.9L19 16ZM3.3 2.3 2 3.6l3.4 3.4A7 7 0 0 0 5 11v5l-2 2v1h14.4l2.9 2.9 1.3-1.3Z"/></svg>
      </span>
      <span class="right">
        <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#fff"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#fff"/><rect x="10" y="3" width="3" height="9" rx="1" fill="rgba(255,255,255,.4)"/><rect x="15" y="0" width="3" height="12" rx="1" fill="rgba(255,255,255,.4)"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="rgba(255,255,255,.45)"/><rect x="2" y="2" width="20" height="9" rx="2.5" fill="#fff"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" fill="rgba(255,255,255,.45)"/></svg>
      </span>
    </div>

    <canvas id="scene" aria-hidden="true"></canvas>
    <div class="fallback" aria-hidden="true">✈</div>

    <button class="skip" id="skip" type="button">Skip</button>

    <div class="copy" aria-live="polite">
      <section class="slide-copy is-active" data-slide="0">
        <h1><span class="ln">Welcome to</span><span class="ln">Traveme!</span></h1>
        <p>Plan smarter, discover better, and make every trip worth remembering.</p>
      </section>
      <section class="slide-copy" data-slide="1">
        <h1><span class="ln">Pack The</span><span class="ln">Possibility</span></h1>
        <p>From places to stay to things to do, keep every part of your journey organized in one place.</p>
      </section>
      <section class="slide-copy" data-slide="2" aria-label="Let's get ready!"></section>
    </div>

    <div class="footer">
      <div class="dots" role="tablist" aria-label="Onboarding progress">
        <span class="dot is-active" role="tab" aria-selected="true" aria-label="Slide 1"></span>
        <span class="dot" role="tab" aria-selected="false" aria-label="Slide 2"></span>
        <span class="dot" role="tab" aria-selected="false" aria-label="Slide 3"></span>
      </div>
      <button class="next" id="next" type="button" aria-label="Next">
        <span class="label">Get started</span>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8h11M9 3.5 13.5 8 9 12.5"/></svg>
      </button>
    </div>
    <div class="home-bar" aria-hidden="true"></div>
  </main>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="app.js"></script>
</body>
</html>
