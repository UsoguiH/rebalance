<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Twisted Metal: Sunsprings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Oswald:wght@400;500;600;700&family=Teko:wght@500;600;700&family=Pirata+One&family=Rye&display=swap">
<style>
  :root { --bg: #0b0806; color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  body { position: relative; font-family: Oswald, sans-serif; }
  #gl, #hud { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #gl { background: #000; }
  #hud { pointer-events: none; }
  #boot {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #b9a98f; font: 500 18px Oswald, sans-serif; letter-spacing: 3px; text-transform: uppercase;
  }
</style>
<script type="importmap">
{ "imports": { "three": "./lib/three.module.min.js", "three/addons/": "./lib/addons/" } }
</script>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="Twisted Metal game view"></canvas>
<canvas id="hud" aria-hidden="true"></canvas>
<div id="boot">Loading&hellip;</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
