<!doctype html><meta charset="utf-8">
<!-- Contact sheet of one loop: sheet.html#clip=jump&n=12&cols=6 (frames evenly over the loop),
     or #clip=jump&from=300&step=33&n=12 for a window at a fixed step. Serve the mascot folder. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@800;900&display=swap">
<body style="margin:0;background:#faeddd;font:12px system-ui">
<canvas id="c"></canvas>
<script src="../js/motion.js"></script>
<script src="../js/sprite-rig.js"></script>
<script src="../js/poses.js"></script>
<script src="../js/stage.js"></script>
<script>
(async () => {
  try { await document.fonts.load('900 15px Tajawal'); } catch (e) {}
  await Stage.load('../art/');
  const q = Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
  const clip = Poses.byId[q.clip || 'idle'];
  const n = +(q.n || 12), cols = +(q.cols || 6), cw = +(q.w || 252), ch = Math.round(cw * 4 / 3);
  const rows = Math.ceil(n / cols);
  const out = document.getElementById('c');
  out.width = cols * cw; out.height = rows * ch;
  const g = out.getContext('2d');
  const cell = document.createElement('canvas'); cell.width = cw; cell.height = ch;
  for (let i = 0; i < n; i++) {
    const t = q.step ? +(q.from || 0) + i * +q.step : (clip.dur * i) / n;
    Stage.draw(cell, clip, t);
    const x = (i % cols) * cw, y = Math.floor(i / cols) * ch;
    g.fillStyle = i % 2 ? '#f7e8d6' : '#faeddd'; g.fillRect(x, y, cw, ch);
    g.drawImage(cell, x, y);
    g.fillStyle = '#7a6a5a'; g.fillText(clip.id + ' ' + Math.round(t) + 'ms', x + 6, y + 14);
  }
  document.title = 'done';
})().catch((e) => { document.title = 'error: ' + e.message; console.error(e); });
</script>
