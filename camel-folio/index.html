<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f7d7a8">
  <meta name="description" content="معرض أعمال تفاعلي ثلاثي الأبعاد: اركب الجمل واستكشف المشاريع في الصحراء.">
  <title>رحلة الجمل</title>
  <link rel="preload" href="fonts/reem-kufi-arabic-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/cairo-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23e07a3f'/%3E%3Cpath d='M14 44v-10c0-6 4-10 9-10 3-6 9-6 11 0 3-4 8-4 10 2l4-8 5 2-4 10v14h-4v-9H22v9z' fill='%23fbeed6'/%3E%3C/svg%3E">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.min.js",
        "three-addons": "./vendor/three-addons.min.js",
        "cannon-es": "./vendor/cannon-es.min.js"
      }
    }
  </script>
</head>
<body>
  <div id="vignette" aria-hidden="true"></div>
  <canvas id="scene" aria-label="عالم ثلاثي الأبعاد: صحراء يمكنك التجول فيها بالجمل"></canvas>

  <!-- Loader / title screen -->
  <div id="loader">
    <div class="loader-card">
      <svg class="logo" viewBox="0 0 120 80" aria-hidden="true">
        <path d="M10 70V52c0-9 6-15 14-15 4-12 16-12 20-2 5-8 14-8 18 2l7-14 3-10h8l3 4-6 6-8 24v27h-6V58h-8v12h-6V58H30v12h-6V58h-8v12z" fill="currentColor"/>
      </svg>
      <h1 id="loader-title">رحلة الجمل</h1>
      <p class="tagline">اركب الجمل واستكشف أعمالي في الصحراء</p>
      <div class="bar"><span id="load-bar"></span></div>
      <p id="load-label" class="load-label" aria-live="polite">جارٍ التحميل…</p>
      <button id="start" disabled>…</button>
      <p class="hint">🔊 التجربة أجمل مع الصوت</p>
    </div>
  </div>

  <div id="nogl" class="nogl" hidden>
    <h1>متصفحك لا يدعم WebGL</h1>
    <p>افتح القائمة لقراءة معرض الأعمال كنص عادي.</p>
  </div>

  <!-- HUD -->
  <div id="hud">
    <button id="btn-menu" class="hud-btn" aria-label="الأقسام" title="الأقسام">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <button id="btn-help" class="hud-btn" aria-label="التحكم" title="التحكم">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14M12 17.5v.01"/></svg>
    </button>
    <button id="btn-sound" class="hud-btn" aria-pressed="true" aria-label="الصوت" title="الصوت">
      <svg class="on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
      <svg class="off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM17 9l5 6M22 9l-5 6"/></svg>
    </button>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="jars" aria-live="polite"></div>

  <button id="prompt" type="button">
    <span class="p-label"></span>
    <span class="p-key"></span>
  </button>

  <!-- Floating joystick (touch / mouse drag) -->
  <div id="joy" aria-hidden="true"><div class="ring"></div><div class="knob"></div></div>

  <div id="touch-buttons">
    <button id="btn-grunt" aria-label="صوت الجمل">🐪</button>
    <button id="btn-jump" aria-label="قفز">قفز</button>
  </div>

  <!-- Content panel -->
  <div id="panel" aria-hidden="true" role="dialog" aria-modal="true">
    <article class="sheet">
      <button id="panel-close" aria-label="إغلاق">✕</button>
      <div id="panel-body"></div>
    </article>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
